<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GrayCo Ad Library</title>
<style>
  :root{--navy:#1E2060;--navy2:#0f1d2f;--copper:#c4a469;--bg:#f5f7fb;--line:#dce3ee;--tx:#1a2332;--mut:#6b7b92;--grn:#1f7a3d}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
  header{background:var(--navy2);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .badge{width:42px;height:42px;border-radius:9px;background:linear-gradient(135deg,var(--copper),#d8c08a);display:flex;align-items:center;justify-content:center;color:var(--navy2);font-weight:800;font-size:17px;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .logo .name{font-size:22px;font-weight:800;letter-spacing:.3px;line-height:1}
  .logo .name b{color:var(--copper)}
  .logo .sub{font-size:9.5px;font-weight:700;letter-spacing:2.4px;color:#9fb2cc;margin-top:3px}
  .htag{color:var(--copper);font-size:12px;font-weight:600;border-left:1px solid #2c4a6e}
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  .bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .fields{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
  .fields label{display:block;font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px}
  .fields input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;min-width:170px}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .opt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--navy);background:#f3f6fc;border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;user-select:none}
  .opt input{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
  .hint{font-size:11px;color:var(--mut)}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--navy)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .grp-label{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;align-self:center;margin-right:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .ad{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .ad-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfe}
  .badge2{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
  .b-fb{background:#e7f0ff;color:#1d4ed8}.b-google{background:#e9f7ee;color:#137333}.b-local{background:#fff1e6;color:#b45309}.b-flyer{background:#f0eaff;color:#6d28d9}
  .cat{font-size:11px;color:var(--mut);font-weight:600}
  .ad-body{padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.5;flex:1}
  .ad-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
  .btn{flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
  .btn-c{background:var(--copper);color:var(--navy2)}
  .btn-c.done{background:var(--grn);color:#fff}
  .count{font-size:12px;color:var(--mut);margin-bottom:10px}
</style>
</head>

var _dynSeed = 0;
function _pick(arr, seed){ return arr[(seed) % arr.length]; }
function buildDynamicAds(){
  var out = [];
  Object.keys(AD_PARTS).forEach(function(cat){
    var p = AD_PARTS[cat];
    // create 2 fresh variations per category each shuffle
    for(var v=0; v<2; v++){
      var s = _dynSeed + v*7 + cat.length*3;
      var text = _pick(p.hook, s) + "\n\n" + _pick(p.body, s+v+1) + "\n\n" + _pick(p.cta, s+v+2);
      out.push({cat:cat, plat:"fb", text:text, _dyn:true});
    }
  });
  return out;
}
function shuffleAds(){
  _dynSeed = Math.floor(Math.random()*100000);
  window._DYN_ADS = buildDynamicAds();
  renderGrid();
}
window._DYN_ADS = [];


var PLAT={fb:"Facebook / IG",google:"Google Ad",local:"Nextdoor / Local",flyer:"Flyer / Text"};
var BADGE={fb:"b-fb",google:"b-google",local:"b-local",flyer:"b-flyer"};
var svcSel="All", platSel="All";
var LIC="\ud83d\udd16 TN License #85034 BCB";

function val(id,def){var el=document.getElementById(id);return (el&&el.value)||def;}
function fill(t){
  return t.replace(/\{PHONE\}/g,val("phone","(901) 585-0944"))
          .replace(/\{AREA\}/g,val("area","Memphis & the Mid-South"))
          .replace(/\{DIRECT\}/g,val("direct","(901) 634-4354 / (901) 692-7255"))
          .replace(/\{EMAIL\}/g,val("email","office@grayco-cs.com"));
}
function adText(a){
  var out=fill(a.text);
  if(document.getElementById("optFree").checked) out+="\n\n\u2705 Free estimates";
  out+="\n\n\ud83d\udcf1 Direct: "+val("direct","(901) 634-4354 / (901) 692-7255")+"\n\ud83d\udce7 "+val("email","office@grayco-cs.com");
  if(document.getElementById("optLic").checked) out+="\n"+LIC;
  return out;
}
function cats(){var s={};ADS.forEach(function(a){s[a.cat]=1;});return Object.keys(s);}

function renderFilters(){
  var sf=document.getElementById("svcFilters");
  sf.innerHTML='<span class="grp-label">Service</span>'+["All"].concat(cats()).map(function(c){return '<span class="chip'+(c===svcSel?" on":"")+'" data-s="'+c+'">'+c+'</span>';}).join("");
  var pf=document.getElementById("platFilters");
  pf.innerHTML='<span class="grp-label">Platform</span>'+["All","fb","google","local","flyer"].map(function(p){var l=p==="All"?"All":PLAT[p];return '<span class="chip'+(p===platSel?" on":"")+'" data-p="'+p+'">'+l+'</span>';}).join("");
  sf.querySelectorAll("[data-s]").forEach(function(c){c.onclick=function(){svcSel=c.getAttribute("data-s");renderFilters();renderGrid();};});
  pf.querySelectorAll("[data-p]").forEach(function(c){c.onclick=function(){platSel=c.getAttribute("data-p");renderFilters();renderGrid();};});
}
function renderGrid(){
  var pool = (window._DYN_ADS && window._DYN_ADS.length ? window._DYN_ADS : []).concat(ADS);
  var list=pool.filter(function(a){return (svcSel==="All"||a.cat===svcSel)&&(platSel==="All"||a.plat===platSel);});
  document.getElementById("count").textContent=list.length+" ready-to-post ad"+(list.length===1?"":"s")+" \u2014 tap Copy and paste into your post.";
  var g=document.getElementById("grid");
  g.innerHTML=list.map(function(a,i){
    return '<div class="ad"><div class="ad-head"><span class="badge2 '+BADGE[a.plat]+'">'+PLAT[a.plat]+'</span>'+(a._dyn?'<span class="badge2" style="background:#d4a017;color:#1a1a1a">✨ FRESH</span>':'')+'<span class="cat">'+a.cat+'</span></div>'
      +'<div class="ad-body">'+adText(a).replace(/</g,"&lt;")+'</div>'
      +'<div class="ad-foot"><button class="btn btn-c" data-i="'+i+'">Copy ad</button></div></div>';
  }).join("");
  g.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){
    var i=+b.getAttribute("data-i");var txt=adText(list[i]);
    function done(){b.textContent="\u2713 Copied!";b.classList.add("done");setTimeout(function(){b.textContent="Copy ad";b.classList.remove("done");},1600);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});}
    else{fallback(txt);done();}
  };});
}
function fallback(txt){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();}

["phone","direct","email","area","optFree","optLic"].forEach(function(id){
  var el=document.getElementById(id);
  el.addEventListener(el.type==="checkbox"?"change":"input",renderGrid);
});
