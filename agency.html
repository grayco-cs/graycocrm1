<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GrayCo Marketing Portal</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="mkt-pages.css">
<style>
.gp-main{max-width:1040px}
.ag-tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid #dce3ee;padding:0 12px;position:sticky;top:0;z-index:5}
.ag-tabs button{border:0;background:none;font:inherit;font-weight:700;color:#55626F;padding:12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.ag-tabs button.on{color:#1E2060;border-bottom-color:#D4A017}
.ag-who{margin-left:auto;font-size:12px;color:#9fb2cc;text-align:right}.ag-who a{color:#D4A017;cursor:pointer}
.gp-kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ag-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.ag-scroll table{min-width:640px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ag-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.ag-bar select,.ag-bar input{width:auto}
.ag-pill{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#eef1f6;color:#334}
.ag-pill.done{background:#dcfce7;color:#166534}.ag-pill.doing{background:#dbeafe;color:#1e40af}.ag-pill.waiting{background:#fef3c7;color:#92400e}.ag-pill.skip{background:#f3f4f6;color:#6b7280}
.ag-plan{border:1px solid #dce3ee;border-radius:10px;padding:10px 12px;margin:0 0 8px;background:#fff}
.ag-plan h3{font-size:15px;margin:0;color:#14202E}.ag-plan .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ag-plan .meta select,.ag-plan .meta input{width:auto;padding:6px 8px;font-size:13px}
.ag-plan textarea{margin-top:6px;font-size:14px;min-height:38px}
.ag-sig{font-size:12px;margin-top:4px}.ag-sig.on{color:#166534}.ag-sig.off{color:#9a3412}
.ag-phase{font-size:13px;font-weight:800;color:#55626F;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.ag-note{border-left:4px solid #c5cde0;padding:6px 10px;margin:0 0 10px;background:#fff;border-radius:0 8px 8px 0}.ag-note.agency{border-left-color:#D4A017}
.ag-note .by{font-size:12px;color:#6b7b92}.ag-note .tx{white-space:pre-wrap}
.ag-set{display:grid;grid-template-columns:1fr;gap:8px}.ag-set div{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #dce3ee;border-radius:10px;padding:10px 12px}
.ag-set b{display:block}.ag-dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:#f59e0b}.ag-dot.on{background:#16a34a}
.ag-report{background:#fff;border:1px solid #dce3ee;border-radius:10px;padding:8px;overflow-x:auto}
@media (max-width:600px){.gp-head .ag-who{display:none}}
</style>
</head><body>
<header class="gp-head"><img src="portal-logo.png" alt="GrayCo Construction Services"><div><b>Marketing Portal</b><span>GrayCo Construction Services</span></div><div class="ag-who" id="who"></div></header>
<div class="gp-gold"></div>
<nav class="ag-tabs" id="tabs" hidden></nav>
<main class="gp-main" id="app"><p class="gp-muted">Loading…</p></main>
<footer class="gp-foot">GrayCo Construction Services · (901) 585-0944 · Marketing numbers only — no customer details are shown here.</footer>
<script>
/* GrayCo marketing AGENCY portal (patch AGY). The agency (Malcolm and team) signs in with an e-mailed link; GrayCo staff
   are signed in already by the CRM on this site. Server: netlify/functions/agency.js + _lib/agency.js. */
(function(){
  'use strict';
  var API = '/.netlify/functions/agency', app = document.getElementById('app'), tabsEl = document.getElementById('tabs');
  var SKEY = 'gc_agency_session', ME = null, TAB = (location.hash || '#results').slice(1);
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(v){ return v == null ? '—' : '$' + Math.round(+v || 0).toLocaleString('en-US'); }
  function pct(v){ return v == null ? '—' : (+v).toFixed(0) + '%'; }
  function n(v){ return v == null ? '—' : (+v).toLocaleString('en-US'); }
  function get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function crmToken(){ try { var j = JSON.parse(get('gc_auth_v1') || 'null'); if (j && j.access_token) { var exp = +(j.expires_at || 0); if (exp && exp < 1e12) exp *= 1000; if (!exp || exp > Date.now() + 30e3) return j.access_token; } } catch (e) {} return ''; }
  function call(body){
    var h = { 'Content-Type': 'application/json' }, sess = get(SKEY), tok = sess ? '' : crmToken();
    if (sess) h['x-agency-session'] = sess; else if (tok) h.Authorization = 'Bearer ' + tok;
    return fetch(API, { method: 'POST', headers: h, body: JSON.stringify(body) }).then(function(r){
      return r.json().catch(function(){ return { ok: false, error: 'No answer from the server.' }; }).then(function(j){ if (r.status === 401 && j.signin && sess) { put(SKEY, null); } j.status = r.status; return j; });
    }, function(){ return { ok: false, error: 'No connection — try again.' }; });
  }
  function busy(el){ el.innerHTML = '<p class="gp-muted">Loading…</p>'; }
  function err(j){ return '<div class="gp-warn">' + esc(j.error || 'Something went wrong.') + '</div>'; }

  /* ── sign-in ── */
  function signIn(msg){
    tabsEl.hidden = true; document.getElementById('who').innerHTML = '';
    var crm = get('gc_auth_v1');
    app.innerHTML = (msg ? '<div class="gp-warn">' + esc(msg) + '</div>' : '') +
      '<div class="gp-card"><h2>Sign in</h2><p>Marketing team: enter your e-mail and we will send you a sign-in link.</p>' +
      '<label for="em">E-mail</label><input id="em" type="email" autocomplete="email"><input id="hp" class="gp-hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<button id="go" class="gp-btn">E-mail me a link</button><p id="out" class="gp-muted" role="status"></p></div>' +
      '<div class="gp-card"><h2>GrayCo staff</h2><p>' + (crm ? 'Your CRM sign-in has timed out on this browser. <a href="/">Open the CRM</a> (it renews it), then come back to this page.' : 'Sign in to the <a href="/">GrayCo CRM</a> on this browser first, then open this page again.') + '</p></div>';
    document.getElementById('go').onclick = function(){
      var b = this; b.disabled = true;
      call({ op: 'link', email: document.getElementById('em').value, website: document.getElementById('hp').value }).then(function(j){ document.getElementById('out').textContent = j.message || j.error || 'Sent.'; b.disabled = false; });
    };
  }
  function boot(){
    var q = new URLSearchParams(location.search), k = q.get('k');
    if (k) {
      history.replaceState(null, '', location.pathname + location.hash);
      app.innerHTML = '<p class="gp-muted">Signing you in…</p>';
      return call({ op: 'exchange', k: k }).then(function(j){ if (j.ok && j.session) { put(SKEY, j.session); start(); } else signIn(j.error); });
    }
    start();
  }
  function start(){
    if (!get(SKEY) && !crmToken()) return signIn('');
    call({ op: 'me' }).then(function(j){
      if (!j.ok) { if (j.status === 401 || j.status === 403) { put(SKEY, null); return signIn(j.status === 403 ? j.error : ''); } app.innerHTML = err(j); return; }
      ME = j;
      document.getElementById('who').innerHTML = esc(j.who.name) + ' · ' + esc(j.who.company) + (j.who.kind === 'agency' ? '<br><a id="out">Sign out</a>' : '');
      var o = document.getElementById('out'); if (o) o.onclick = function(){ put(SKEY, null); signIn('Signed out.'); };
      drawTabs(); show(TAB);
    });
  }

  /* ── tabs ── */
  var TABS = [['results', '📊 Results'], ['plan', '✅ Plan'], ['spend', '💵 Spend'], ['calls', '📞 Calls'], ['setup', '🔌 Setup'], ['notes', '💬 Notes'], ['report', '🗓 Monthly report'], ['team', '👥 Team & settings']];
  function drawTabs(){
    tabsEl.hidden = false;
    tabsEl.innerHTML = TABS.filter(function(t){ return t[0] !== 'team' || ME.who.admin; }).map(function(t){ return '<button data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    tabsEl.onclick = function(e){ var b = e.target.closest('button'); if (b) { location.hash = b.dataset.t; } };
  }
  window.addEventListener('hashchange', function(){ if (ME) show((location.hash || '#results').slice(1)); });
  function show(t){
    if (!VIEWS[t] || (t === 'team' && !ME.who.admin)) t = 'results';
    TAB = t; [].forEach.call(tabsEl.children, function(b){ b.classList.toggle('on', b.dataset.t === t); });
    busy(app); VIEWS[t]();
  }

  var VIEWS = {};
  /* ── results ── */
  var MONTHS = 12;
  VIEWS.results = function(){
    call({ op: 'dashboard', months: MONTHS }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      var S = j.summary, T = S.totals, M = S.thisMonth, rev = S.shareRevenue, gp = S.shareProfit;
      var h = '<div class="ag-bar"><b>Results by lead source</b><select id="mo">' + [3, 6, 12, 24].map(function(m){ return '<option value="' + m + '"' + (m === MONTHS ? ' selected' : '') + '>Last ' + m + ' months</option>'; }).join('') + '</select><span class="gp-muted">' + esc(S.from) + ' to ' + esc(S.to) + '</span></div>';
      h += '<div class="gp-kpis"><div><b>' + n(T.leads) + '</b><span>leads</span></div><div><b>' + n(T.won) + '</b><span>jobs won</span></div>' + (rev ? '<div><b>' + money(T.revenue) + '</b><span>revenue from won jobs</span></div>' : '') +
        '<div><b>' + money(T.spend) + '</b><span>marketing spend</span></div><div><b>' + money(T.cpl) + '</b><span>cost per lead</span></div><div><b>' + n(M.leads) + '</b><span>leads this month</span></div></div>';
      if (S.warnings.length) h += '<div class="gp-warn">' + S.warnings.map(esc).join('<br>') + '</div>';
      h += '<div class="gp-card"><h2>By source</h2><div class="ag-scroll"><table><tr><th>Source</th><th class="n">Leads</th><th class="n">Appts</th><th class="n">Estimates</th><th class="n">Won</th><th class="n">Close rate</th>' + (rev ? '<th class="n">Revenue</th><th class="n">Avg job</th>' : '') + '<th class="n">Spend</th><th class="n">Cost / lead</th><th class="n">Cost / job</th>' + (rev ? '<th class="n">$ back per $1</th>' : '') + (gp ? '<th class="n">Gross profit</th><th class="n">ROI</th>' : '') + '</tr>' +
        S.channels.map(function(c){ return '<tr><td>' + esc(c.channel) + '</td><td class="n">' + n(c.leads) + '</td><td class="n">' + n(c.appts) + '</td><td class="n">' + n(c.estimates) + '</td><td class="n">' + n(c.won) + '</td><td class="n">' + pct(c.closeRate) + '</td>' +
          (rev ? '<td class="n">' + money(c.revenue) + '</td><td class="n">' + money(c.avgJob) + '</td>' : '') + '<td class="n">' + (c.spend ? money(c.spend) : '—') + '</td><td class="n">' + money(c.cpl) + '</td><td class="n">' + money(c.costPerWon) + '</td>' +
          (rev ? '<td class="n">' + (c.roas == null ? '—' : '$' + (+c.roas).toFixed(2)) + '</td>' : '') + (gp ? '<td class="n">' + money(c.gp) + '</td><td class="n">' + pct(c.roi) + '</td>' : '') + '</tr>'; }).join('') + '</table></div>' +
        '<p class="gp-muted">A lead counts in the month it came in. "Cost / job" = spend ÷ jobs won from that source. Sources come from the lead (website form, tracking number, how they heard about us).</p></div>';
      if (S.campaigns.length) h += '<div class="gp-card"><h2>Ad campaigns</h2><div class="ag-scroll"><table><tr><th>Campaign</th><th>Channel</th><th class="n">Spend</th><th class="n">Clicks</th><th class="n">CTR</th><th class="n">CPC</th><th class="n">Platform conv.</th><th class="n">CRM leads</th><th class="n">Won</th><th class="n">CRM cost/lead</th>' + (rev ? '<th class="n">$ back per $1</th>' : '') + '</tr>' +
        S.campaigns.map(function(c){ return '<tr><td>' + esc(c.campaign) + '</td><td>' + esc(c.channel) + '</td><td class="n">' + money(c.spend) + '</td><td class="n">' + n(c.clicks) + '</td><td class="n">' + pct(c.ctr) + '</td><td class="n">' + (c.cpc == null ? '—' : '$' + (+c.cpc).toFixed(2)) + '</td><td class="n">' + n(c.platformConversions) + '</td><td class="n">' + n(c.crmLeads) + '</td><td class="n">' + n(c.crmWon) + '</td><td class="n">' + money(c.crmCpl) + '</td>' + (rev ? '<td class="n">' + (c.roas == null ? '—' : '$' + (+c.roas).toFixed(2)) + '</td>' : '') + '</tr>'; }).join('') + '</table></div><p class="gp-muted">CRM leads match a campaign when the lead carries its utm_campaign (keep the final URL suffix on every campaign).</p></div>';
      h += '<div class="gp-card"><h2>Recent leads</h2><div class="ag-scroll"><table><tr><th>Date</th><th>Source</th><th>Campaign</th><th>Area</th><th>Kind</th><th>Stage</th>' + (rev ? '<th class="n">Revenue</th>' : '') + '</tr>' +
        S.recent.map(function(r){ return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.source) + '</td><td>' + esc(r.campaign) + '</td><td>' + esc([r.city, r.zip].filter(Boolean).join(' ')) + '</td><td>' + esc(r.kind) + '</td><td>' + esc(r.stage) + '</td>' + (rev ? '<td class="n">' + (r.revenue ? money(r.revenue) : '') + '</td>' : '') + '</tr>'; }).join('') + '</table></div><p class="gp-muted">No names or street addresses — the CRM keeps those.</p></div>';
      app.innerHTML = h;
      document.getElementById('mo').onchange = function(){ MONTHS = +this.value; show('results'); };
    });
  };

  /* ── plan ── */
  var PHASES = { 1: 'Phase 1 — this week (foundation)', 2: 'Phase 2 — weeks 2–4 (Business Profile, LSA, reviews)', 3: 'Phase 3 — month 2 (paid ads & tracking)', 4: 'Phase 4 — ongoing (the books)' };
  VIEWS.plan = function(){
    call({ op: 'plan' }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      var P = j.plan, open = P.filter(function(p){ return p.status !== 'done' && p.status !== 'skip'; }).length;
      var h = '<div class="ag-bar"><b>The marketing plan</b><span class="gp-muted">' + open + ' open · ' + (P.length - open) + ' done or skipped · changes save on their own</span><button class="gp-btn o" id="add" style="margin-left:auto">+ Add an item</button></div>';
      [1, 2, 3, 4].forEach(function(ph){
        var items = P.filter(function(p){ return (p.phase || 1) === ph; }); if (!items.length) return;
        h += '<div class="ag-phase">' + esc(PHASES[ph]) + '</div>' + items.map(planCard).join('');
      });
      app.innerHTML = h;
      document.getElementById('add').onclick = function(){ var t = prompt('What needs to be done?'); if (t) savePlan({ title: t }, true); };
      app.querySelectorAll('[data-id]').forEach(function(card){
        var id = card.getAttribute('data-id');
        card.querySelectorAll('select,input').forEach(function(el){ el.onchange = function(){ var o = { id: id }; o[el.name] = el.value; savePlan(o); }; });
        var ta = card.querySelector('textarea'); if (ta) ta.onchange = function(){ savePlan({ id: id, notes: ta.value }); };
        var del = card.querySelector('.del'); if (del) del.onclick = function(){ if (confirm('Delete this plan item?')) savePlan({ id: id, del: true }, true); };
      });
    });
  };
  function planCard(p){
    var sel = function(name, list, val, lab){ return '<select name="' + name + '" aria-label="' + lab + '">' + list.map(function(x){ return '<option' + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>'; };
    return '<div class="ag-plan" data-id="' + esc(p.id) + '"><h3><span class="ag-pill ' + esc(p.status) + '">' + esc(p.status) + '</span> ' + esc(p.title) + '</h3>' +
      (p.how ? '<div class="gp-muted">' + esc(p.how) + '</div>' : '') +
      (p.signal ? '<div class="ag-sig ' + (p.signal.on ? 'on' : 'off') + '">' + (p.signal.on ? '✓ ' : '• ') + 'CRM sees: ' + esc(p.signal.note) + '</div>' : '') +
      '<div class="meta">' + sel('status', ME.statuses, p.status, 'Status') + sel('owner', ME.owners, p.owner, 'Owner') + '<input type="date" name="due" value="' + esc(p.due || '') + '" aria-label="Due date">' +
      '<span class="gp-muted">' + (p.by ? 'last change ' + esc(String(p.at || '').slice(0, 10)) + ' by ' + esc(p.by) : '') + '</span>' + (ME.who.admin ? ' <a class="del" href="javascript:void 0" style="margin-left:auto;font-size:12px">delete</a>' : '') + '</div>' +
      '<textarea placeholder="Notes, links, what is blocking…" aria-label="Notes">' + esc(p.notes || '') + '</textarea></div>';
  }
  function savePlan(item, redraw){ call({ op: 'plan_save', item: item }).then(function(j){ if (!j.ok) alert(j.error || 'Not saved.'); if (redraw || item.status) show('plan'); }); }

  /* ── spend ── */
  VIEWS.spend = function(){
    call({ op: 'spend' }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); var lastM = d.toISOString().slice(0, 7);
      var h = '<div class="gp-card"><h2>Add spend</h2><p class="gp-muted">One line per channel per month. Google Ads and Facebook come in by themselves once they are connected in the CRM\'s Ads hub — add the rest here: Local Services Ads, the agency fee, print, call tracking. It counts in the CRM\'s Marketing dashboard too.</p>' +
        '<div class="ag-bar"><input type="month" id="sm" value="' + lastM + '" aria-label="Month"><select id="sc" aria-label="Channel">' + ME.channels.map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('') + '</select>' +
        '<input id="sa" type="number" min="0" step="0.01" placeholder="Amount $" aria-label="Amount" style="width:130px"><input id="sp" placeholder="Campaign (optional)" aria-label="Campaign"><input id="sn" placeholder="Note (optional)" aria-label="Note"><button class="gp-btn" id="sadd" style="margin:0">Add</button></div><p id="sout" class="gp-muted" role="status"></p></div>';
      h += '<div class="gp-card"><h2>Spend log</h2><div class="ag-scroll"><table><tr><th>Month</th><th>Channel</th><th>Campaign</th><th class="n">Amount</th><th>From</th><th></th></tr>' +
        j.spend.map(function(x){ return '<tr><td>' + esc(x.month) + '</td><td>' + esc(x.channel) + '</td><td>' + esc(x.campaign) + (x.note ? '<div class="gp-muted">' + esc(x.note) + '</div>' : '') + '</td><td class="n">' + money(x.amount) + '</td><td class="gp-muted">' + esc(x.origin === 'agency' ? 'this page' + (x.by ? ' · ' + x.by : '') : x.origin === 'google_api' ? 'Google Ads (auto)' : x.origin === 'meta_api' ? 'Facebook (auto)' : 'CRM') + '</td><td>' + (x.mine || (ME.who.admin && x.origin === 'agency') ? '<a href="javascript:void 0" data-del="' + esc(x.id) + '">remove</a>' : '') + '</td></tr>'; }).join('') +
        (j.spend.length ? '' : '<tr><td colspan="6" class="gp-muted">No spend logged yet.</td></tr>') + '</table></div></div>';
      app.innerHTML = h;
      document.getElementById('sadd').onclick = function(){
        var b = this; b.disabled = true;
        call({ op: 'spend_add', month: document.getElementById('sm').value, channel: document.getElementById('sc').value, amount: document.getElementById('sa').value, campaign: document.getElementById('sp').value, note: document.getElementById('sn').value })
          .then(function(r){ b.disabled = false; if (r.ok) show('spend'); else document.getElementById('sout').textContent = r.error || 'Not saved.'; });
      };
      app.querySelectorAll('[data-del]').forEach(function(a){ a.onclick = function(){ if (confirm('Remove this spend line?')) call({ op: 'spend_del', id: a.getAttribute('data-del') }).then(function(r){ if (!r.ok) alert(r.error); show('spend'); }); }; });
    });
  };

  /* ── calls ── */
  VIEWS.calls = function(){
    call({ op: 'calls' }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      var by = {}; j.calls.forEach(function(c){ var k = c.source || 'unknown'; by[k] = (by[k] || 0) + 1; });
      var h = '<div class="gp-card"><h2>Calls by source</h2><div class="gp-kpis">' + Object.keys(by).sort(function(a, b){ return by[b] - by[a]; }).map(function(k){ return '<div><b>' + by[k] + '</b><span>' + esc(k) + '</span></div>'; }).join('') + '</div>' + (j.calls.length ? '' : '<p class="gp-muted">No tracked calls yet. Calls appear here once the Twilio tracking numbers (or CallRail) are in use.</p>') + '</div>';
      h += '<div class="gp-card"><h2>Recent calls</h2><div class="ag-scroll"><table><tr><th>When</th><th>Source</th><th>Via</th><th>Caller</th><th>Keyword / campaign</th><th class="n">Length</th><th>First call</th><th>Lead made</th></tr>' +
        j.calls.slice(0, 200).map(function(c){ return '<tr><td>' + esc(String(c.at).replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(c.source) + '</td><td>' + esc(c.via) + '</td><td>…' + esc(c.from) + '</td><td>' + esc([c.keyword, c.campaign].filter(Boolean).join(' · ')) + '</td><td class="n">' + (c.duration == null ? '' : Math.round(c.duration / 60) + ' min') + '</td><td>' + (c.firstCall == null ? '' : c.firstCall ? 'yes' : 'no') + '</td><td>' + (c.lead ? '✓' : '') + '</td></tr>'; }).join('') + '</table></div><p class="gp-muted">Times are UTC. Only the last 4 digits of the caller are shown.</p></div>';
      app.innerHTML = h;
    });
  };

  /* ── setup ── */
  var SETUP = [['website_lead', 'Website form → CRM', 'website/README.md'], ['twilio', 'Twilio tracking numbers', 'CRM → Marketing → Tracked links, QR & numbers'], ['gads', 'Google Ads connected to the CRM', 'CRM → Marketing → 📈 Ads hub'],
    ['meta', 'Facebook / Instagram ads connected', 'CRM → Marketing → 📈 Ads hub'], ['callrail', 'CallRail → CRM', 'docs/CALLRAIL.md'], ['lsa', 'Local Services Ads spend logged', 'Spend tab'], ['report', 'Monthly report', 'Monthly report tab']];
  VIEWS.setup = function(){
    call({ op: 'setup' }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      app.innerHTML = '<div class="gp-card"><h2>What is switched on</h2><p class="gp-muted">Read live from the CRM.</p><div class="ag-set">' + SETUP.map(function(x){ var v = j.setup[x[0]] || { on: false, note: 'Unknown' };
        return '<div><span class="ag-dot' + (v.on ? ' on' : '') + '"></span><span><b>' + esc(x[1]) + '</b><span class="gp-muted">' + esc(v.note) + ' · where: ' + esc(x[2]) + '</span></span></div>'; }).join('') + '</div></div>';
    });
  };

  /* ── notes ── */
  VIEWS.notes = function(){
    call({ op: 'notes' }).then(function(j){
      if (!j.ok) { app.innerHTML = err(j); return; }
      app.innerHTML = '<div class="gp-card"><h2>Notes</h2><p class="gp-muted">Between GrayCo and the agency. A new note is e-mailed to the other side.</p><textarea id="nt" rows="3" placeholder="Write a note…"></textarea><button class="gp-btn" id="ns">Post note</button><p id="no" class="gp-muted" role="status"></p></div>' +
        j.notes.slice().reverse().map(function(x){ return '<div class="ag-note ' + esc(x.side) + '"><div class="by">' + esc(x.name) + ' · ' + esc(String(x.at).replace('T', ' ').slice(0, 16)) + ' UTC</div><div class="tx">' + esc(x.text) + '</div></div>'; }).join('');
      document.getElementById('ns').onclick = function(){ var b = this; b.disabled = true; call({ op: 'note_add', text: document.getElementById('nt').value }).then(function(r){ b.disabled = false; if (r.ok) show('notes'); else document.getElementById('no').textContent = r.error; }); };
    });
  };

  /* ── report ── */
  VIEWS.report = function(){
    var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); var m = d.toISOString().slice(0, 7);
    app.innerHTML = '<div class="ag-bar"><b>Monthly report</b><input type="month" id="rm" value="' + m + '" aria-label="Month"><button class="gp-btn o" id="rp" style="margin:0">Show</button>' + (ME.who.admin ? '<button class="gp-btn" id="rs" style="margin:0">E-mail it now</button>' : '') +
      '<span class="gp-muted">E-mailed by itself on the 1st of every month.' + (ME.lastReport ? ' Last: ' + esc(ME.lastReport.month) + ' on ' + esc(String(ME.lastReport.at).slice(0, 10)) : '') + '</span></div><div class="ag-report" id="rb"><p class="gp-muted">Loading…</p></div>';
    function load(){ busy(document.getElementById('rb')); call({ op: 'report_preview', month: document.getElementById('rm').value }).then(function(j){ document.getElementById('rb').innerHTML = j.ok ? j.html : err(j); }); }
    document.getElementById('rp').onclick = load; load();
    var rs = document.getElementById('rs'); if (rs) rs.onclick = function(){ if (!confirm('E-mail this report to the admins, the agency and the report list now?')) return; rs.disabled = true; call({ op: 'report_send', month: document.getElementById('rm').value }).then(function(j){ rs.disabled = false; alert(j.ok ? 'Sent to ' + j.to.join(', ') : (j.error || 'Not sent.')); }); };
  };

  /* ── team & settings (admins) ── */
  VIEWS.team = function(){
    Promise.all([call({ op: 'members' }), call({ op: 'log' })]).then(function(r){
      var j = r[0], lg = r[1]; if (!j.ok) { app.innerHTML = err(j); return; }
      var st = j.settings;
      var h = '<div class="gp-card"><h2>Agency people</h2><p class="gp-muted">They sign in with an e-mailed link and see marketing numbers only — no customer names, phones or addresses. Turn someone off to lock them out at once.</p>' +
        '<table><tr><th>E-mail</th><th>Name</th><th>Company</th><th>On</th><th></th></tr>' + j.members.map(function(m){ return '<tr><td>' + esc(m.email) + '</td><td>' + esc(m.name) + '</td><td>' + esc(m.company) + '</td><td>' + (m.active !== false ? '✓' : '—') + '</td><td><a href="javascript:void 0" data-tog="' + esc(m.email) + '" data-on="' + (m.active !== false ? '1' : '') + '">' + (m.active !== false ? 'turn off' : 'turn on') + '</a></td></tr>'; }).join('') + '</table>' +
        '<div class="ag-bar" style="margin-top:12px"><input id="me" type="email" placeholder="name@agency.com" aria-label="E-mail"><input id="mn" placeholder="Name" aria-label="Name"><input id="mc" placeholder="Company" value="AdVentures Media" aria-label="Company"><button class="gp-btn" id="ma" style="margin:0">Add</button></div><p class="gp-muted">After adding, tell them to open <b>' + esc(location.origin) + '/agency</b> and ask for a link.</p></div>';
      h += '<div class="gp-card"><h2>What the agency sees</h2><label class="gp-check"><input type="checkbox" id="sr"' + (st.shareRevenue !== false ? ' checked' : '') + '> Revenue from won jobs and $ back per $1 (needed to judge which ads pay)</label>' +
        '<label class="gp-check"><input type="checkbox" id="sg"' + (st.shareProfit ? ' checked' : '') + '> Gross profit and ROI (job costs)</label>' +
        '<label for="rt">Also e-mail the monthly report to (your bookkeeper, comma list)</label><input id="rt" value="' + esc(st.reportTo || '') + '" placeholder="bookkeeper@example.com"><button class="gp-btn" id="ss">Save settings</button><p id="so" class="gp-muted" role="status"></p></div>';
      h += '<div class="gp-card"><h2>Activity</h2><table>' + (lg.ok ? lg.log : []).slice(0, 60).map(function(x){ return '<tr><td class="gp-muted">' + esc(String(x.at).replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(x.by) + '</td><td>' + esc(x.what) + '</td></tr>'; }).join('') + '</table></div>';
      app.innerHTML = h;
      document.getElementById('ma').onclick = function(){ call({ op: 'member_save', email: document.getElementById('me').value, name: document.getElementById('mn').value, company: document.getElementById('mc').value, active: true }).then(function(r){ if (!r.ok) alert(r.error); show('team'); }); };
      app.querySelectorAll('[data-tog]').forEach(function(a){ a.onclick = function(){ call({ op: 'member_save', email: a.getAttribute('data-tog'), active: !a.getAttribute('data-on') }).then(function(r){ if (!r.ok) alert(r.error); show('team'); }); }; });
      document.getElementById('ss').onclick = function(){ call({ op: 'settings_save', shareRevenue: document.getElementById('sr').checked, shareProfit: document.getElementById('sg').checked, reportTo: document.getElementById('rt').value }).then(function(r){ document.getElementById('so').textContent = r.ok ? 'Saved.' : (r.error || 'Not saved.'); }); };
    });
  };

  boot();
})();
</script>
</body></html>
