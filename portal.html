<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1D2F">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data: blob:; frame-src https://docs.google.com https://drive.google.com; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Your GrayCo project</title>
<style>
:root{--navy:#0F1D2F;--navy2:#1A3A5F;--line:#22344D;--gold:#D4A017;--goldDk:#8A5A00;--goldBg:#FCF0CF;--bg:#F6F3EC;--ink:#14202E;--mute:#55626F;--soft:#C9D3DF;--card:#FFFFFF;--rule:#EFEAE0;--edge:#E2DCCD;--green:#1D5E2C;--greenBg:#E3F1E6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Public Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--navy2)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
header .logo{width:190px;max-width:52vw;height:auto;display:block}
.call{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:22px;background:var(--navy2);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.hello .sm{font-size:13px;color:var(--soft)}
.hello .big{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
main{flex:1 1 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,29,47,.08);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.card h3{margin:4px 0 0;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--mute);font-size:13px;line-height:1.45}
.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.now{color:var(--goldDk);background:var(--goldBg)}
.pill.ok{color:var(--green);background:var(--greenBg)}
.pill.due{color:#8a1c1c;background:#fbe3e3}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps li{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:14px;height:14px;border-radius:7px;flex:0 0 14px;border:2px solid #B8B1A2;background:#fff}
li.done .dot{background:var(--green);border-color:var(--green)}
li.done{color:#2F3B47}
li.now .dot{background:var(--gold);border-color:var(--goldDk)}
li.now{font-weight:700}
li.todo{color:#6B7682}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);font-weight:600;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 14px;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:24px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 48px}
.cc{background:var(--navy);color:#fff;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;text-decoration:none;border:0;font:inherit;text-align:left;width:100%;cursor:pointer}
.cc .t{font-size:15px;font-weight:700}.cc .s{font-size:12px;color:var(--soft)}
.post{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.post:first-of-type{border-top:0;padding-top:0}
.post p{margin:0;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pics button{padding:0;border:0;background:#E9E4D8;border-radius:8px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;display:block;width:100%}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.doc{min-height:52px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:10px}
.doc:first-of-type{border-top:0;padding-top:0}
.doc .n{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.doc .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc .act{display:flex;gap:6px;flex:0 0 auto}
.doc .act .btn{min-height:40px;font-size:14px;padding:0 12px}
iframe.prev{width:100%;height:420px;border:1px solid var(--edge);border-radius:10px;background:#fff}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money div{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.money b{font-size:18px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.line > span:last-child{font-weight:600;white-space:nowrap}
.how{background:var(--navy);color:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.box{border:1px solid var(--edge);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
dl.info{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:14px}
dl.info dt{color:var(--mute)}dl.info dd{margin:0;overflow-wrap:anywhere;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--edge);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{min-height:48px;border:none;background:transparent;font-family:inherit;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:500;font-size:13px}
nav.tabs button[aria-selected="true"]{color:var(--navy);font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:12px 0}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,#ece7dc,#f4f0e8,#ece7dc);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.lb{position:fixed;inset:0;background:rgba(6,12,20,.96);z-index:20;display:flex;flex-direction:column}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;color:#fff;font-size:14px}
.lb .top button{min-width:44px;min-height:44px;border-radius:22px;border:0;background:#1A3A5F;color:#fff;font-size:20px;cursor:pointer}
.lb .ph{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .nav{display:flex;justify-content:space-between;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.lb .nav button{min-width:96px;min-height:44px;border-radius:10px;border:0;background:#1A3A5F;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.off{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.off p{font-size:17px;line-height:1.45;margin:0}
/* patch INSP: the insurance-claim view */
.pill.ins{color:#fff;background:var(--navy2)}.pill.skip{color:var(--mute);background:var(--rule)}
li.skipped{color:#8A939C}li.skipped .dot{border-style:dashed}
ol.steps li .note{margin-left:auto;font-weight:400;font-size:12px;white-space:nowrap}
.grp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.grp h3{margin:0;font-size:13px;font-weight:700;color:var(--goldDk);text-transform:uppercase;letter-spacing:.03em}
.grp .doc:first-of-type{border-top:0;padding-top:0}
.box.endorse{border-color:var(--gold);background:var(--goldBg)}
.line.total{font-weight:700}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.nextp{margin:0;font-size:15px;line-height:1.5}
.pvbar{background:var(--goldBg);color:var(--goldDk);font-size:13px;font-weight:600;text-align:center;padding:8px 12px}
[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
'use strict';
var FN = '/.netlify/functions/portal';
var OFFICE = '901-585-0944';
var V = null, PHOTOS = null, TAB = 'home', token = '';
var PREVIEW = /(?:^#|&)p=1(?:&|$)/.test(location.hash || '');   /* patch INSP: "Preview as customer" from the CRM */

/* the link code lives after the # — it never reaches a server log or another site */
try { var m = /(?:^#|&)t=([A-Za-z0-9_-]{20,80})/.exec(location.hash || ''); if (m) token = m[1]; } catch (e) {}
try { if (token) localStorage.setItem('gc_portal_t', token); else token = localStorage.getItem('gc_portal_t') || ''; } catch (e) {}

function $(id){ return document.getElementById(id); }
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k]; if (v == null || v === false) return;
    if (k === 'text') el.textContent = v;
    else if (k === 'on') Object.keys(v).forEach(function(e){ el.addEventListener(e, v[e]); });
    else if ((k === 'href' || k === 'src') && !safeUrl(v)) return;
    else el.setAttribute(k, v === true ? '' : String(v));
  });
  (kids || []).forEach(function(c){ if (c == null || c === false) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}
function safeUrl(u){ return /^(https:\/\/|tel:|sms:|mailto:|#)/i.test(String(u || '')); }
function usd(n){ n = Number(n) || 0; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dt(s){ if (!s) return ''; var d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function when(s){ var d = new Date(s); if (isNaN(d)) return ''; var days = Math.floor((Date.now() - d) / 864e5); if (days <= 0) return 'Today'; if (days === 1) return 'Yesterday'; return dt(s); }
function tel(p){ return 'tel:' + String(p || '').replace(/[^0-9+]/g, ''); }
function card(title, kids, extra){ return h('section', { class: 'card' }, [title ? h('h2', { text: title }) : null].concat(kids || [])); }

function api(action){
  return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-portal-token': token }, body: JSON.stringify(PREVIEW ? { action: action, preview: true } : { action: action }), cache: 'no-store', credentials: 'omit' })
    .then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){ return { status: r.status, data: j }; }); });
}

function notActive(msg){
  $('main').innerHTML = '';
  $('main').appendChild(h('div', { class: 'off' }, [
    h('p', { text: msg || ('This link is not active — call GrayCo ' + OFFICE) }),
    h('a', { class: 'btn gold', href: 'tel:9015850944', text: 'Call GrayCo ' + OFFICE })
  ]));
}

/* ── HOME ─────────────────────────────────────────────────────────────── */
function tracker(){
  var j = V.job, list = h('ol', { class: 'steps' });
  (j.stages || []).forEach(function(n, i){
    var cls = i < j.stage ? 'done' : (i === j.stage ? 'now' : 'todo');
    list.appendChild(h('li', { class: cls }, [h('span', { class: 'dot', 'aria-hidden': 'true' }), h('span', { text: n + (i === j.stage ? ' — now' : '') })]));
  });
  return h('section', { class: 'card', id: 'track' }, [
    h('div', { class: 'row' }, [h('h2', { text: 'Where your job is' }), h('span', { class: 'pill now', text: j.stageName || '' })]), list]);
}
function postEl(p){
  var kids = [h('div', { class: 'row' }, [h('b', { style: 'font-size:13px', text: (p.by ? p.by + ' · ' : '') + 'your GrayCo team' }), h('span', { class: 'muted', text: when(p.at) })])];
  if (p.text) kids.push(h('p', { text: p.text }));
  if (p.photos && p.photos.length) {
    var g = h('div', { class: 'pics' });
    p.photos.forEach(function(u, i){ g.appendChild(h('button', { type: 'button', 'aria-label': 'Open photo', on: { click: function(){ lightbox(p.photos.map(function(x){ return { f: x }; }), i); } } }, [h('img', { src: u, alt: '', loading: 'lazy' })])); });
    kids.push(g);
  }
  return h('div', { class: 'post' }, kids);
}
function home(){
  var out = V.insurance ? insHome() : [tracker()];   /* patch INSP */
  var posts = V.posts || [];
  out.push(card('Updates from your team', posts.length ? posts.slice(0, 10).map(postEl) : [h('div', { class: 'empty', text: 'Your Project Manager posts updates and photos here.' })]));
  var pm = V.pm || {}, phone = pm.phone || OFFICE;
  var ini = (pm.name || 'PM').split(/\s+/).map(function(x){ return x[0] || ''; }).join('').slice(0, 2).toUpperCase();
  out.push(card(null, [
    h('div', { class: 'pm' }, [h('div', { class: 'av', text: ini || 'PM' }), h('div', { style: 'flex:1 1 auto;min-width:0' }, [
      h('div', { class: 'muted', text: 'Your Project Manager' }), h('div', { style: 'font-size:15px;font-weight:700', text: pm.name || 'GrayCo office' })])]),
    h('div', { class: 'btns' }, [h('a', { class: 'btn gold', href: tel(phone), text: 'Call' }), h('a', { class: 'btn', href: 'sms:' + String(phone).replace(/[^0-9+]/g, ''), text: 'Text' })])
  ]));
  out.push(h('button', { type: 'button', class: 'cc', on: { click: function(){ go('photos'); } } }, [
    h('span', { 'aria-hidden': 'true', style: 'color:#D4A017;font-size:22px', text: '📷' }),
    h('span', { style: 'flex:1 1 auto;display:flex;flex-direction:column;gap:2px' }, [h('span', { class: 't', text: 'See your job photos' }), h('span', { class: 's', text: 'Every photo from your CompanyCam project' })]),
    h('span', { 'aria-hidden': 'true', style: 'color:#D4A017;font-size:20px', text: '›' })]));
  if (V.companyCam && V.companyCam.url) out.push(h('a', { class: 'btn', href: V.companyCam.url, target: '_blank', rel: 'noopener', text: 'Open in CompanyCam' }));
  if (V.showReview && V.review) out.push(card('Thank you for choosing GrayCo!', [
    h('p', { class: 'muted', style: 'margin:0', text: 'If you were happy with our work, a quick review helps a lot.' }),
    h('a', { class: 'btn gold', href: V.review.google, target: '_blank', rel: 'noopener', text: '★ Leave a Google review' }),
    h('a', { class: 'btn', href: V.review.facebook, target: '_blank', rel: 'noopener', text: 'Find us on Facebook' })]));
  var c = V.customer || {};
  out.push(card('Your info', [
    h('dl', { class: 'info' }, [h('dt', { text: 'Name' }), h('dd', { text: c.name || '—' }), h('dt', { text: 'Address' }), h('dd', { text: c.address || '—' }),
      h('dt', { text: 'Phone' }), h('dd', { text: c.phone || '—' }), h('dt', { text: 'Email' }), h('dd', { text: c.email || '—' })]),
    h('div', { class: 'muted' }, ['Something wrong? ', h('a', { href: 'tel:9015850944', text: 'Call us to change it' }), ' — ' + OFFICE + '.'])]));
  return out;
}

/* ── PHOTOS (all CompanyCam photos, lazy) ─────────────────────────────── */
function photos(){
  var box = h('section', { class: 'card' }, [h('h2', { text: 'Job photos' })]);
  if (V.companyCam && V.companyCam.url) box.appendChild(h('a', { class: 'btn', href: V.companyCam.url, target: '_blank', rel: 'noopener', text: 'Open in CompanyCam' }));
  if (!PHOTOS) { box.appendChild(h('div', { class: 'empty', text: 'Loading photos…' })); loadPhotos(); return [box]; }
  if (!PHOTOS.length) { box.appendChild(h('div', { class: 'empty', text: V.companyCam && V.companyCam.linked ? 'No photos yet — they show up here as soon as the crew takes them.' : 'Photos show up here once your job has its CompanyCam project.' })); return [box]; }
  box.appendChild(h('div', { class: 'muted', text: PHOTOS.length + ' photo' + (PHOTOS.length === 1 ? '' : 's') + ' · newest first · tap one to see it big' }));
  var grid = h('div', { class: 'pics', id: 'grid' }), shown = 0, sentinel = h('div', { style: 'height:1px' });
  function more(){
    var end = Math.min(PHOTOS.length, shown + 60);
    for (var i = shown; i < end; i++) (function(i){
      grid.appendChild(h('button', { type: 'button', 'aria-label': 'Open photo', on: { click: function(){ lightbox(PHOTOS, i); } } }, [h('img', { src: PHOTOS[i].t, alt: PHOTOS[i].at ? 'Photo ' + dt(PHOTOS[i].at) : 'Job photo', loading: 'lazy', decoding: 'async' })]));
    })(i);
    shown = end;
    if (shown >= PHOTOS.length && sentinel.parentNode) sentinel.parentNode.removeChild(sentinel);
  }
  more();
  box.appendChild(grid); box.appendChild(sentinel);
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function(es){ if (es.some(function(e){ return e.isIntersecting; })) more(); }, { rootMargin: '600px' }); io.observe(sentinel); }
  return [box];
}
var photosLoading = false;
function loadPhotos(){
  if (photosLoading || PHOTOS) return; photosLoading = true;
  api('photos').then(function(r){ PHOTOS = (r.data && r.data.ok && Array.isArray(r.data.photos)) ? r.data.photos : []; }, function(){ PHOTOS = []; })
    .then(function(){ photosLoading = false; if (TAB === 'photos') draw(); });
}
function lightbox(list, i){
  var img = h('img', { alt: 'Job photo' }), count = h('span');
  function show(){ img.src = list[i].f; count.textContent = (i + 1) + ' of ' + list.length + (list[i].at ? ' · ' + dt(list[i].at) : ''); }
  var ov = h('div', { class: 'lb', role: 'dialog', 'aria-label': 'Photo' }, [
    h('div', { class: 'top' }, [count, h('button', { type: 'button', 'aria-label': 'Close photo', text: '✕', on: { click: close } })]),
    h('div', { class: 'ph' }, [img]),
    list.length > 1 ? h('div', { class: 'nav' }, [h('button', { type: 'button', text: '‹ Back', on: { click: function(){ i = (i - 1 + list.length) % list.length; show(); } } }),
      h('button', { type: 'button', text: 'Next ›', on: { click: function(){ i = (i + 1) % list.length; show(); } } })]) : null]);
  var x0 = null;
  ov.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive: true });
  ov.addEventListener('touchend', function(e){ if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50 && list.length > 1) { i = (i + (dx < 0 ? 1 : -1) + list.length) % list.length; show(); } });
  function key(e){ if (e.key === 'Escape') close(); }
  function close(){ document.removeEventListener('keydown', key); if (ov.parentNode) ov.parentNode.removeChild(ov); }
  document.addEventListener('keydown', key);
  show(); document.body.appendChild(ov);
}

/* ── DOCUMENTS & PROPOSALS ────────────────────────────────────────────── */
function docs(){
  if (V.insurance) return insDocs();   /* patch INSP */

/* ── INSURANCE CLAIM VIEW (patch INSP) — only when the job is marked insurance (V.insurance) ── */

    d.amount ? h('div', { class: 'line' }, [h('span', { text: 'Held back by your insurance company' }), h('span', { text: usd(d.amount) })]) : null,
    d.released ? h('div', { class: 'line' }, [h('span', { text: 'Released so far' }), h('span', { text: usd(d.released) })]) : null,

/* ── frame ─────────────────────────────────────────────────────────────── */
function go(t){ TAB = t; draw(); window.scrollTo(0, 0); }
function draw(){
  var main = $('main'); main.innerHTML = '';
  var parts = TAB === 'photos' ? photos() : TAB === 'docs' ? docs() : TAB === 'pay' ? pay() : home();
  parts.forEach(function(p){ if (p) main.appendChild(p); });
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.setAttribute('aria-selected', b.getAttribute('data-tab') === TAB ? 'true' : 'false'); });
}
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.addEventListener('click', function(){ go(b.getAttribute('data-tab')); }); });

if (!token) { notActive('Welcome to your GrayCo Portal. Open it with the personal link we sent you by text and e-mail. Can\u2019t find it? Call GrayCo ' + OFFICE + '.'); return; }
api('view').then(function(r){
  if (!r.data || !r.data.ok) { notActive(r.data && r.data.error); return; }
  V = r.data;
  var c = V.customer || {}, j = V.job || {};
  $('hi').textContent = 'Hi ' + (c.firstName || 'there') + ' — your project';
  $('jobName').textContent = j.name || 'Your project';
  $('jobSub').textContent = [j.address, j.po ? 'Job ' + j.po : ''].filter(Boolean).join(' · ');

  document.title = (j.name ? j.name + ' — ' : '') + 'GrayCo';
  draw();

}, function(){ notActive('We could not load your job just now. Check your signal and try again, or call GrayCo ' + OFFICE + '.'); });
})();
