<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1D2F">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data: blob:; frame-src https: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>GrayCo Portal</title>
<style>
:root{--navy:#0F1D2F;--navy2:#1A3A5F;--line:#22344D;--gold:#D4A017;--goldDk:#8A5A00;--goldBg:#FCF0CF;--bg:#F6F3EC;--ink:#14202E;--mute:#55626F;--soft:#C9D3DF;--card:#FFFFFF;--rule:#EFEAE0;--edge:#E2DCCD;--green:#1D5E2C;--greenBg:#E3F1E6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Public Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--navy2)}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
header .logo{width:190px;max-width:52vw;height:auto;display:block}
.hbtns{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;align-items:center}
.hbtns.l{right:auto;left:12px}
@media (max-width:999px){header{padding-top:calc(64px + env(safe-area-inset-top,0px))}.out{min-height:40px;padding:0 10px}}
.call{width:44px;height:44px;border-radius:22px;background:var(--navy2);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.lang{min-height:44px;min-width:44px;padding:0 10px;border-radius:22px;border:1px solid var(--line);background:transparent;color:#fff;font:600 13px inherit;font-family:inherit;cursor:pointer}
.lang b{color:var(--gold)}
.out{min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--soft);font-family:inherit;font-size:13px;cursor:pointer}
.hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.hello .sm{font-size:13px;color:var(--soft)}
.hello .big{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
main{flex:1 1 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
footer.lic{text-align:center;font-size:12px;color:var(--mute);padding:6px 16px calc(84px + env(safe-area-inset-bottom,0px));line-height:1.6}
.card{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,29,47,.08);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.card h3{margin:4px 0 0;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--mute);font-size:13px;line-height:1.45}
.big{font-size:17px;font-weight:700}
.grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.now{color:var(--goldDk);background:var(--goldBg)}
.pill.ok{color:var(--green);background:var(--greenBg)}
.pill.due{color:#8a1c1c;background:#fbe3e3}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps li{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:14px;height:14px;border-radius:7px;flex:0 0 14px;border:2px solid #B8B1A2;background:#fff}
li.done .dot{background:var(--green);border-color:var(--green)}
li.done{color:#2F3B47}
li.now .dot{background:var(--gold);border-color:var(--goldDk)}
li.now{font-weight:700}
li.todo{color:#6B7682}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);font-weight:600;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 14px;cursor:pointer;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btns3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btns3 .btn{font-size:14px;padding:0 6px}
.pm{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:24px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 48px}
.sel{user-select:text;-webkit-user-select:text;font-size:14px;overflow-wrap:anywhere}
.post{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.post:first-of-type{border-top:0;padding-top:0}
.post p,p.pre{margin:0;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pics button{padding:0;border:0;background:#E9E4D8;border-radius:8px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;display:block;width:100%}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.doc{min-height:52px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:10px}
.doc:first-of-type{border-top:0;padding-top:0}
.doc .n{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.doc .act{display:flex;gap:6px;flex:0 0 auto}
.doc .act .btn{min-height:44px;font-size:14px;padding:0 12px}
iframe.prev{width:100%;height:420px;border:1px solid var(--edge);border-radius:10px;background:#fff}
.money,.money3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.money3{grid-template-columns:repeat(3,minmax(0,1fr))}
.money div,.money3 div{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.money b,.money3 b{font-size:17px;overflow-wrap:anywhere}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.line > span:last-child{font-weight:600;text-align:right}
.how{background:var(--navy);color:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.box{border:1px solid var(--edge);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
dl.info{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:14px}
dl.info dt{color:var(--mute)}dl.info dd{margin:0;overflow-wrap:anywhere;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--edge);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{min-height:48px;border:none;background:transparent;font-family:inherit;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:500;font-size:13px;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--navy);font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#B42318;color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-left:4px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:12px 0}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,#ece7dc,#f4f0e8,#ece7dc);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.lb{position:fixed;inset:0;background:rgba(6,12,20,.96);z-index:30;display:flex;flex-direction:column}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;color:#fff;font-size:14px;gap:8px}
.lb .top button{min-width:44px;min-height:44px;border-radius:22px;border:0;background:#1A3A5F;color:#fff;font-size:16px;cursor:pointer;padding:0 12px}
.lb .ph{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .nav{display:flex;justify-content:space-between;padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.lb .nav button{min-width:96px;min-height:44px;border-radius:10px;border:0;background:#1A3A5F;color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.off{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.off p{font-size:17px;line-height:1.45;margin:0}
.inp{width:100%;min-height:48px;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font:16px inherit;font-family:inherit;background:#fff;color:var(--ink)}
textarea.inp{min-height:72px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.code{letter-spacing:8px;font-size:26px;text-align:center;font-weight:700}
.signin{max-width:440px;margin:0 auto;width:100%}
.err{color:#8a1c1c;font-size:14px;min-height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;z-index:40;font-weight:600;max-width:90vw}
.toast.bad{background:#B42318}
/* the working portal for GrayCo's trade partners (portal-app.js) */
.need,.jobrow{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;border:0;border-top:1px solid var(--rule);background:transparent;padding:10px 0;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}
.need:first-of-type,.jobrow:first-of-type{border-top:0}
.need .chev{margin-left:auto;color:var(--goldDk);font-size:20px}
.dotg{width:10px;height:10px;border-radius:5px;background:var(--gold);flex:0 0 10px}
.jobrow .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.jobbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0}
.back{min-height:44px;min-width:44px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);border-radius:22px;padding:0 14px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.jtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.jtabs button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--edge);background:#fff;font:600 14px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.jtabs button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mute);border-bottom:1px solid var(--edge);padding:6px}
.tbl td{border-bottom:1px solid var(--rule);padding:8px 6px;vertical-align:top}
.row.total{border-top:2px solid var(--edge);padding-top:10px}.row.total b{font-size:22px}
.inv{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
ol.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
ol.track li{font-size:11px;color:var(--mute);border-top:4px solid var(--edge);padding-top:4px}
ol.track li.on{color:var(--green);border-top-color:var(--green);font-weight:700}
.paper{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.paper:first-of-type{border-top:0;padding-top:0}
.range{width:100%;min-height:44px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.msg.me{align-self:flex-end;background:var(--goldBg)}
.msg.them{align-self:flex-start;background:#EEF2F6}
.msg .who{font-size:12px;color:var(--mute)}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg .rr{font-size:11px;color:var(--mute);text-align:right}
.mfiles{display:flex;gap:6px;flex-wrap:wrap}
.mimg{padding:0;border:0;background:none;cursor:pointer}.mimg img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.lnk{font-weight:700}
.sheet{position:fixed;inset:0;z-index:25;background:rgba(6,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden}
.sheet-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--navy);color:#fff}
.sheet-top b{flex:1 1 auto;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-top .back{background:transparent;color:#fff;border-color:var(--line)}
.sheet-top .x{min-width:44px;min-height:44px;border-radius:22px;border:0;background:var(--navy2);color:#fff;font-size:16px;cursor:pointer}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.wide .sheet-in{max-width:1100px;height:100%}
iframe.pdf{width:100%;height:70vh;border:1px solid var(--edge);border-radius:10px;background:#fff}
/* patch INSP: the insurance-claim view */
.pill.ins{color:#fff;background:var(--navy2)}.pill.skip{color:var(--mute);background:var(--rule)}
li.skipped{color:#8A939C}li.skipped .dot{border-style:dashed}
ol.steps li .note{margin-left:auto;font-weight:400;font-size:12px;white-space:nowrap}
.grp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.grp h3{margin:0;font-size:13px;font-weight:700;color:var(--goldDk);text-transform:uppercase;letter-spacing:.03em}
.grp .doc:first-of-type{border-top:0;padding-top:0}
.box.endorse{border-color:var(--gold);background:var(--goldBg)}
.line.total{font-weight:700}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.nextp{margin:0;font-size:15px;line-height:1.5}
.pvbar{background:var(--goldBg);color:var(--goldDk);font-size:13px;font-weight:600;text-align:center;padding:8px 12px}
.inv{padding:10px 0;border-bottom:1px solid var(--rule)}.inv:last-child{border-bottom:none}
.inv .act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.inv .act .btn,.inv .act a{min-height:40px;font-size:14px;padding:0 12px}
.inv iframe.pdf{width:100%;height:70vh;max-height:640px;border:1px solid var(--rule);border-radius:10px;margin-top:8px;background:#fff}
[hidden]{display:none!important}
/* a computer: two columns — the job and its status on the left, the tabs on the right */
@media (min-width:1000px){
  .wrap{max-width:1200px}
  header{flex-direction:column;align-items:center;padding:22px 28px 18px}
  header .logo{width:200px;margin:0 auto}
  .hbtns{top:22px;right:28px}.hbtns.l{left:28px}
  .call{width:auto;padding:0 16px;gap:8px;font-weight:700;font-size:14px}
  .call::after{content:attr(data-label)}
  .hello{max-width:760px}
  main{padding:24px 28px 40px}
  nav.tabs{position:static;border:0;background:transparent;padding:0}
  nav.tabs .in{max-width:1200px;padding:0 28px;display:flex;gap:6px}
  nav.tabs button{flex:0 0 auto;padding:0 18px;border:1px solid var(--edge);background:#fff;border-radius:22px}
  nav.tabs button[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:none;border-color:var(--navy)}
  .two{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:20px;align-items:start}
  .col-l,.col-r{display:flex;flex-direction:column;gap:14px;min-width:0}
  .col-l{position:sticky;top:12px}
  footer.lic{padding-bottom:24px}
  .sheet{align-items:center}
  .sheet-in{border-radius:16px;max-height:90vh}
  .toast{bottom:24px}
  .signin{margin-top:40px}
}
/* patch SEL: Your selections */
.sel .sel-sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.sel h3{margin:0;font-size:15px}
.sel-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sel-opt{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:2px solid var(--edge);background:#fff;border-radius:12px;padding:6px;font-family:inherit;text-align:left;cursor:pointer;min-height:44px;color:var(--ink)}
.sel-opt.on{border-color:var(--gold);background:var(--goldBg)}
.sel-opt img,.sel-opt .sel-ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#E9E4D8;display:flex;align-items:center;justify-content:center;font-size:28px}
.sel-l{font-size:14px;font-weight:700;overflow-wrap:anywhere}.sel-p{font-size:12px;color:var(--mute)}.sel-ck{font-size:12px;font-weight:700;color:var(--goldDk)}
.sel-row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--rule);padding-top:8px}.sel-row:first-of-type{border-top:0}
.sel-row img,.sel-row .sel-ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#E9E4D8;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-size:24px}
.sel-row .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.sel-st{font-size:12px;font-weight:700}.sel-st.now{color:#8a1c1c}.sel-st.ok{color:var(--green)}
.sel-name{width:100%;min-height:46px;border:1px solid #C9C2B2;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit}
.sel-pad{width:100%;aspect-ratio:3/1;border:1px dashed #9AA5B1;border-radius:10px;background:#fff;touch-action:none;display:block}
.sel-agree{display:flex;align-items:flex-start;gap:6px;font-size:14px}.sel-agree input{width:22px;height:22px;flex:0 0 22px}
.sel-clear{min-height:36px;font-size:13px}.sel-msg{font-size:14px;font-weight:600;color:var(--goldDk);min-height:18px}
</style>
</head>
<body>

function wide(){ return window.matchMedia('(min-width: 1000px)').matches; }
function store(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

function post(fn, body, extra){
  var hd = { 'Content-Type': 'application/json' };
  if (extra && extra.token) hd['x-portal-token'] = extra.token;
  if (extra && extra.session) hd['x-portal-session'] = extra.session;
  if (extra && extra.device) hd['x-portal-device'] = extra.device;
  return fetch(fn, { method: 'POST', headers: hd, body: JSON.stringify(body), cache: 'no-store', credentials: 'omit' })
    .then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){ return { status: r.status, data: j || {} }; }); });
}
function cred(){ return token && !session ? { token: token } : { session: session, token: session ? '' : token }; }
function api(action){ return post(FN, PREVIEW ? { action: action, preview: true } : { action: action, projectId: PID || undefined }, cred()); }
function acc(action, body){ return post(ACC, Object.assign({ action: action, projectId: PID || undefined }, PREVIEW ? { preview: true } : {}, body || {}), cred()); }

/* ── SIGN IN (no password: a 6-digit code to the e-mail on file) ── */
function signin(step, who){
  $('tabs').hidden = true; $('hello').hidden = true;
  var main = $('main'); main.innerHTML = '';
  var err = h('div', { class: 'err', role: 'alert', id: 'siErr' });
  var box = h('section', { class: 'card signin', id: 'signinBox' });
  main.appendChild(box);
  box.appendChild(h('h2', { text: tr('welcome') }));
  if (!step || step === 'pw') {
    var em = h('input', { class: 'inp', id: 'siEmail', type: 'text', inputmode: 'email', autocomplete: 'username', value: who || '' });
    var pw = h('input', { class: 'inp', id: 'siPw', type: 'password', autocomplete: 'current-password' });
    var enter = h('button', { type: 'button', class: 'btn gold', id: 'siLogin', text: tr('signIn') });
    box.appendChild(h('p', { class: 'muted', text: tr('openLink') }));
    box.appendChild(h('label', { class: 'fld' }, [h('span', { text: tr('emailL') }), em]));
    box.appendChild(h('label', { class: 'fld' }, [h('span', { text: tr('pwL') }), pw]));
    box.appendChild(h('p', { class: 'muted', text: tr('pwHint') }));
    box.appendChild(enter); box.appendChild(err);
    box.appendChild(h('button', { type: 'button', class: 'btn', id: 'siForgot', text: tr('forgot'), on: { click: function(){ signin('who', em.value.trim()); } } }));
    function login(){
      if (!em.value.trim() || !pw.value) { err.textContent = tr('needWho'); return; }
      enter.disabled = true;
      post(ACC, { action: 'signin-password', email: em.value.trim(), password: pw.value }).then(function(r){
        enter.disabled = false;
        if (!r.data.ok || !r.data.session) { err.textContent = r.data.error || tr('badCode'); return; }
        session = r.data.session; store('gc_portal_s', session); store('gc_portal_t', ''); token = '';
        store('gc_portal_starter', r.data.starter ? '1' : '');
        route(r.data.kind);
      }, function(){ enter.disabled = false; err.textContent = tr('loadFail'); });
    }
    enter.addEventListener('click', login);
    pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
    return;
  }
  if (step !== 'code') {
    var inp = h('input', { class: 'inp', id: 'siWho', type: 'text', inputmode: 'email', autocomplete: 'email', value: who || '' });
    var go = h('button', { type: 'button', class: 'btn gold', id: 'siSend', text: tr('sendCode') });
    box.appendChild(h('p', { class: 'muted', text: tr('openLink') }));
    box.appendChild(h('label', { class: 'fld' }, [h('span', { text: tr('who') }), inp]));
    box.appendChild(go); box.appendChild(err);
    box.appendChild(h('p', { class: 'muted', text: tr('codeNote') }));
    box.appendChild(h('button', { type: 'button', class: 'btn', id: 'siBack', text: tr('back2'), on: { click: function(){ signin('pw', inp.value.trim()); } } }));
    function send(){
      var w = inp.value.trim(); if (!w) { err.textContent = tr('needWho'); return; }
      go.disabled = true;
      post(ACC, { action: 'signin-start', who: w }).then(function(r){
        go.disabled = false;
        if (r.status === 429) { err.textContent = tr('wait'); return; }
        if (r.status >= 400) { err.textContent = r.data.error || tr('needWho'); return; }
        signin('code', w);
      }, function(){ go.disabled = false; err.textContent = tr('loadFail'); });
    }
    go.addEventListener('click', send);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
    return;
  }
  var code = h('input', { class: 'inp code', id: 'siCode', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6' });
  var ok = h('button', { type: 'button', class: 'btn gold', id: 'siVerify', text: tr('signIn') });
  box.appendChild(h('p', { class: 'muted', id: 'siSent', text: tr('codeSent') }));
  box.appendChild(h('label', { class: 'fld' }, [h('span', { text: tr('code') }), code]));
  box.appendChild(ok); box.appendChild(err);
  box.appendChild(h('div', { class: 'btns' }, [h('button', { type: 'button', class: 'btn', text: tr('resend'), on: { click: function(){ post(ACC, { action: 'signin-start', who: who }); err.textContent = ''; } } }),
    h('button', { type: 'button', class: 'btn', text: tr('other'), on: { click: function(){ signin('who', who); } } })]));
  function verify(){
    ok.disabled = true;
    post(ACC, { action: 'signin-verify', who: who, code: code.value.trim() }).then(function(r){
      ok.disabled = false;
      if (r.status === 429) { err.textContent = tr('wait'); return; }
      if (!r.data.ok || !r.data.session) { err.textContent = tr('badCode'); return; }
      session = r.data.session; store('gc_portal_s', session); store('gc_portal_t', ''); token = '';
      route(r.data.kind);
    }, function(){ ok.disabled = false; err.textContent = tr('loadFail'); });
  }
  ok.addEventListener('click', verify);
  code.addEventListener('keydown', function(e){ if (e.key === 'Enter') verify(); });
  setTimeout(function(){ try { code.focus(); } catch (e) {} }, 50);
}

function startCustomer(){
  if (session && !token) {
    return acc('c-jobs').then(function(r){
      if (!r.data.ok) { store('gc_portal_s', ''); session = ''; return notActive(r.data.error); }
      JOBS = r.data.jobs || [];
      var want = /[#&]job=([A-Za-z0-9_.:-]{1,80})/.exec(location.hash || '');
      if (want && JOBS.some(function(j){ return j.id === want[1]; })) { PID = want[1]; return loadView(); }
      if (JOBS.length === 1) { PID = JOBS[0].id; return loadView(); }
      picker();
    }, function(){ notActive(tr('loadFail')); });
  }
  return loadView();
}

/* ── PHOTOS: GrayCo Photos of this job only ── */
function photos(){
  var box = h('section', { class: 'card', id: 'gp-gallery' }, [h('h2', { text: LANG === 'es' ? 'Fotos GrayCo de su trabajo' : 'GrayCo Photos of your job' })]);
  if (!PHOTOS) { box.appendChild(h('div', { class: 'empty', text: 'Loading photos…' })); loadPhotos(); return [box]; }
  if (!PHOTOS.length) { box.appendChild(h('div', { class: 'empty', text: LANG === 'es' ? 'Todavía no hay fotos — aparecen aquí en cuanto su equipo GrayCo las tome.' : 'No photos yet — they show up here as soon as your GrayCo team takes them.' })); return [box]; }
  box.appendChild(h('div', { class: 'muted', text: PHOTOS.length + ' photo' + (PHOTOS.length === 1 ? '' : 's') + ' · newest first · tap one to see it big' }));
  var grid = h('div', { class: 'pics', id: 'grid' }), shown = 0, sentinel = h('div', { style: 'height:1px' });
  function more(){
    var end = Math.min(PHOTOS.length, shown + 60);
    for (var i = shown; i < end; i++) (function(i){
      grid.appendChild(h('button', { type: 'button', 'aria-label': 'Open photo', on: { click: function(){ lightbox(PHOTOS, i); } } }, [h('img', { src: PHOTOS[i].t, alt: PHOTOS[i].at ? 'Photo ' + dt(PHOTOS[i].at) : 'Job photo', loading: 'lazy', decoding: 'async' })]));
    })(i);
    shown = end;
    if (shown >= PHOTOS.length && sentinel.parentNode) sentinel.parentNode.removeChild(sentinel);
  }
  more();
  box.appendChild(grid); box.appendChild(sentinel);
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function(es){ if (es.some(function(e){ return e.isIntersecting; })) more(); }, { rootMargin: '600px' }); io.observe(sentinel); }
  return [box];
}
var photosLoading = false, photosAt = 0;
function loadPhotos(){
  if (photosLoading || PHOTOS) return; photosLoading = true;
  /* GrayCo Photos of this one job (portal.js {action:'photos'}, patch U2): photos marked "hidden from customer"
     never come, and there is never a link to another site */
  api('photos').then(function(x){ return (x.data && x.data.ok && Array.isArray(x.data.photos)) ? x.data.photos.map(function(p){ return { t: p.t || p.thumb, f: p.f || p.url || p.t, at: p.at || '' }; }) : []; })
    .then(function(list){ PHOTOS = (list || []).filter(function(p){ return p && p.t && p.f; }); }, function(){ PHOTOS = []; })
    .then(function(){ photosLoading = false; photosAt = Date.now(); if (TAB === 'photos') draw(); });
  /* the links expire after an hour: a page left open asks again before then */
  setTimeout(function(){ if (photosAt && Date.now() - photosAt > 50 * 60e3) { PHOTOS = null; if (TAB === 'photos') draw(); } }, 51 * 60e3);
}
function lightbox(list, i){

    : [h('div', { class: 'empty', text: 'No payments yet.' })]));
  var inv = (V.money && V.money.invoices) || [];
  if (inv.length) out.push(card('Invoices', inv.map(invRow)));
  return out;
}

/* ── frame ── */
function go(t){ TAB = t; draw(); window.scrollTo(0, 0); }
function draw(){
  var main = $('main'); main.innerHTML = '';
  var parts = TAB === 'photos' ? photos() : TAB === 'docs' ? docs() : TAB === 'pay' ? pay() : TAB === 'msgs' ? msgs() : home();
  var top = [];
  if (JOBS && JOBS.length > 1) top.push(h('div', { class: 'jobbar' }, [h('button', { type: 'button', class: 'back', id: 'allJobs', text: tr('allProjects'), on: { click: function(){ V = null; PID = ''; picker(); } } })]));
  if (wide()) {
    var left = h('aside', { class: 'col-l' }, [V.insurance ? null : tracker(), pmCard(), infoCard()].filter(Boolean));
    var right = h('section', { class: 'col-r' }, []);
    parts.forEach(function(p){ if (p) right.appendChild(p); });
    top.forEach(function(x){ main.appendChild(x); });
    main.appendChild(h('div', { class: 'two' }, [left, right]));
  } else {
    top.concat(parts).forEach(function(p){ if (p) main.appendChild(p); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.setAttribute('aria-selected', b.getAttribute('data-tab') === TAB ? 'true' : 'false'); });
}
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'), function(b){ b.addEventListener('click', function(){ if (window.GCPartner) return; go(b.getAttribute('data-tab')); }); });
var lastWide = wide();
window.addEventListener('resize', function(){ var w = wide(); if (w !== lastWide) { lastWide = w; if (V && !window.GCPartner) draw(); } });

/* ── start: a link, a signed-in device, or the sign-in screen ── */
if (token) {
  var dev = ''; try { dev = localStorage.getItem('gc_portal_dev') || ''; } catch (e) {}
  post(ACC, { action: 'open' }, { token: token, device: dev }).then(function(r){
    var d = r.data || {};
    if (!d.ok) {
      /* a customer link still opens if only the new door is not there / not set up yet */
      if (r.status !== 404 || !d.error) { session = ''; return route('customer'); }
      store('gc_portal_t', ''); return notActive(d.error);
    }
    if (d.kind === 'customer') { session = ''; store('gc_portal_s', ''); return route('customer'); }
    if (d.lang && !localStorage.getItem('gc_lang')) { LANG = d.lang; paintLang(); }
    if (d.need === 'device') return deviceScreen(d);
    session = d.session; store('gc_portal_s', session); token = '';
    if (location.hash) history.replaceState(null, '', location.pathname);
    route('partner');
  }, function(){ route('customer'); });
} else if (session) {
  post(ACC, { action: 'whoami' }, { session: session }).then(function(r){
    if (!r.data.ok) { store('gc_portal_s', ''); session = ''; return signin(); }
    route(r.data.kind);
  }, function(){ notActive(tr('loadFail')); });
} else signin();
})();
</script>
<script id="gc-portal-sel">
/* patch SEL — "Your selections" on the customer's Home page.
   The customer picks from what the PM offered (photo, name, price) and confirms with their typed name: that is
   their choice and their signature. What the PM picked for them shows as "Please review and sign": typed name +
   a drawn signature (or tap Sign to accept with the typed name). Everything goes through
   /.netlify/functions/selections with the same link code; the server checks every input and records the name,
   the time and the address. The card sits on top of Home and survives the page redrawing (it is kept here). */
(function(){
'use strict';
if (window.__GC_PSEL__) return; window.__GC_PSEL__ = true;
var FN = '/.netlify/functions/selections', OFFICE = '901-585-0944';
var token = '';
try { var m = /(?:^#|&)t=([A-Za-z0-9_-]{20,80})/.exec(location.hash || ''); if (m) token = m[1]; } catch (e) {}
try { if (!token) token = localStorage.getItem('gc_portal_t') || ''; } catch (e) {}
var PREVIEW = /(?:^#|&)p=1(?:&|$)/.test(location.hash || '');
/* patch SUB: signed in with e-mail + password → the session code and the job picked (no link code) */
function sess(){ try { return token ? '' : (localStorage.getItem('gc_portal_s') || ''); } catch (e) { return ''; } }
function pid(){ try { return String(window.PID || ''); } catch (e) { return ''; } }
var lastPid = '';
var D = null, card = null, chosen = {}, note = { pick: '', sign: '' }, busy = false, pad = null, started = false;
var keep = { pick: '', sign: '', pickOk: false, signOk: false };   /* what was typed / ticked survives a repaint */
function kept(el, k, ck){ if (ck) { el.checked = keep[k]; el.addEventListener('change', function(){ keep[k] = el.checked; }); } else { el.value = keep[k]; el.addEventListener('input', function(){ keep[k] = el.value; }); } return el; }

  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k]; if (v == null || v === false) return;

    else if (k === 'on') Object.keys(v).forEach(function(e){ el.addEventListener(e, v[e]); });
    else if ((k === 'href' || k === 'src') && !/^https:\/\//i.test(String(v))) return;

function usd(n){ n = Number(n) || 0; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function api(body){
  return fetch(FN, { method: 'POST', headers: sess() ? { 'Content-Type': 'application/json', 'x-portal-session': sess() } : { 'Content-Type': 'application/json', 'x-portal-token': token }, body: JSON.stringify(Object.assign(PREVIEW ? { preview: true } : {}, sess() ? { projectId: pid() || undefined } : {}, body)), cache: 'no-store', credentials: 'omit' })
    .then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){ return { status: r.status, data: j || {} }; }); }, function(){ return { status: 0, data: { error: 'No connection — check your signal and try again.' } }; });
}
function load(){ return api({ action: 'view' }).then(function(r){ if (r.data && r.data.ok) { D = r.data; paint(); } }); }

/* a signature pad: points on a 600 × 200 pad (numbers only) */
function makePad(){

  return { el: cv, strokes: function(){ return strokes.map(function(st){ return st.map(function(p){ return [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]; }); }); }, clear: function(){ strokes = []; cur = null; redraw(); } };
}

function paint(){
  var items = (D && D.items) || [];
  if (!items.length && !(D && D.docs && D.docs.length)) { if (card && card.parentNode) card.parentNode.removeChild(card); card = null; return; }
  var open = items.filter(function(x){ return x.status === 'open'; }), sign = items.filter(function(x){ return x.status === 'needs-sign'; }), done = items.filter(function(x){ return x.status === 'chosen' || x.status === 'signed'; });
  var todo = open.length + sign.length;
  var c = card || h('section', { class: 'card sel', id: 'gcsel' }); c.innerHTML = '';
  c.appendChild(h('div', { class: 'row' }, [h('h2', { text: '🎨 Your selections' }), h('span', { class: 'pill ' + (todo ? 'now' : 'ok'), text: todo ? todo + ' to do' : 'All set' })]));
  if (PREVIEW) c.appendChild(h('div', { class: 'muted', text: 'Preview — only the customer can pick or sign.' }));
  if (sign.length) {
    var sb = h('div', { class: 'sel-sec', id: 'gcsel-sign' }, [h('h3', { text: '✍️ Please review and sign' }), h('div', { class: 'muted', text: 'Your Project Manager picked these for you. Please look them over and sign.' })]);
    sign.forEach(function(x){ sb.appendChild(pickRow(x)); });
    if (!pad) pad = makePad();
    var nm = kept(h('input', { type: 'text', class: 'sel-name', id: 'gcsel-signname', maxlength: '80', autocomplete: 'name', placeholder: 'Type your full name' }), 'sign');
    var ag = kept(h('input', { type: 'checkbox', id: 'gcsel-signagree' }), 'signOk', true);
    var go = h('button', { type: 'button', class: 'btn gold', id: 'gcsel-signbtn', text: 'Sign' });
    sb.appendChild(h('label', { class: 'muted', for: 'gcsel-signname', text: 'Your full name' })); sb.appendChild(nm);
    sb.appendChild(h('div', { class: 'muted', text: 'Draw your signature (or leave it blank and tap Sign to accept with your typed name):' }));
    sb.appendChild(pad.el);
    sb.appendChild(h('button', { type: 'button', class: 'btn sel-clear', text: 'Clear signature', on: { click: function(){ pad.clear(); } } }));
    sb.appendChild(h('label', { class: 'sel-agree' }, [ag, h('span', { text: ' I reviewed these selections and I approve them.' })]));
    sb.appendChild(go);
    var sm = h('div', { class: 'sel-msg', id: 'gcsel-signmsg', role: 'status', text: note.sign });
    sb.appendChild(sm);
    go.disabled = PREVIEW;
    go.addEventListener('click', function(){
      if (busy) return; if (!nm.value.trim()) { sm.textContent = 'Please type your full name.'; nm.focus(); return; } if (!ag.checked) { sm.textContent = 'Please tick the box to approve.'; return; }
      busy = true; go.disabled = true; sm.textContent = 'Signing…';
      api({ action: 'sign', choiceIds: sign.map(function(x){ return x.id; }), name: nm.value, agree: true, strokes: pad.strokes() }).then(function(r){
        busy = false;
        if (r.data && r.data.ok) { keep.signOk = false; note.sign = '✓ Thank you — signed. Your copy is below' + (r.data.emailed ? ' and in your e-mail.' : '.'); pad.clear(); return load(); }
        note.sign = ''; sm.textContent = (r.data && r.data.error) || 'That did not work — please call GrayCo ' + OFFICE + '.'; go.disabled = false;
      });
    });
    c.appendChild(sb);
  }
  if (open.length) {
    var ob = h('div', { class: 'sel-sec', id: 'gcsel-pick' }, [h('h3', { text: '👉 Your choice' }), h('div', { class: 'muted', text: 'Tap the one you want for each item, then confirm with your name.' })]);
    open.forEach(function(x){
      ob.appendChild(h('div', { class: 'sel-item' }, [h('b', { text: x.title }), x.note ? h('div', { class: 'muted', text: x.note }) : null, x.dueBy ? h('div', { class: 'muted', text: 'Please pick by ' + dt(x.dueBy + 'T12:00:00') }) : null]));
      var g = h('div', { class: 'sel-opts' });
      x.options.forEach(function(o){
        var on = chosen[x.id] === o.id;
        g.appendChild(h('button', { type: 'button', class: 'sel-opt' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', 'data-c': x.id, 'data-o': o.id, on: { click: function(){ chosen[x.id] = o.id; paint(); } } }, [
          o.photo ? h('img', { src: o.photo, alt: '', loading: 'lazy' }) : h('span', { class: 'sel-ph', 'aria-hidden': 'true', text: '🎨' }),
          h('span', { class: 'sel-l', text: o.label }), priceTxt(o) ? h('span', { class: 'sel-p', text: priceTxt(o) }) : null, on ? h('span', { class: 'sel-ck', text: '✓ Your pick' }) : null]));
      });
      ob.appendChild(g);
    });
    var picked = open.filter(function(x){ return chosen[x.id]; });
    var pn = kept(h('input', { type: 'text', class: 'sel-name', id: 'gcsel-pickname', maxlength: '80', autocomplete: 'name', placeholder: 'Type your full name' }), 'pick');
    var pa = kept(h('input', { type: 'checkbox', id: 'gcsel-pickagree' }), 'pickOk', true);
    var pb = h('button', { type: 'button', class: 'btn gold', id: 'gcsel-pickbtn', text: picked.length ? 'Confirm my choice' + (picked.length > 1 ? 's (' + picked.length + ')' : '') : 'Tap an option above' });
    var pm = h('div', { class: 'sel-msg', id: 'gcsel-pickmsg', role: 'status', text: note.pick });
    pb.disabled = !picked.length || PREVIEW;
    ob.appendChild(h('label', { class: 'muted', for: 'gcsel-pickname', text: 'Your full name' })); ob.appendChild(pn);
    ob.appendChild(h('label', { class: 'sel-agree' }, [pa, h('span', { text: ' These are my choices. My name here is my signature.' })]));
    ob.appendChild(pb); ob.appendChild(pm);
    pb.addEventListener('click', function(){
      if (busy) return; if (!pn.value.trim()) { pm.textContent = 'Please type your full name.'; pn.focus(); return; } if (!pa.checked) { pm.textContent = 'Please tick the box to confirm.'; return; }
      busy = true; pb.disabled = true; pm.textContent = 'Saving…';
      api({ action: 'pick', picks: picked.map(function(x){ return { choiceId: x.id, optionId: chosen[x.id] }; }), name: pn.value, agree: true }).then(function(r){
        busy = false;
        if (r.data && r.data.ok) { picked.forEach(function(x){ delete chosen[x.id]; }); keep.pickOk = false; note.pick = '✓ Thank you — your choice is saved. Your copy is below' + (r.data.emailed ? ' and in your e-mail.' : '.'); return load(); }
        note.pick = ''; pm.textContent = (r.data && r.data.error) || 'That did not work — please call GrayCo ' + OFFICE + '.'; pb.disabled = false;
      });
    });
    c.appendChild(ob);
  }
  if (done.length) {
    var db = h('div', { class: 'sel-sec', id: 'gcsel-done' }, [h('h3', { text: '✓ Done' })]);
    done.forEach(function(x){ db.appendChild(pickRow(x)); });
    c.appendChild(db);
  }
  if (!sign.length && note.sign) c.appendChild(h('div', { class: 'sel-msg', text: note.sign }));
  if (!open.length && note.pick) c.appendChild(h('div', { class: 'sel-msg', text: note.pick }));
  if (D.docs && D.docs.length) {
    var dc = h('div', { class: 'sel-sec', id: 'gcsel-docs' }, [h('h3', { text: '📄 Your signed copies' })]);
    D.docs.forEach(function(d){ dc.appendChild(h('div', { class: 'doc' }, [h('div', { class: 'grow' }, [h('span', { class: 'n', text: d.title }), h('span', { class: 'muted', text: dt(d.at) })]), h('div', { class: 'act' }, [h('a', { class: 'btn', href: d.url, target: '_blank', rel: 'noopener', text: 'Open' })])])); });
    c.appendChild(dc);
  }
  c.appendChild(h('div', { class: 'muted', text: 'Colors on screens can vary — ask your Project Manager for a sample. Want to change something? Call ' + OFFICE + '.' }));
  card = c; place();
}
function pickRow(x){
  var p = x.pick || {}, st = x.status;
  var line = st === 'signed' ? '✓ Signed by ' + ((x.done && x.done.name) || 'you') + (x.done ? ' on ' + dt(x.done.at) : '')
    : st === 'chosen' ? '✓ Your choice' + (x.done ? ' — confirmed by ' + x.done.name + ' on ' + dt(x.done.at) : '') : 'Picked by your Project Manager';
  return h('div', { class: 'sel-row', 'data-id': x.id, 'data-status': st }, [
    p.photo ? h('img', { src: p.photo, alt: '', loading: 'lazy' }) : h('span', { class: 'sel-ph', 'aria-hidden': 'true', text: '🎨' }),
    h('div', { class: 'grow' }, [h('span', { class: 'muted', text: x.title }), h('b', { text: p.label || '' }), priceTxt(p) ? h('span', { class: 'muted', text: priceTxt(p) }) : null,
      h('span', { class: 'sel-st ' + (st === 'needs-sign' ? 'now' : 'ok'), text: st === 'needs-sign' ? '⚠️ Waiting for your signature' : line })])]);
}
/* keep the card on top of Home, whatever redraws the page */
function homeShown(){ var t = document.getElementById('tabs'); if (!t || t.hidden) return false; var b = document.querySelector('nav.tabs button[data-tab="home"]'); return !b || b.getAttribute('aria-selected') === 'true'; }
function place(){
  var main = document.getElementById('main'); if (!main) return;
  if (!card || !homeShown()) { if (card && card.parentNode) card.parentNode.removeChild(card); return; }
  var host = main.querySelector('.col-r') || main;
  if (card.parentNode === host) return;
  var first = host.firstElementChild; while (first && first.classList && first.classList.contains('jobbar')) first = first.nextElementSibling;
  host.insertBefore(card, first || null);
}
function start(){
  if (window.GCPartner) return;   /* patch SUB: the sub portal has no selections */
  if (started && sess() && pid() !== lastPid) { lastPid = pid(); D = null; if (card && card.parentNode) card.parentNode.removeChild(card); card = null; load(); return; }   /* another job picked */
  if (started || !(token || sess())) return; var t = document.getElementById('tabs'); if (!t || t.hidden) return;
  started = true; lastPid = pid(); load();
}
try {
  new MutationObserver(function(){ start(); place(); }).observe(document.getElementById('main'), { childList: true, subtree: false });
  var tb = document.getElementById('tabs'); if (tb) new MutationObserver(function(){ start(); place(); }).observe(tb, { attributes: true, subtree: true, attributeFilter: ['hidden', 'aria-selected'] });
} catch (e) {}
start();
window._gcPortalSel = { reload: load, data: function(){ return D; } };
})();
