# GrayCo CRM — Netlify build configuration
#
# publish = "."  : the site is flat; index.html sits at the root.
# functions      : the server-side functions the CRM depends on, including
#                  companycam-webhook, staff-admin (Team access) and gc-backup. If this directory is missing from a
#                  deploy, every integration that relies on it returns 404.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The CompanyCam proxy function calls fetch(). fetch is only a global from
  # Node 18 onward — on an older runtime the function throws before it ever
  # reaches CompanyCam, and the CRM reports it as "token not accepted", which
  # sends you hunting for a token problem that does not exist. Pin the runtime.
  NODE_VERSION = "20"

  # Netlify's secrets scanner flags SUPABASE_URL because the project URL also
  # appears in index.html. That is expected and safe: the Supabase project URL
  # and the "anon" key are designed to be shipped in client-side code — access
  # is controlled by Row Level Security on the database, not by hiding them.
  # Verified: no service_role key, and no Anthropic or Resend key, appears in
  # any deployed file. Only the public URL is omitted from the scan; every
  # genuinely secret variable is still scanned.
  # SUPABASE_ANON_KEY is the same public key that is in index.html (it opens
  # nothing by itself once docs/security-lockdown.sql is run); SITE_ORIGIN and
  # STAFF_EMAILS are addresses, not secrets. OWNER_EMAILS (an e-mail list) and
  # PORTAL_BASE_URL (https://crm.grayco-cs.com) are public too: the scanner
  # failed 33.149 on the CRM address in solar-lookup.js, staff-admin.js and
  # roofscout/PROJECT-BRIEF.md, and on the contact e-mail in roofscout-scan.js.
  # 33.151: BIDS_URL (https://bids.grayco-cs.com) and SUBPORTAL_NOTIFY (an e-mail) are public too; they are defaults in subportal.js /
  # portal-access.js. (TWILIO_* and every key stay scanned: none of them is in any file.)
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SITE_ORIGIN,STAFF_EMAILS,OWNER_EMAILS,PORTAL_BASE_URL,BIDS_URL,SUBPORTAL_NOTIFY"

[functions]
  node_bundler = "esbuild"
  # optional at run time (phone push); every require of it is inside try/catch
  external_node_modules = ["web-push"]

# Nightly protected backup (docs/SECURITY-SETUP.md). 07:15 UTC = 2:15 am Central
# (1:15 am in winter). Copies the CRM's cloud tables into the private gc_backups
# table and keeps the newest 30 nights. A scheduled function cannot be called by
# its URL in production; the function also refuses anyone but a signed-in admin.
[functions."gc-backup"]
  schedule = "15 7 * * *"

# Customer portal (docs/PORTAL.md): every hour — new-document e-mails still waiting, the final-invoice
# e-mail and the friendly reminder every 15 days while a final invoice is unpaid. Never sends twice.
[functions."portal-reminders"]
  schedule = "7 * * * *"

# Approvals (patch AP4): an item Wesley and Nick have not answered 24 hours after it reached them goes to the
# office too. Checked every 15 minutes; the admins and the office are told once.
[functions."approval-escalate"]
  schedule = "*/15 * * * *"

# Weekly customer update (patch AUTAI, docs/AUTOMATIONS-AUTAI.md): Friday 2 PM Central. Netlify's clock is UTC, so it
# runs at 19:00 and 20:00 UTC on Fridays and only the run that is 2 PM in Memphis drafts (daylight saving or not).
# Each active job with the portal and its weekly-update switch on gets ONE draft on the approvals list for its PM.
[functions."weekly-update"]
  schedule = "0 19,20 * * 5"

# Lead Inbox (docs/LEAD-INBOX.md): the public bid watcher — weekdays at 7, 10, 1, 4 and 6 o'clock Central
# (12:17, 15:17, 18:17, 21:17, 23:17 UTC). One polite look at each public bid listing; new ones go to the
# Lead Inbox, become CRM leads and draft bid-portal jobs, and each new one is e-mailed to the admins at once.
[functions."bid-watch"]
  schedule = "17 12,15,18,21,23 * * 1-5"

# Leads (patch LA): every 10 minutes — "⏰ Bid due in 1 hour" (and "Bid due TODAY" at 8 AM Central when only
# the date is known), new RoofScout leads, a new-lead e-mail that failed, and the bid-portal drafts that waited
# for the portal. New leads from bids@, the bid watchers and the website are e-mailed the moment they arrive.
# There is no hourly digest any more.
[functions."bid-alerts"]
  schedule = "*/10 * * * *"

# Nightly data check (patch AUTO6): 07:05 UTC = 2:05 AM Central (1:05 AM in winter). Duplicate customers, jobs missing
# a PM / address / contract amount / signed contract, leads missing a due date / assignee → ONE item on the shared
# Office To-Do. Never deletes or merges anything.
[functions."data-check"]
  schedule = "5 7 * * *"

# Lost-lead win-back (patch AUTO6): 15:20 UTC = 10:20 AM Central (9:20 AM in winter). Leads lost 6 / 12 months ago →
# one approval item per batch; nothing goes out until an admin approves it (then one e-mail each from news@).
[functions."winback"]
  schedule = "20 15 * * *"

# GC portal (patch GCP, docs/GC-PORTAL.md): 13:40 UTC = 8:40 AM Central (7:40 AM in winter). Company documents running out
# (30 / 7 days, expired) → the admins; from Mar 15 / Sep 15 the free roof inspection offer → ONE approval item.
[functions."gc-portal-daily"]
  schedule = "40 13 * * *"

# CompanyCam (patch CC, docs/COMPANYCAM.md): every 15 minutes, on the server — every CompanyCam project changed
# since the last look; a new 2026+ one becomes a Bidding job with the PM who made it in CompanyCam. Nobody has
# to have the CRM open. Needs COMPANYCAM_TOKEN and SUPABASE_SERVICE_KEY.
[functions."companycam-sync"]
  schedule = "*/15 * * * *"

# Marketing (patch MKT, docs/SOCIAL-SETUP.md): every 15 minutes — approved social posts and news@ campaigns whose time
# came go out (unsubscribed customers skipped), and Autopilot drafts this week's posts / this month's e-mail. Every draft
# waits on Approvals; nothing customer-facing goes out without an admin's OK.
[functions."mkt-scheduled"]
  schedule = "*/15 * * * *"

# Field & insurance automations (patch AUTO7, docs/FIELD-AUTOMATIONS.md): every 15 minutes — the 7 AM dispatch to the
# superintendents (workdays), insurance closeout follow-ups to the adjuster every 7 days and stuck mortgage checks (9 AM),
# warranty tickets nobody answered in 48 hours (to the admins), the one-year note (10 AM, news@). Each once.
[functions."field-auto"]
  schedule = "*/15 * * * *"

# Maintenance plans (patch X9): once a day, 13:20 UTC (8:20 AM Central in summer, 7:20 in winter) — visits coming up
# (office to-do), the yearly plan invoice on ✅ Approvals, and "Offer a maintenance plan" for finished home jobs.
[functions."maint-scheduled"]
  schedule = "20 13 * * *"

# Marketing part 2 (patch MKT2): every hour — the daily Google Ads / Facebook numbers (from 6 AM Central), this month's
# newsletter draft (once a month), thank-you to-dos (December + milestones), free roof check reminders the day before.
[functions."mkt2-scheduled"]
  schedule = "41 * * * *"

# patch X10: on-call escalation (every 2 minutes), vehicle reminders + access-code wipe (daily, 7 AM Central),
# monthly customer statements + "My data" e-mails (the 1st, 8 AM Central)
[functions."x10-scheduled"]
  schedule = "*/2 * * * *"

# patch AUTO11: COI renewal requests to subs, warranty check-up offers, "We need from you" reminders (daily, ~9:35 AM Central)
[functions."care11-scheduled"]
  schedule = "35 14 * * *"

# patch AUTO13: CRM health e-mail (the 1st, Central) + mitigation equipment-on-site reminder (daily)
[functions."crm-health"]
  schedule = "5 15 * * *"

# RoofScout's own address (docs/ROOFSCOUT-SETUP.md): roofscout.grayco-cs.com shows the
# roofscout/ folder, so https://roofscout.grayco-cs.com/ opens RoofScout and none of the CRM.
# Only that host is matched; graycocrm1.netlify.app and crm.grayco-cs.com are unaffected.
# (/.netlify/functions/* is never redirected by Netlify, so functions keep working there.)

# Tracked links (patch MKT2): crm.grayco-cs.com/go/<code> → the go function (it counts the click and sends the
# visitor on with the UTM tags). Only this path; everything else is untouched.
[[redirects]]
  from = "/go/*"
  to = "/.netlify/functions/go?c=:splat"
  status = 200
  force = true

# ── audit C: internal files are not public ───────────────────────────────────
# publish = "." serves every file in the repository. The setup notes and SQL in docs/ (staff e-mails, the
# Supabase project, how the security works) and the company W-9 (the EIN) were open to anyone at
# https://graycocrm1.netlify.app/docs/… . These rules answer 404 for them on every host. The W-9 the CRM
# sends to customers now lives at an unguessable address (w9/GrayCo-W-9-4ad8a7807c2d45df.pdf; the CRM's four links
# point there). Put these rules ABOVE the RoofScout rules. /.netlify/functions/* is never redirected.
[[redirects]]
  from = "/docs/*"
  to = "/404-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/RECOVER.js"
  to = "/404-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/audit.html"
  to = "/404-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404-not-public"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404-not-public"
  status = 404
  force = true

# Customer portal's own address: portal.grayco-cs.com opens the portal page, never the CRM.
# Customer links look like https://portal.grayco-cs.com/#t=... (33.151; .../portal.html#t=... works too) (PORTAL_BASE_URL).
[[redirects]]
  from = "https://portal.grayco-cs.com/"
  to = "/portal.html"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/index.html"
  to = "/portal.html"
  status = 200
  force = true

[[redirects]]
  from = "/subportal-app/*"
  to = "/404-not-public"
  status = 404
  force = true

# ── 33.151: the portals ──────────────────────────────────────────────────────────────────────────────
# portal.grayco-cs.com — "GrayCo Portal", ONE address for customers and subs (docs/SUB-PORTAL.md). It shows
# only the portal page (portal.html: sign-in, the customer portal, and the sub portal portal-app.js) and never the
# CRM: every other path on that host answers with the portal page. A link is portal.grayco-cs.com/#t=<code>; the
# server says which portal the code opens. Old customer links (crm.grayco-cs.com/portal.html#t=…) keep working.
[[redirects]]
  from = "https://portal.grayco-cs.com/portal-app.js"
  to = "/portal-app.js"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/portal-logo.png"
  to = "/portal-logo.png"
  status = 200
  force = true

# patch X9: the portal's "How did you hear about us?" and maintenance-plan cards
[[redirects]]
  from = "https://portal.grayco-cs.com/portal-plus.js"
  to = "/portal-plus.js"
  status = 200
  force = true

# patch X10: the portal's 🏠 Home profile and 💬 testimonial cards
[[redirects]]
  from = "https://portal.grayco-cs.com/portal-home.js"
  to = "/portal-home.js"
  status = 200
  force = true

# patch GCP: the portal works like an app on the phone (installable): its manifest, icons and service worker
[[redirects]]
  from = "https://portal.grayco-cs.com/portal-sw.js"
  to = "/portal-sw.js"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/portal.webmanifest"
  to = "/portal.webmanifest"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/portal-icon-192.png"
  to = "/portal-icon-192.png"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/portal-icon-512.png"
  to = "/portal-icon-512.png"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/portal-icon-180.png"
  to = "/portal-icon-180.png"
  status = 200
  force = true

[[redirects]]
  from = "https://portal.grayco-cs.com/*"
  to = "/portal.html"
  status = 200
  force = true

# bids.grayco-cs.com — the GrayCo bid site (built from subportal-app/ into subportal/, build 33.147): jobs to bid,
# plans, takeoff, bids. Subs sign in with their bid-site account once Wesley or Nick approved them. Inside the CRM
# the same site is the 🔨 Sub Portal tab (crm.grayco-cs.com/subportal/).
[[redirects]]
  from = "https://bids.grayco-cs.com/subportal/*"
  to = "https://bids.grayco-cs.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://bids.grayco-cs.com/*"
  to = "/subportal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://roofscout.grayco-cs.com/roofscout/*"
  to = "https://roofscout.grayco-cs.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://roofscout.grayco-cs.com/*"
  to = "/roofscout/:splat"
  status = 200
  force = true

# Referral program (patch REF, netlify/functions/_lib/referral.js): every hour at :37 — a referral whose job took its
# first payment gets $100–$500 of GrayCo credit PROPOSED on the approvals list for the member (credits stack and never
# expire). Nothing is added or sent until an admin approves it.
[functions."referral"]
  schedule = "37 * * * *"

# patch EST3: the daily "material prices up on your open estimates" e-mail (about 7:20 AM Central)
[functions."est-price-watch"]
  schedule = "20 12 * * *"

# patch X12: AI photo tags (stage / damage / materials) for new GrayCo Photos + CompanyCam photos.
# Dormant without ANTHROPIC_API_KEY; at most PHOTO_TAG_DAILY_MAX a day (default 300).
[functions."photo-tag"]
  schedule = "*/20 * * * *"
