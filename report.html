<style>
:root{--brand:#241968;--indigo:#1B1452;--gold:#F2A51A;--ink:#171A2B;--muted:#5B5F75;--bg:#F2F3F7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Source Sans 3','Segoe UI',-apple-system,Roboto,sans-serif}
header{background:#fff;border-bottom:3px solid var(--brand);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header img{height:44px;width:auto;display:block}
header span{font-size:13px;color:var(--muted);text-align:right}
main{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:800 22px/1.2 Archivo,'Segoe UI',sans-serif;color:var(--indigo)}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(20,16,60,.08)}
figure button{display:block;width:100%;border:0;padding:0;background:#ddd;cursor:zoom-in;aspect-ratio:4/3}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{padding:8px 10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
figcaption b{color:var(--ink)}
.tag{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.msg{background:#fff;border-radius:12px;padding:20px;text-align:center}
.lb{position:fixed;inset:0;background:rgba(10,8,30,.92);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:100%}
.lb button{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:22px;border:0;background:#fff;font-size:20px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 40px}
a{color:var(--brand)}
</style>
