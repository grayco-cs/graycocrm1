      h += '<div class="row" data-il-row="' + esc(v.id) + '"><div><b>' + esc(v.sub || v.vendor || '?') + '</b> · ' + money(v.amt) + ' · ' + esc(v.recvDate || v.date || '') + ' · ' + esc(s(v.desc).slice(0, 110)) + '</div>' +
        '<div>' + (m.level === 'sure' || m.level === 'likely' ? 'Suggested' : 'Best guess (weak)') + ': <b>' + esc(t2.p.autoPO || '') + '</b> ' + esc(t2.p.name) + ' <small>— ' + esc(m.level) + ', ' + Math.max(0, Math.min(100, t2.score)) + '/100 · ' + esc(t2.why.join('; ')) + '</small></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="b go" data-il="accept" data-pid="' + esc(t2.pid) + '">✓ Accept</button><select data-il="pick">' + jobOpts(v, m.list.map(function(y){ return { p: y.p, pid: y.pid }; })) + '</select><button type="button" class="b" data-il="none">Leave with no job</button></div></div>'; });
    if (!pr.length) h += '<div style="padding:12px 0">No guesses right now.</div>';
  } else {
    var L = arr(LOG).slice().reverse().slice(0, 80);
    h += L.length ? '<table><tr><th>When</th><th>Who</th><th>What</th></tr>' + L.map(function(e){ return '<tr><td>' + esc(s(e.at).slice(0, 16).replace('T', ' ')) + '</td><td>' + esc(e.by) + '</td><td>' + (e.kind === 'relink' ? 'QB #' + esc(e.num) + ' → ' + esc(e.toName) + (e.why ? ' <small>(' + esc(e.why) + ')</small>' : '') : 'QuickBooks-only cleanup: ' + esc(e.archive) + ' archived, ' + esc(e.merge) + ' merged, ' + esc(e.customers) + ' customer merge(s)' + (e.undone ? ' — <b>undone</b> ' + esc(s(e.undone).slice(0, 16).replace('T', ' ')) : '')) + '</td></tr>'; }).join('') + '</table>' : '<div class="mut">Nothing yet.</div>';
  }
  el.innerHTML = h + '</div>';
}

/* ── ▥ Invoices: the PO cell, three tabs, the bill's Assign… list ── */

  } catch (e) { return list; }

var SIG = '';

    else if (b2) b2.remove();
    if (!tb || !allowed()) { if (btn) btn.remove(); var u0 = D.getElementById('gc-il-unclear'); if (u0) u0.remove(); return; }
    var c = counts(), n = c.links + c.cleanup, lab = '🔗 Check invoice ↔ job links' + (n ? ' (' + n + ')' : '');
    if (!btn) { btn = D.createElement('button'); btn.type = 'button'; btn.id = 'gc-il-btn'; btn.setAttribute('data-gc-keep', '1'); style(); }
    if (btn.textContent !== lab) btn.textContent = lab;
    if (btn.nextElementSibling !== tb) tb.parentElement.insertBefore(btn, tb);
    /* the Supplier tab: payees we are not sure about */

    var onTab = Array.prototype.filter.call(tb.querySelectorAll('button'), function(x){ return x.style && String(x.style.fontWeight) === '700'; })[0];
    if (W._gcInvTab === 'suppliers' && onTab && /^Supplier Invoices/.test(s(onTab.textContent))) {
      var names = {}; invList().forEach(function(v){ if (low(v.type) !== 'sub') return; var k = CORE.payableKind(v, payLists()); if (k.kind === 'unclear') { var nm = s(v.sub || v.vendor).replace(/&amp;/g, '&'); if (nm) names[nm] = (names[nm] || 0) + 1; } });
      var keys = Object.keys(names), sig = keys.join('|');
      if (keys.length) {
        if (!un) { un = D.createElement('div'); un.id = 'gc-il-unclear'; un.setAttribute('data-gc-keep', '1'); }
