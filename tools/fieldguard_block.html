<script id="gc-patch-fieldguard">
/* __GC_PATCH_FIELDGUARD__ — a Field phone never rewrites the company's lists by itself (tools/patch_FIELDGUARD.py).
   11/18 20:31: Steven Biffle (PM) opened GrayCo Field on his iPhone for the first time in 16 days. With no tap, the phone
   uploaded about 40 shared lists (projects, invs, leads, vendors, subs, gcAcctRegister, estimates, ccw_*, gc_office_tasks …):
   133 "saves" in 5 minutes. 380 of 480 jobs went back to the cloud with only updatedAt changed, set to "now". The merge
   keeps the copy with the newer updatedAt, so a phone's old copy stamped "now" can beat the office's newer edit.
   On a device in GrayCo Field (a phone, or html._fieldmode) whose signed-in person is NOT an admin or the office
   (_gcFullAccess()), this sits under every gc_kv upload (this script runs before the sign-in layer captures fetch):
   1. A person's change is remembered per key, at the moment of the edit: a write of that key (IndexedDB "kv", localStorage,
      or the upload itself) within 20 s of the person's own input (a trusted tap / key / typing, or the end of a photo /
      file upload the person started; the CRM's _gcManualNow note is not input — background code calls it too) marks
      the key "changed by a person"
      (gc_fieldguard_dirty, kept across a reload). That key goes up whenever it is sent — offline and sent when the signal
      returns, refused as busy and retried, finished minutes after the tap — until the database answers OK.
      Any other write of a shared key is not sent: the caller gets an empty 201, as for any upload, so nothing retries or
      warns, and the office computer does the company's sweeps and migrations. Keys that belong to this device or this
      person always go (gc_perfrep_ / gc_bootrep_ / gc_adm_dev_ / gc_activity_ / gc_timeclock_ / _probe_ / a key with
      the person's e-mail in it). doc:<id> rows go with projectDocs; <key>__chunkN / __manifest with <key>.
   2. Stamp-only records are not a change: before a list goes up, the cloud row is read. Each record that differs from the
      cloud's copy only in updatedAt / savedAt / modifiedAt / _autoAssignChecked is sent as the cloud has it. A list that is
      then the same as the cloud's (by id, in any order) is not sent.
   3. Office-sized local copies (gc_snap_* / gc_safenet_* / gc_bak_* / gc_projects_backup / gc_sched_backup — the copies
      LSGUARD may evict; the data is in IndexedDB and the cloud) are not written to localStorage on such a phone and are
      removed once. This frees about 1.2 M characters of a full store.
   Admins and the office, on any device, and every desk computer: nothing changes. An admin whose role was not known yet
   when a list was held gets it sent once the role is known.
   APPLAG (owner's iPhone on one bar, 11/19: "so many lags on approvals", "keeps saying saved on phone not sent to office yet"):
   4. "A person's change" is a write within 8 s of the person's input (it was 20 s: a sweep that ran when a page was opened —
      the accounting pass over the register — counted as his change and went up). An upload itself marks its key only within
      3 s of the input (an upload 4 s after a background write is the sync, not the person). Answering a confirm / prompt is
      input. A list this guard keeps back is not read from the cloud first (__gcFG.wouldHold(key), used by the save queue).
   5. The cloud row is not downloaded again for every upload: the copy this page last saw (its own pull, its own last
      upload, or the last read here) is used when the row's updated_at (a ~100-byte read) says the cloud has not changed
      since; reads of the same row at the same moment are shared. Measured at 400 kbps: 9 reads of the 360 KB register for
      one save.
   Console: __gcFG.state()   Off: localStorage gc_fieldguard_off = '1'. */
(function(){
'use strict';
var W = window, D = document;
try {
  if (W.__gcFG) return;
  var LS = null; try { LS = W.localStorage; } catch (e) {}
  try { if (LS && LS.getItem('gc_fieldguard_off') === '1') return; } catch (e) {}
  var inner = W.fetch; if (typeof inner !== 'function') return;
  var NST = W.setTimeout, now = function(){ return Date.now(); };
  var FG = W.__gcFG = { held: {}, dirty: {}, sentAgain: 0, stampOnly: 0, sameAsCloud: 0, passed: 0, personSent: 0, lsRefused: 0, lsRemoved: 0, lastInput: 0, fullReads: 0, cheapReads: 0, cacheHits: 0, pullSeeds: 0 };
  var EDIT = 8000, POSTWIN = 3000, DK = 'gc_fieldguard_dirty';   /* APPLAG: 20 s → 8 s; an upload marks only within 3 s */
  var LOG = FG.log = [], note = function(k, act){ try { LOG.push([now(), String(k).slice(0, 60), act]); if (LOG.length > 60) LOG.shift(); } catch (e) {} };
  var SP = W.Storage && W.Storage.prototype, pSet = SP && SP.setItem, pGet = SP && SP.getItem;

  /* ── who / where ── */
  var low = function(x){ return String(x == null ? '' : x).toLowerCase(); };
  var myEmail = function(){
    try { var a = W.__GC_AUTH__; if (a && a.email) { var e = a.email(); if (e) return low(e); } } catch (e) {}
    try { var v = JSON.parse((LS && pGet.call(LS, 'gc_auth_v1')) || 'null'); if (v && v.email) return low(v.email); } catch (e) {}
    return '';
  };
  var phone = function(){
    try { if (D.documentElement.classList.contains('_fieldmode')) return true; } catch (e) {}
    var ua = String((W.navigator && W.navigator.userAgent) || '');
    return /iPhone|iPod|Android.+Mobile|Windows Phone/i.test(ua) || (/iPad|Android/i.test(ua) && (W.innerWidth || 0) < 900);
  };
  var full = function(){
    try { if (typeof W._gcFullAccess === 'function' && W._gcFullAccess()) return true; } catch (e) {}
    try { if (W.__GC_AUTH__ && W.__GC_AUTH__.isAdmin && W.__GC_AUTH__.isAdmin()) return true; } catch (e) {}
    return false;
  };
  var gAt = 0, gV = false;
  var guarded = FG.guarded = function(){
    var n = now(); if (n - gAt < 2000) return gV; gAt = n;
    gV = !!phone();   /* FGADMIN (owner 11/19, his own phone "so many lags"): every phone, admins included — the office computers do the company's sweeps */
    return gV;
  };

  /* ── a person's own input, and the keys a person changed ── */
  var personNow = function(win){ return !!FG.lastInput && now() - FG.lastInput < (win || EDIT); };
  var base = function(k){ k = String(k || ''); if (/^doc:/.test(k)) return 'projectDocs'; return k.replace(/__(chunk\d+|manifest)$/, ''); };
  try { var dj = JSON.parse((LS && pGet.call(LS, DK)) || '{}'); if (dj && typeof dj === 'object') FG.dirty = dj; } catch (e) {}
  var dT = 0, flushDirty = function(){ dT = 0; try { if (LS) pSet.call(LS, DK, JSON.stringify(FG.dirty)); } catch (e) {} };
  var saveDirty = function(){
    /* at most 300 keys, none older than 14 days; written at most once a second (and when the page is left) */
    var ks = Object.keys(FG.dirty), lim = now() - 14 * 864e5;
    ks.forEach(function(k){ if (!(FG.dirty[k] > lim)) delete FG.dirty[k]; });
    ks = Object.keys(FG.dirty); if (ks.length > 300) ks.sort(function(x, y){ return FG.dirty[x] - FG.dirty[y]; }).slice(0, ks.length - 300).forEach(function(k){ delete FG.dirty[k]; });
    if (!dT) dT = NST.call(W, flushDirty, 1000);
  };
  try { W.addEventListener('pagehide', flushDirty); } catch (e) {}
  var touchKey = function(k, win){
    if (!personNow(win) || typeof k !== 'string' || !k || k === DK || !guarded()) return;
    var b = base(k); if (FG.dirty[b] && now() - FG.dirty[b] < 1000) return;
    FG.dirty[b] = now(); saveDirty(); note(b, 'person');
  };
  /* typing the e-mail and password on the sign-in screen is not a change to the company's data */
  var mark = function(e){
    if (e && e.isTrusted === false) return;
    try { var t = e && e.target; if (D.getElementById('gc-auth-gate') || (t && t.closest && t.closest('#gc-auth-gate,[id^="gc-auth"]'))) return; } catch (x) {}
    FG.lastInput = now();
  };
  ['pointerdown', 'keydown', 'input', 'change'].forEach(function(t){ try { W.addEventListener(t, mark, { capture: true, passive: true }); } catch (e) {} });
  /* the CRM's _gcManualNow note is NOT input: background code calls it too (the Cordova lift, sweeps) */
  /* APPLAG: answering a confirm / prompt / alert is the person acting (the save that follows it is theirs) */
  ['confirm', 'prompt', 'alert'].forEach(function(n){
    try { var o = W[n]; if (typeof o !== 'function' || o.__gcFG) return; var w = function(){ try { return o.apply(this, arguments); } finally { FG.lastInput = now(); } }; w.__gcFG = true; W[n] = w; } catch (e) {}
  });
  /* a write of a key while a person is acting marks it */
  try {
    var IP = W.IDBObjectStore && W.IDBObjectStore.prototype, oPut = IP && IP.put;
    if (oPut) IP.put = function(value, key){ try { if (this.name === 'kv' && typeof key === 'string') touchKey(key); } catch (e) {} return oPut.apply(this, arguments); };
  } catch (e) {}
  /* a photo / file upload a person started: its end counts as that person acting (the save that follows it) */
  var echo = function(){ FG.lastInput = Math.max(FG.lastInput, now()); };
  try {
    var XP = W.XMLHttpRequest && W.XMLHttpRequest.prototype, oSend = XP && XP.send;
    if (oSend) XP.send = function(){ try { if (personNow()) this.addEventListener('loadend', echo); } catch (e) {} return oSend.apply(this, arguments); };
  } catch (e) {}
  /* an admin / the office whose role became known after an early hold: send what was held */
  (function poll(){
    try { var ks = Object.keys(FG.held); if (ks.length && !guarded()) { FG.held = {}; FG.sentAgain += ks.length; if (typeof W._gcSyncDirty === 'function') W._gcSyncDirty(ks); } } catch (e) {}
    NST.call(W, poll, 5000);
  })();

  /* ── which keys go without a person's change ── */
  var OWN = /^(gc_perfrep_|gc_bootrep_|gc_adm_dev_|gc_activity_|gc_timeclock_|_probe_|gc_fieldguard_)/;
  var mine = function(k){
    if (OWN.test(k)) return true;
    var e = myEmail(); if (!e) return false;
    var lk = low(k);
    return lk.indexOf(e) >= 0 || lk.indexOf(e.replace(/[^a-z0-9]/g, '_')) >= 0 || lk.indexOf(e.replace(/[^a-z0-9]/g, '-')) >= 0;
  };
  var hold = function(k){ var h = FG.held[k] || (FG.held[k] = { n: 0, at: 0 }); h.n++; h.at = now(); note(k, 'held'); };

  /* ── stamp-only records are sent as the cloud has them ── */
  var STAMP = { updatedAt: 1, updated_at: 1, savedAt: 1, modifiedAt: 1, _autoAssignChecked: 1 };
  var idOf = function(r){ return r && typeof r === 'object' && r.id != null && r.id !== '' ? String(r.id) : null; };
  var bare = function(r){ var o = {}; Object.keys(r).sort().forEach(function(f){ if (!STAMP[f]) o[f] = r[f]; }); return JSON.stringify(o); };
  var sameList = function(a, b){
    if (a.length !== b.length) return false;
    var m = {}; for (var i = 0; i < b.length; i++) { var id = idOf(b[i]); if (id == null) return false; m[id] = JSON.stringify(b[i]); }
    for (var j = 0; j < a.length; j++) { var jd = idOf(a[j]); if (jd == null || m[jd] !== JSON.stringify(a[j])) return false; }
    return true;
  };
  var hdrs = function(init){
    var o = {};
    try { new Headers((init && init.headers) || undefined).forEach(function(v, k){ if (/^(apikey|authorization)$/i.test(k)) o[k] = v; }); } catch (e) {}
    return o;
  };
  /* APPLAG: the cloud's copy of a row, as this page last saw it — checked with a ~100-byte read of updated_at before use */
  var CACHE = {}, CROW = {}, PULLS = [];
  var tsEq = function(a, b){ if (!a || !b) return false; if (String(a) === String(b)) return true; var x = Date.parse(a), y = Date.parse(b); return !isNaN(x) && x === y; };
  var cacheSet = function(k, at, v){
    if (!Array.isArray(v) || !at) return;
    CACHE[k] = { at: String(at), v: v, t: now() };
    var ks = Object.keys(CACHE); if (ks.length > 16) { ks.sort(function(x, y){ return CACHE[x].t - CACHE[y].t; }); delete CACHE[ks[0]]; }
  };
  /* the page's own pulls (select … value, updated_at): kept as text, read only when a row is needed */
  var ONE = {};   /* key → the last single-row read of it (key=eq.) — many of those, so kept apart from the bulk pulls */
  var seePull = function(r, url){
    try {
      var c = r.clone(); var p = { at: now(), t: c.text().then(null, function(){ return ''; }), map: null };
      var m1 = /[?&]key=eq\.([^&]+)/.exec(url), k1 = m1 ? decodeURIComponent(m1[1]) : '';
      if (k1) { ONE[k1] = p; var ks = Object.keys(ONE); if (ks.length > 12) { ks.sort(function(x, y){ return ONE[x].at - ONE[y].at; }); delete ONE[ks[0]]; } }
      else { PULLS.push(p); if (PULLS.length > 3) PULLS.shift(); }
    } catch (e) {}
  };
  var fromPulls = function(k){
    var i = PULLS.length - 1, one = ONE[k] ? [ONE[k]] : [];
    var next = function(){
      var p = one.length ? one.shift() : (i >= 0 ? PULLS[i--] : null);
      if (!p) return Promise.resolve(null);
      return (p.map ? Promise.resolve(p.map) : p.t.then(function(txt){
        var m = {}; p.t = Promise.resolve(''); p.map = m;
        if (!txt || txt.length > 8000000) return m;
        try { var rows = JSON.parse(txt); if (Array.isArray(rows)) rows.forEach(function(x){ if (x && x.key && Array.isArray(x.value) && x.updated_at) m[x.key] = { at: String(x.updated_at), v: x.value, t: now() }; }); } catch (e) {}
        return m;
      })).then(function(m){ var c = m && m[k]; if (c) { FG.pullSeeds++; return c; } return next(); });
    };
    return next();
  };
  var getJ = function(u, init){ return inner.call(W, u, { method: 'GET', headers: hdrs(init) }).then(function(r){ return r.ok ? r.json() : null; }); };
  var cloudRow = function(url, init, k){
    if (CROW[k]) return CROW[k];
    var base0; try { base0 = new URL(url, location.href); } catch (e) { return Promise.resolve(null); }
    var q = function(sel){ var u = new URL(base0.toString()); u.search = '?key=eq.' + encodeURIComponent(k) + '&select=' + sel; return u.toString(); };
    var full = function(){ FG.fullReads++; return getJ(q('value,updated_at'), init).then(function(rows){ var r = rows && rows[0]; if (!r) return null; cacheSet(k, r.updated_at, r.value); return { at: r.updated_at, v: r.value }; }); };
    var p = (CACHE[k] ? Promise.resolve(CACHE[k]) : fromPulls(k)).then(function(c){
      if (!c) return full();
      FG.cheapReads++;
      return getJ(q('updated_at'), init).then(function(rows){ var r = rows && rows[0]; if (!r) return null; if (tsEq(r.updated_at, c.at)) { FG.cacheHits++; CACHE[k] = c; c.t = now(); return c; } return full(); });
    }).then(null, function(){ return null; });
    CROW[k] = p; var clr = function(){ if (CROW[k] === p) delete CROW[k]; }; p.then(clr, clr);
    return p;
  };
  var unstamp = function(url, init, k, val){
    if (!Array.isArray(val) || !val.length || /__(chunk\d+|manifest)$/.test(k)) return Promise.resolve(val);
    return cloudRow(url, init, k).then(function(row){
      var cv = row && row.v;
      if (!Array.isArray(cv)) return val;
      var c = {}; cv.forEach(function(r){ var id = idOf(r); if (id != null) c[id] = r; });
      var n = 0;
      var out = val.map(function(r){ var id = idOf(r), x = id != null ? c[id] : null; if (!x || x === r) return r; try { if (JSON.stringify(x) !== JSON.stringify(r) && bare(x) === bare(r)) { n++; return x; } } catch (e) {} return r; });
      FG.stampOnly += n;
      if (sameList(out, cv)) { FG.sameAsCloud++; return null; }   /* nothing to send */
      return out;
    }, function(){ return val; });
  };

  var EMPTY = function(pref){ var rep = /return=representation/.test(pref || ''); return new Response(rep ? '[]' : null, { status: 201, headers: rep ? { 'Content-Type': 'application/json' } : {} }); };
  /* sent: the database said OK — a person's change of that key is up (unless the key was changed again meanwhile) */
  var sentOk = function(keys, at){ var ch = false; keys.forEach(function(k){ var b = base(k); note(b, 'ok'); if (FG.dirty[b] && FG.dirty[b] <= at) { delete FG.dirty[b]; ch = true; } }); if (ch) saveDirty(); };
  var allowed = function(k){ return !k || mine(k) || !!FG.dirty[base(k)]; };
  var guardedFetch = function(input, init){
    try {
      var url = typeof input === 'string' ? input : (input && input.url) || String(input);
      var m = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
      if (m === 'GET' || m === 'HEAD' || m === 'OPTIONS') {
        /* APPLAG: a pull of rows with their values: what the cloud had, for the stamp check of a later upload */
        if (m === 'GET' && /\/rest\/v1\/gc_kv\?/.test(url) && /select=[^&]*value/.test(url) && /select=[^&]*updated_at/.test(url) && guarded()) {
          var pg = inner.apply(this, arguments); try { pg.then(function(r){ if (r && r.ok) seePull(r, url); }, function(){}); } catch (e) {} return pg;
        }
        return inner.apply(this, arguments);
      }
      if (!/\/rest\/v1\/gc_kv(\?|$)/.test(url)) {
        /* a file / photo upload a person started: when it ends, the save that follows it is the person's */
        if (personNow() && /\/storage\/v1\/|\/\.netlify\/functions\//.test(url)) { var pr = inner.apply(this, arguments); try { pr.then(echo, echo); } catch (e) {} return pr; }
        return inner.apply(this, arguments);
      }
      if (!guarded()) return inner.apply(this, arguments);
      var pref = ''; try { pref = String(new Headers((init && init.headers) || undefined).get('Prefer') || ''); } catch (e) {}
      var at = now();
      if (m === 'DELETE' || m === 'PATCH') {
        var qk = /[?&]key=eq\.([^&]+)/.exec(url), dk = qk ? decodeURIComponent(qk[1]) : '';
        touchKey(dk, POSTWIN);
        if (allowed(dk)) { FG.passed++; var pd = inner.apply(this, arguments); try { pd.then(function(r){ if (r && r.ok) sentOk([dk], at); }, function(){}); } catch (e) {} return pd; }
        hold(dk || '?'); return Promise.resolve(EMPTY(pref));
      }
      if (m !== 'POST' || !init || typeof init.body !== 'string') return inner.apply(this, arguments);
      var b; try { b = JSON.parse(init.body); } catch (e) { return inner.apply(this, arguments); }
      var rows = Array.isArray(b) ? b : [b], keep = [];
      rows.forEach(function(r){ var k = r && r.key != null ? String(r.key) : ''; touchKey(k, POSTWIN); if (allowed(k)) keep.push(r); else hold(k); });
      if (!keep.length) return Promise.resolve(EMPTY(pref));
      var self = this;
      return Promise.all(keep.map(function(r){ var k = String(r.key || ''); return mine(k) ? Promise.resolve(r) : unstamp(url, init, k, r.value).then(function(v){ if (v === null) return null; if (v === r.value) return r; var c = Object.assign({}, r); c.value = v; return c; }); })).then(function(out){
        var keys = keep.map(function(r){ return String(r.key || ''); });
        out = out.filter(Boolean);
        if (!out.length) { keys.forEach(function(k){ note(k, 'same as cloud'); }); sentOk(keys, at); return EMPTY(pref); }   /* the cloud already has it */
        FG.passed += out.length;
        var body = Array.isArray(b) ? JSON.stringify(out) : JSON.stringify(out[0]);
        keys.forEach(function(k){ note(k, 'send'); });
        return inner.call(self, input, Object.assign({}, init, { body: body })).then(function(r){ if (r && r.ok) { sentOk(keys, at); FG.personSent++; try { out.forEach(function(x){ if (x && x.key && Array.isArray(x.value)) { var k0 = String(x.key), v0 = x.value; cacheSet(k0, x.updated_at || new Date(0).toISOString(), v0); try { var u0 = new URL(url, location.href); u0.search = '?key=eq.' + encodeURIComponent(k0) + '&select=updated_at'; getJ(u0.toString(), init).then(function(rr){ var a0 = rr && rr[0] && rr[0].updated_at; if (a0 && CACHE[k0] && CACHE[k0].v === v0) CACHE[k0].at = String(a0); }, function(){}); } catch (e2) {} } }); } catch (e) {} }   /* the row's updated_at as the database keeps it (~100 bytes) */ else keys.forEach(function(k){ note(k, 'refused ' + (r && r.status)); }); return r; }, function(e){ keys.forEach(function(k){ note(k, 'no answer'); }); throw e; });
      });
    } catch (e) { return inner.apply(this, arguments); }
  };
  guardedFetch.__gcFG = true;
  /* APPLAG: would an upload of this key be kept back right now (the save queue does not read the cloud row for nothing) */
  FG.isHeld = function(k){ try { return guarded() && !allowed(String(k || '')); } catch (e) { return false; } };   /* the same, without marking */
  FG.wouldHold = function(k){ try { k = String(k || ''); if (!guarded()) return false; touchKey(k, POSTWIN); return !allowed(k); } catch (e) { return false; } };
  W.fetch = guardedFetch;

  /* ── office-sized local copies stay off a Field phone; a person's write marks its key ── */
  var COPY = /^(gc_snap_[A-Za-z]+|gc_bak_[A-Za-z]+|gc_safenet_[A-Za-z]+|gc_projects_backup|gc_sched_backup)$/;
  if (SP && LS && typeof pSet === 'function') {
    SP.setItem = function(k, v){
      try {
        if (this === LS) {
          var ks = String(k);
          if (COPY.test(ks) && ks !== 'gc_safenet_meta' && guarded()) { FG.lsRefused++; return; }
          touchKey(ks);
        }
      } catch (e) {}
      return pSet.apply(this, arguments);
    };
    var cleaned = false;
    (function clean(n){
      try {
        if (!cleaned && guarded()) {
          cleaned = true; var ks = [];
          for (var i = 0; i < LS.length; i++) { var k = LS.key(i); if (k && COPY.test(k) && k !== 'gc_safenet_meta') ks.push(k); }
          ks.forEach(function(k){ try { LS.removeItem(k); FG.lsRemoved++; } catch (e) {} });
        }
      } catch (e) {}
      if (!cleaned && n < 60) NST.call(W, function(){ clean(n + 1); }, 5000);
    })(0);
  }

  FG.state = function(){ return { guarded: guarded(), phone: phone(), full: full(), email: myEmail(), lastInput: FG.lastInput ? new Date(FG.lastInput).toISOString() : '', held: JSON.parse(JSON.stringify(FG.held)), dirty: JSON.parse(JSON.stringify(FG.dirty)), sentAgain: FG.sentAgain, stampOnly: FG.stampOnly, sameAsCloud: FG.sameAsCloud, passed: FG.passed, personSent: FG.personSent, log: LOG.slice(-25), lsRefused: FG.lsRefused, lsRemoved: FG.lsRemoved, fullReads: FG.fullReads, cheapReads: FG.cheapReads, cacheHits: FG.cacheHits, pullSeeds: FG.pullSeeds, cached: Object.keys(CACHE) }; };
} catch (e) { try { console.warn('[GC] FIELDGUARD not installed:', e && e.message || e); } catch (x) {} }
})();
</script>
