<script id="gc-patch-portaled">
/* __GC_PATCH_PORTALED__ — 👤 CUSTOMER PORTAL: open the job's portal full screen, see what the customer sees, and edit it.
   Owner 11/19 (iPhone, GrayCo Field): "If I click customer portal I'd like to open their portal and see what's in it, edit
   jobs, add jobs, tasks, scopes, whatever in the portal, add plans, addendum, ask questions, all in portal."
   • 👤 Customer portal on a job card / the job page (Field) and ✏️ Open portal on the desk's 🏠 Portal card open one full-screen
     page for that job — admin / office / the job's own PM only (the same rule as the button: _gcFP.perms(pid).cust; a PM gets
     only his own jobs). Everyone else: nothing opens.
   • No portal yet → "🏠 Make the portal": says what it does first (the link is made, NOTHING is sent — no e-mail, no text;
     the customer gets it only when you send the link yourself), then patch Q's own "by hand" link (_gcPortal.link).
   • 👁 Customer view: the real portal page as the customer sees it (portal.html, the staff preview "&p=1": not counted as the
     customer opening it, the customer's buttons are off). ✏️ Edit portal: the same contents with edit buttons:
       📝 Project details — the job name, address, the stage the customer sees, "About your project" (job.portalSummary)
       📅 Schedule — the job's own customer steps (from 📅 Schedule) + milestones added here (job.portalMilestones)
       ✅ Checklist — tasks the customer sees (job.portalTasks), done / not done
       📎 We need from you — the customer's to-dos (patch AUTO11, cust-care needs-*)
       📐 Scope of work — from the job's scopes (the 📋 no-price sub scope — never the 💲 budget) or the Scopes-tab text, or typed
          (job.portalScopes: area / work / qty / unit — never a price, a note or a sub)
       📄 Plans & documents — upload a PDF / picture (job's Documents, "Plans", customer sees it); the portal gate (PORTALGATE)
          holds a new paper until it is approved: "⏳ Waiting for approval" + ✅ Put it in the portal (the server's own approval)
       ✍️ Change orders & addendums — ✨ New change order (the CRM's CO form; AUTO5 asks the customer to sign it) or an addendum
          paper to sign (portal-sign: the paper shows in "Papers to sign"; the e-mail asking them waits on ✅ Approvals)
       💬 Questions & messages — the portal's Messages thread (portal-access s-thread / s-send): no e-mail, no text
       📣 Updates & photos — patch Q's 📣 Post; an update can be hidden from the customer (kept on the job)
       ➕ Another job for this customer (admin / office — patch NEWPROJ's form), then its portal: the customer's sign-in shows every
          job with their e-mail / phone that has a portal
   • Every change shows "👁 Visible to the customer" (what exactly they will see) before it is saved; nothing here e-mails or
     texts the customer. The ONE thing that may: "✉️ Tell the customer about new papers" — an explicit button, the server's
     notify-docs (it waits on ✅ Approvals, where an approver may also ✅ Approve — don't send / APPRNOSEND); off while ⏸
     data-entry mode is on (as are messages and signature requests).
   • Archive, never delete: a task / milestone / scope is archived (kept on the job, not shown), an update is hidden, a paper is
     turned off for the customer, a "We need" item is cancelled.
   • The customer's page never gets an insurance carrier's name, a sub, a price or a portal link from here (the server cleans
     every text: netlify/functions/_lib/portaled.js); this page never shows the sub portal.
   No timers, no observers. API: window._gcPortalEd = { open(pid), close(), can(pid), state() } */

function later(f, ms){ return ST.call(W, f, ms || 0); }
function s(v){ return v == null ? '' : String(v).trim(); }
function low(v){ return s(v).toLowerCase(); }
function arr(v){ return Array.isArray(v) ? v : []; }
function esc(v){ return s(v).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var p = arr(crm().projects).filter(function(x){ return x && String(x.id) === String(pid); })[0] || null;
  var r = recent[pid]; if (r && (!p || s(r.updatedAt) > s(p.updatedAt))) return r;

  return mine && /project manager|\bapm\b|assistant p/i.test(role());   /* the job's own PM */
}
function canAddJob(){ try { return typeof W._gcNewProjectFor === 'function' && typeof W._gcNewProjectCan === 'function' && !!W._gcNewProjectCan(); } catch (e) { return false; } }
function paused(){ try { return !!(W._gcPause && W._gcPause.state && W._gcPause.state().paused); } catch (e) { return false; } }
function me(){ try { var e = low(W.__GC_AUTH__ && W.__GC_AUTH__.email && W.__GC_AUTH__.email()); var u = arr(crm().users).filter(function(x){ return x && low(x.email) === e; })[0]; if (u && u.name) return s(u.name); } catch (e) {} try { return s(localStorage.getItem('grayco_user')) || 'GrayCo'; } catch (e) { return 'GrayCo'; } }

/* ── the link (patch Q's: /portal.html#t=<43>) ── */
var LINK = /^https:\/\/[^\s]+\/(?:portal\.html)?#t=([A-Za-z0-9_-]{43})$/, MADE = {};   /* crm…/portal.html#t= or portal.grayco-cs.com/#t= */
function linkOf(p){ if (!p || p.portalOff) return ''; var u = s(p.portalUrl); if (!LINK.test(u)) u = s(MADE[p.id]); return LINK.test(u) ? u : ''; }
function tokenOf(p){ var m = LINK.exec(linkOf(p)); return m ? m[1] : ''; }
/* the staff preview on THIS site (the portal page allows frames from its own site only) */
function frameUrl(p){ var t = tokenOf(p); return t ? '/portal.html#t=' + t + '&p=1' : ''; }

/* ── the servers (the sign-in layer adds the staff sign-in to every /.netlify/functions call) ── */
function fn(name, body){
  return W.fetch('/.netlify/functions/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
    .then(function(r){ return r.text().then(function(t){ var j = {}; try { j = JSON.parse(t) || {}; } catch (e) { j = { error: t.slice(0, 160) }; } j.__s = r.status; return j; }); },
      function(e){ return { ok: false, __s: 0, error: 'No signal — try again.' }; });
}

/* ── saving the job (the CRM's own "a person did this" writer: this phone's copy, stamped, then synced) ── */
function patchJob(pid, patch, why){
  if (typeof W._gcxPatchJob !== 'function') return Promise.resolve(false);
  return Promise.resolve(W._gcxPatchJob(pid, patch, why || 'customer portal editor')).then(function(ok){
    if (ok) { var p = proj(pid); if (p) recent[pid] = Object.assign({}, p, patch, { updatedAt: nowIso() }); }
    return ok;
  }, function(){ return false; });
}
/* a row list on the job (tasks / milestones / scopes): changed from the newest copy of the job */
function patchList(pid, key, change){
  var p = proj(pid); if (!p) return Promise.resolve(false);
  var l = arr(p[key]).map(function(x){ return Object.assign({}, x); });
  var out = change(l); if (out) l = out;
  var o = {}; o[key] = l; return patchJob(pid, o);
}
/* a paper on the job's Documents (the same way patch Q adds one: this phone's copy, the screen, the cloud) */
function addDoc(rec){
  var all0 = W.idbGet ? Promise.resolve(W.idbGet('projectDocs')).catch(function(){ return null; }) : Promise.resolve(null);
  return all0.then(function(all){
    if (!Array.isArray(all)) all = arr(crm().projectDocs || W._gcProjectDocs).slice();
    if (all.some(function(d){ return d && d.id === rec.id; })) return true;
    var next = all.concat([rec]);
    try { W.__GC_MANUAL_SAVE__ = true; if (W._gcManualNow) W._gcManualNow('customer portal editor'); } catch (e) {}
    return Promise.resolve(W.idbSet ? W.idbSet('projectDocs', next) : null).catch(function(){}).then(function(){
      try { if (W._setProjectDocs) W._setProjectDocs(function(prev){ return Array.isArray(prev) ? (prev.some(function(d){ return d && d.id === rec.id; }) ? prev : prev.concat([rec])) : next; }); } catch (e) {}
      try { if (W._crm) W._crm.projectDocs = next; } catch (e) {}
      try { if (W._supaUpsert) W._supaUpsert('projectDocs', next); } catch (e) {}
      later(function(){ try { W.__GC_MANUAL_SAVE__ = false; } catch (e) {} }, 1500);
      return true;
    });
  });
}
function setDoc(id, change){
  var all0 = W.idbGet ? Promise.resolve(W.idbGet('projectDocs')).catch(function(){ return null; }) : Promise.resolve(null);
  return all0.then(function(all){
    if (!Array.isArray(all)) all = arr(crm().projectDocs || W._gcProjectDocs).slice();
    var hit = false, at = nowIso();
    var next = all.map(function(d){ if (d && String(d.id) === String(id)) { hit = true; var q = Object.assign({}, d); change(q); q.updatedAt = at; q.savedAt = at; return q; } return d; });
    if (!hit) return false;
    try { W.__GC_MANUAL_SAVE__ = true; if (W._gcManualNow) W._gcManualNow('customer portal editor'); } catch (e) {}
    return Promise.resolve(W.idbSet ? W.idbSet('projectDocs', next) : null).catch(function(){}).then(function(){
      try { if (W._setProjectDocs) W._setProjectDocs(function(prev){ return Array.isArray(prev) ? prev.map(function(d){ var n = next.filter(function(x){ return x && d && x.id === d.id; })[0]; return n || d; }) : next; }); } catch (e) {}
      try { if (W._crm) W._crm.projectDocs = next; } catch (e) {}
      try { if (W._supaUpsert) W._supaUpsert('projectDocs', next); } catch (e) {}
      later(function(){ try { W.__GC_MANUAL_SAVE__ = false; } catch (e) {} }, 1500);
      return true;
    });
  });
}
function jobDocs(pid){
  var all0 = W.idbGet ? Promise.resolve(W.idbGet('projectDocs')).catch(function(){ return null; }) : Promise.resolve(null);
  return all0.then(function(all){ if (!Array.isArray(all) || !all.length) all = arr(crm().projectDocs || W._gcProjectDocs); return all.filter(function(d){ return d && String(d.pid) === String(pid) && d.deleted !== true; }); });
}
/* patch Q's rule for what a customer sees by itself (the server's docShown) */
var CUSTOMER_DOC = /proposal|contract|change.?order|\binvoice|warrant|welcome|faq|completion|certificate of (substantial )?completion|final inspection|sign.?off|lien|waiver|work auth|customer portal|closeout|receipt|\bplans?\b|drawing/i;
var INTERNAL_DOC = /\bsub(contract(or)?)?\b|subcontract|sub.?agreement|job sheet|w-?9|\bcoi\b|certificate of insurance|onboarding|\bbid|vendor|supplier|\bcost|budget|payroll|commission|internal|operations manual|takeoff|purchase order|timesheet|tax return/i;
function shown(d){
  if (d.internal === true || d.portalNever === true || d.needsReview === true) return false;
  if (d.portalShare === true) return true; if (d.portalShare === false) return false;
  if (/companycam/i.test(s(d.cat) + s(d.source))) return false;
  var t = s(d.cat) + ' | ' + s(d.name) + ' | ' + s(d.kind);
  return !INTERNAL_DOC.test(t) && /proposal|contract|change.?order|\binvoice|warrant|welcome|faq|completion|final inspection|sign.?off|lien|waiver|work auth|customer portal|closeout|receipt/i.test(t);
}

/* ── words a customer never sees (the server takes them out too; here it is said before saving) ── */
var CARRIERS = /\b(state\s*farm|allstate|usaa|liberty\s*mutual|nationwide|travelers|progressive|american\s*family|erie\s*insurance|chubb|the\s*hartford|auto[\s-]*owners|safeco|geico|homesite|metlife|amica|tennessee\s*farmers|farmers\s*insurance|farm\s*bureau|shelter\s*insurance)\b/i;
function warnings(p, text){
  var t = s(text), out = [];
  if (!t) return out;
  var car = ['insCarrier', 'carrier', 'insurer', 'insuranceCompany', 'insuranceCarrier', 'insCompany', 'insuranceCo', 'carrierName'].map(function(k){ return s(p && p[k]); }).filter(function(v){ return v.length >= 3; });
  if (CARRIERS.test(t) || car.some(function(c){ return low(t).indexOf(low(c)) >= 0; })) out.push('An insurance company’s name is never shown to a customer — the portal will say “your insurance company”.');
  if (arr(p && p.subs).some(function(r){ var n = s(r && (r.name || r.company)); return n.length >= 4 && low(t).indexOf(low(n)) >= 0; })) out.push('A sub’s name is never shown to a customer — the portal will say “our trade partner”.');

  return out;
}

}

/* another part of the CRM opened its own sheet from here (📣 Post, ✨ New change order, ➕ New project …): lift it above this page */
function lift(before){
  [0, 120, 400].forEach(function(ms){ later(function(){
    Array.prototype.forEach.call(D.body.children, function(e){
      if (before.has(e) || e.id === 'gcpe' || e.id === 'gcpe-toast' || e.tagName === 'SCRIPT' || e.tagName === 'STYLE') return;
      var cs = W.getComputedStyle(e); if (cs.position !== 'fixed' && cs.position !== 'absolute') return;
      var z = parseInt(cs.zIndex, 10); if (!(z > Z)) e.style.zIndex = String(Z + 20);
    });

    confirmVis(b.closest('.pe-row'), { lines: [(hide ? 'Hidden from the customer (kept on the job): ' : 'Back on the customer’s Home: ') + (s(po.text).slice(0, 120) || '(photos)')], ok: hide ? 'Hide it' : 'Show it',
      save: function(){ return patchList(pid, 'portalPosts', function(l){ l.forEach(function(x){ if (x && x.id === poid) { x.hidden = hide; if (hide) { x.hiddenAt = nowIso(); x.hiddenBy = me(); } } }); }); } });
    return;
  }
  if (a === 'job-open') { var jid = b.getAttribute('data-id'); open(jid); return; }
  if (a === 'job-add') {
    foreign(function(){
      Promise.resolve(W._gcNewProjectFor({ kind: 'client', customer: s(p.client), client: s(p.client), address: s(p.address), rec: { client: s(p.client), customerName: s(p.client), address: s(p.address) } })).then(function(r){
        var np = r && r.project; if (!np) return;
        toast('New job “' + s(np.name) + '” made. Open it here to 🏠 make its portal (nothing is sent).');
        later(function(){ if (proj(np.id) && can(proj(np.id))) open(np.id); else paint(); }, 900);
      }, function(){});
    });
    return;
  }
  if (a === 'tell') {
    if (paused()) { toast('⏸ Data-entry mode is on — nothing is sent to customers.', true); return; }
    if (!(W._gcPortal && typeof W._gcPortal.notify === 'function')) return;
    confirmVis(b, { lines: ['An e-mail: "New in your GrayCo portal" with the new papers listed and a button to the portal.'], ok: '✉️ Send to ✅ Approvals', note: 'Nothing goes to ' + who + ' until it is approved on ✅ Approvals (an approver may also ✅ Approve — don’t send).',
      save: function(){ return Promise.resolve(W._gcPortal.notify(pid)).then(function(){ return true; }); }, done: 'Asked — the e-mail waits on ✅ Approvals (if there is something new to tell).' });
    return;
  }
}
/* ⬆ plans / papers: the job's Documents ("Plans"), customer sees it once the gate approves it */
function upload(files, label){
  var pid = CUR.pid, p = proj(pid); if (!p) return;
  var ok = files.filter(function(f){ return /pdf|image\//.test(f.type || '') || /\.(pdf|jpe?g|png|heic|heif|webp)$/i.test(f.name || ''); }).filter(function(f){ return f.size <= 25 * 1048576; });
  if (!ok.length) { toast('Pick a PDF or a picture (25 MB at most).', true); return; }
  var anchor = label || body().querySelector('[data-pe-sec="docs"] label');
  confirmVis(anchor, { lines: ok.map(function(f){ return '📄 In the customer’s Documents (Plans): ' + f.name; }), texts: ok.map(function(f){ return f.name; }), ok: 'Add — the customer sees it once approved',
    note: 'It goes to the job’s Documents now; the customer sees it after its ✅ Approvals item ("Put in the customer portal") is approved. Nothing is e-mailed.',
    save: function(){
      if (typeof W._gcStoreFile !== 'function') return Promise.reject(new Error('file storage is not ready — try again in a moment'));
      var chain = Promise.resolve(0), ids = [];
      ok.forEach(function(f){ chain = chain.then(function(n){
        return Promise.resolve(W._gcStoreFile(f, { kind: 'doc', pid: pid, name: f.name })).then(function(meta){
          if (!meta || !meta.ref) throw new Error('“' + f.name + '” was not saved');
          var at = nowIso();
          var nid = uid('pped_'); ids.push(nid);
          return addDoc({ id: nid, pid: pid, name: f.name, cat: 'Plans', type: meta.type || f.type || '', size: meta.size || f.size, ref: meta.ref, hash: meta.hash || '', uploaded: at.slice(0, 10), uploadedAt: at, by: me(), portalShare: true, source: 'portal-editor', savedAt: at, updatedAt: at }).then(function(){ return n + 1; });
        });
      }); });
      return chain.then(function(n){
        /* the portal gate: its "Put in the customer portal" approval (the server waits until the job's papers reached the cloud) */
        /* the paper reaches the cloud a few seconds after it is saved here (the sync): ask again until the gate has it */
        var want = ids.map(function(id){ return 'd:' + id; }), waits = [3000, 5000, 8000, 15000, 30000];
        (function chase(i){ if (i >= waits.length) return; later(function(){
          if (CUR.pid !== pid) return; CUR.scanAt = Date.now();
          fn('portal', { action: 'gate', op: 'scan', projectId: pid }).then(loadGate).then(function(){
            var have = arr(CUR.gate && CUR.gate.items).map(function(x){ return x.key; });
            if (!want.every(function(k){ return have.indexOf(k) >= 0; })) chase(i + 1);
          });
        }, waits[i]); })(0);
        paintDocs(); return n > 0;
      });
    }, done: 'Added to the job’s Documents — waiting for approval to show in the portal.' });
}
