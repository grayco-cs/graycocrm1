<script id="gc-patch-jobinfo">
/* __GC_PATCH_JOBINFO__ — the GrayCo Field job page: job info you can edit, progress means active, the job's own
   documents and schedule as full white pages (tools/patch_JOBINFO.py). Owner 11/19 on his iPhone ("Outdoor Entertainment
   Area"): "If I update progress to 25% that obviously means the job is active. It should also have where I can edit the
   project info, have customer info, where I can mark active or edit info too." · "All these should just be buttons, don't
   do add more, just make all of them." · no navy on phones.
   1. Progress means active: a person's progress save above 0 % (Field 📈 Update Progress, the desk's % box, ✏️ Update job —
      every caller of window._gcSetProjectPct, within 20 s of a person's own tap / key) on a job whose status is not active
      (bidding / estimating / approved / on_hold / lead …) sets status "active" (the desk's value) through the CRM's
      person-edit job writer (window._gcxPatchJob: stamped, FIELDGUARD's "a person changed it", synced) and logs it in the
      job's statusHistory; a short note says "Job marked Active (progress 25%)". A completed / closed / lost job is never
      changed. At 100 % the note offers "Mark complete?" (the CRM's own _gcMarkJobCompleted with its cost / payment / punch
      checks) — nothing is forced. Stage automations follow the CRM's own change feed (job_stages is a held automation;
      nothing here sends a customer message).
   2. The job page: every tile in one continuous 2-column grid, always (no "More for this job" toggle, no gaps);
      📋 Job Info is "✏️ Job info", button 1 (top-left); 📄 Documents right after the main tiles; one compact customer
      row on top (name · 📞 Call · ✉️).
   3. ✏️ Job info (the existing Job Profile, in Field: a full white page, ‹ Back on top, clear of the bottom bar): status with
      a big ▶ Mark Active and the other statuses; name, PO / job #, address (+ Map, Copy), type, PM, start / target dates,
      notes; the customer (name, phone — tap to call, e-mail, address, the linked customer record: job.customerId → the
      customers list, else the same name). Admins, the office and the job's own PM edit (by role); others read. Saves:
      the job through _gcxPatchJob, the customer record through the CRM's customers list (the screen's setter, this
      phone's disk, the cloud). The Scope of Work, job updates, sub agreements and Send job info to a sub stay; the photo
      section goes (📸 has its own tile) and the documents part links to 📄 Documents.
   4. 📄 Documents (the existing Field Documents list, as a white page): Auto documents (the job's 📑 Paperwork card —
      JOBDOCS / JOBREQ / EPAHUD html and actions, their own statuses and send rules, ⏸ data-entry mode included) · ＋ Add
      file (📷 Add Photo/File's own flow) · all files (FIELDPORTAL2's list) · 🗄 Archive a file (kept: deleted + archived
      flags, the CRM's soft delete; ♻ Restore).
   5. 📅 Schedule & Inspections: a white page for THIS job — its schedule items and inspections, upcoming first, past
      folded; ＋ Add to schedule (the job preset; a sub or our crew; one item per work day like PMFIELD) and tap to edit /
      move, saved through PMFIELD's schedule writer (the company schedule: disk, cloud, screen — My Schedule and the desk
      show it). 🗄 Archive = a copy kept on the job (schedArchive) and the item off the schedule. Nothing texts a sub
      (SUBCONFIRM's 👷 Confirm list is the only path).
   API: window._gcJobInfo = { open(pid), docs(pid), sched(pid), canEdit(pid), custOf(p), state() } */
(function(){
'use strict';
var W = window, D = document;
if (W.__GC_PATCH_JOBINFO__) return; W.__GC_PATCH_JOBINFO__ = true;
var ST = W.__GC_NATIVE_SETTIMEOUT__ || W.setTimeout;
function later(f, ms){ return ST.call(W, f, ms || 0); }
function s(v){ return v == null ? '' : String(v).trim(); }
function low(v){ return s(v).toLowerCase(); }
function arr(v){ return Array.isArray(v) ? v.filter(function(x){ return x != null; }) : []; }
function esc(v){ return s(v).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function C(){ return W._crm || {}; }

function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function nowIso(){ return new Date().toISOString(); }
function warn(e){ try { console.warn('[GC JOBINFO]', e); } catch (x) {} }
var STATS = { pct: 0, activated: 0, saves: 0, cust: 0, sched: 0, docs: 0, errs: [], notes: [] };
function oops(e){ warn(e); try { STATS.errs.push(String(e && e.message || e).slice(0, 160)); if (STATS.errs.length > 20) STATS.errs.shift(); } catch (x) {} }

/* ── who ── */
function projAll(){ var l = arr(C().projects); if (!l.length) { try { l = arr(W._gcFPJobs && W._gcFPJobs()); } catch (e) {} } return l; }
function proj(pid){ if (pid && typeof pid === 'object') pid = pid.id; var p = projAll().filter(function(x){ return x && s(x.id) === s(pid); })[0]; if (!p) { try { var cj = W._gcCurrentJob; if (cj && s(cj.id) === s(pid)) p = cj; } catch (e) {} } return p || null; }
function meU(){ try { return (typeof W._gcMeUser === 'function' && W._gcMeUser()) || {}; } catch (e) { return {}; } }
function myName(){ var n = s(meU().name); if (n) return n; try { var j = JSON.parse(localStorage.getItem('grayco_user') || '{}'); if (j && j.name) return s(j.name); } catch (e) {} try { return s(localStorage.getItem('grayco_user')); } catch (e) { return ''; } }
function role(){ try { return W._gcRP && W._gcRP.role ? s(W._gcRP.role()) : ''; } catch (e) { return ''; } }
function seesAll(){ try { if (typeof W._gcProjSeesAll === 'function') return !!W._gcProjSeesAll(); } catch (e) {} try { return !!(W.__GC_AUTH__ && W.__GC_AUTH__.isAdmin && W.__GC_AUTH__.isAdmin()); } catch (e) { return false; } }

function fieldMode(){ try { return D.documentElement.classList.contains('_fieldmode') || !!D.getElementById('_gcJobDash'); } catch (e) { return false; } }

/* ── a person's own input (a trusted tap / key) ── */
var lastInput = 0;
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click', 'change', 'input'].forEach(function(t){ try { D.addEventListener(t, function(e){ if (e && e.isTrusted) lastInput = Date.now(); }, true); } catch (e) {} });

/* ── the note ── */
function toast(t, act, fn){
  try { STATS.notes.push(s(t).slice(0, 120)); if (STATS.notes.length > 20) STATS.notes.shift(); } catch (e) {}
  var el = D.getElementById('gcji-toast');
  if (!el) { el = D.createElement('div'); el.id = 'gcji-toast'; el.setAttribute('data-gc-keep', '1'); el.setAttribute('role', 'status'); D.body.appendChild(el); }
  el.innerHTML = '<span>' + esc(t) + '</span>' + (act ? '<button type="button" data-ji-t="go">' + esc(act) + '</button>' : '') + '<button type="button" data-ji-t="x" aria-label="Close">✕</button>';
  el.style.display = 'flex'; css();
  el.onclick = function(e){ var b = e.target.closest && e.target.closest('[data-ji-t]'); if (!b) return; el.style.display = 'none'; if (b.getAttribute('data-ji-t') === 'go' && fn) { try { fn(); } catch (x) { oops(x); } } };
  clearTimeout(el.__t); el.__t = later(function(){ el.style.display = 'none'; }, act ? 12000 : 5000);
}

/* ── no blocking boxes in the progress / stage flow (owner 11/19: "I don't like these popups"): notes + To-Dos ── */
/* an older job (the papers rule: made or started before 11/19, or entered as history) gets no new To-Do */
function older(p){
  try { if (W._gcPapers && typeof W._gcPapers.older === 'function') return !!W._gcPapers.older(p); } catch (e) {}
  if (!p) return false; if (p.importedHistory || p.dataEntry || s(p.createdVia) === 'invoice-entry') return true;
  var m = s(p.created || p.createdAt).slice(0, 10), st = s(p.startDate).slice(0, 10);
  return !!((m && m < '2026-11-19') || (st && st < '2026-11-19'));
}
function tasksGet(){ try { var l = JSON.parse(localStorage.getItem('gc_office_tasks') || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function tasksPut(l){ try { localStorage.setItem('gc_office_tasks', JSON.stringify(l)); } catch (e) {} try { if (W._gcOfficeTasksPush) W._gcOfficeTasksPush(); } catch (e) {} try { var u = W._supaUpsertNow || W._supaUpsert; if (u) u('gc_office_tasks', l); } catch (e) {} try { if (typeof W._gcSyncDirty === 'function') W._gcSyncDirty(['gc_office_tasks']); } catch (e) {} }
/* a To-Do for the job's PM (once; reopened if it was closed and the reason is back) */
function todoFor(p, id, kind, label, note){
  if (!p || older(p)) return false;
  var l = tasksGet(), t = l.filter(function(x){ return x && x.id === id; })[0], now = nowIso();
  if (t && !t.done) return false;
  if (t) { t.done = false; t.reopenedAt = now; t.updatedAt = now; t.label = label; }
  else l.push({ id: id, kind: kind, pid: s(p.id), label: label, note: note || '', assignee: s(p.pm), forRole: s(p.pm) ? '' : 'office', addedBy: 'CRM', addedAt: now, updatedAt: now, done: false, prio: 'normal' });
  tasksPut(l); return true;
}
function todoClose(id, why){ var l = tasksGet(), t = l.filter(function(x){ return x && x.id === id && !x.done; })[0]; if (!t) return; t.done = true; t.doneAt = nowIso(); t.updatedAt = t.doneAt; t.resolution = why; tasksPut(l); }
function hasFinish(pid){ try { return !!(W._gcFinishPhoto && W._gcFinishPhoto.hasFinish(pid)); } catch (e) { return true; } }
function pctOf(p){ var v = parseFloat(p && (p.pct != null ? p.pct : p.ccProgressPct != null ? p.ccProgressPct : p.progress)); return isFinite(v) ? v : 0; }
function quiet(fn){ var a = W.alert; W.alert = function(m){ toast(s(m).replace(/\s*\n+\s*/g, ' ')); }; try { return fn(); } finally { W.alert = a; } }
function markComplete(pid){ if (typeof W._gcMarkJobCompleted !== 'function') return; quiet(function(){ W._gcMarkJobCompleted(pid, false); }); later(function(){ try { paintNotes(pid); } catch (e) {} }, 800); }
function photosAfter(pid){ try { if (W._gcPhotos && W._gcPhotos.open) W._gcPhotos.open(pid, { tag: 'After' }); } catch (e) { oops(e); } }
/* FINISHPHOTO calls this instead of its box: the 100 % stays; a note; a To-Do "Add finish photos to <job>" for the PM */
function finishNote(p){
  if (!p) return; var nm = s(p.name || p.client || 'this job');
  todoFor(p, 'FINISHPHOTO_' + p.id, 'finish_photos', '📷 Add finish photos to ' + nm, 'The job is at 100 % with no After photos yet — take or upload them in GrayCo Photos and tag them After.');
  toast('📷 No finish photos yet — add After photos (' + nm + ')', 'Add After photos', function(){ photosAfter(p.id); });
  try { paintNotes(p.id); } catch (e) {}
}
W._gcStageNote = { alert: function(m){ toast(s(m).replace(/\s*\n+\s*/g, ' ')); }, finish: finishNote, todo: todoFor, older: older };
/* the job page: small inline notes right above the tiles (no boxes) */
function notesHtml(p){
  var h = '', pct = pctOf(p), done = DONE.test(s(p.status));
  if (pct >= 100 && !done) h += '<div class="gcji-nt">🏁 <span>At 100 % — mark it complete?</span>' + (typeof W._gcMarkJobCompleted === 'function' && canEdit(p) ? '<button type="button" data-ji-n="complete">Mark complete?</button>' : '') + '</div>';
  if (pct >= 100 && !p.finishPhotoWaived && !hasFinish(p.id)) h += '<div class="gcji-nt">📷 <span>No finish photos yet — add After photos</span><button type="button" data-ji-n="photos">Add After photos</button></div>';
  return h;
}
function paintNotes(pid){
  var ov = D.getElementById('_gcJobDash'), p = proj(pid); if (!ov || !p) return;
  var body = ov.querySelector('.gcfp-body') || ov.children[1]; if (!body) return;
  var el = ov.querySelector('.gcji-notes'), h = notesHtml(p);
  if (!h) { if (el) el.remove(); return; }
  if (!el) { el = D.createElement('div'); el.className = 'gcji-notes'; el.setAttribute('role', 'status'); el.onclick = function(e){ var b = e.target.closest && e.target.closest('[data-ji-n]'); if (!b) return; e.stopPropagation(); var q = el.getAttribute('data-pid'); if (b.getAttribute('data-ji-n') === 'complete') markComplete(q); else photosAfter(q); }; }
  el.setAttribute('data-pid', s(p.id)); el.innerHTML = h;
  var top = body.querySelector(':scope>.gcfp-top');
  if (top) { body.insertBefore(el, top); try { el.style.order = getComputedStyle(top).order; } catch (e) {} } else body.insertBefore(el, body.firstChild);
}
/* the finish-photo To-Dos close by themselves once an After photo is on the job */
(W.__GC_NATIVE_SETINTERVAL__ || W.setInterval).call(W, function(){
  try { if (D.hidden) return; tasksGet().forEach(function(t){ if (t && !t.done && t.kind === 'finish_photos' && t.pid && hasFinish(t.pid)) todoClose(t.id, 'After photos added'); }); } catch (e) {}
}, 60000);

/* ── statuses (the desk's job editor: bidding · estimating · approved · active · on_hold · completed · lost) ── */
var STATUSES = [['bidding', 'Bidding'], ['estimating', 'Estimating'], ['approved', 'Approved / sold'], ['active', 'Active'], ['on_hold', 'On hold'], ['completed', 'Completed'], ['lost', 'Lost']];
var DONE = /complete|closed|lost|cancel|archiv|warrant|paid in full|dead|declined|void/i;
var ACTIVE = /^(active|in[ _-]?progress|started|underway|production|working)$/i;
function stLabel(v){ var k = low(v).replace(/\s+/g, '_'); var r = STATUSES.filter(function(x){ return x[0] === k; })[0]; return r ? r[1] : (s(v) || '—'); }
function write(pid, patch, why){
  if (typeof W._gcxPatchJob !== 'function') { toast('Not saved — reload the CRM and try again.'); return Promise.resolve(false); }
  STATS.saves++;
  return Promise.resolve(W._gcxPatchJob(pid, patch, why)).then(function(ok){ return !!ok; }, function(e){ oops(e); return false; });
}
function setStatus(pid, to, why, extra){
  var p = proj(pid); if (!p) return Promise.resolve(false);
  var from = s(p.status), patch = Object.assign({ status: to }, extra || {});
  if (low(from) !== low(to)) patch.statusHistory = arr(p.statusHistory).concat([{ from: from, to: to, at: nowIso(), by: myName(), via: 'GrayCo Field — ' + why }]).slice(-40);
  if (to === 'completed' && !s(p.completionDate)) patch.completionDate = today();
  return write(pid, patch, why);
}

/* ══ 1. progress means active ══ */
function afterPct(pid, val, st0, person){
  var n = parseFloat(val); if (!isFinite(n)) return; var pct = Math.max(0, Math.min(100, Math.round(n)));
  if (!person || !(pct > 0)) return;
  if (DONE.test(st0)) return;   /* never downgrade a completed / closed job */
  var after = function(){ try { paintNotes(pid); } catch (e) {} };
  if (ACTIVE.test(st0)) { if (pct >= 100) { toast('🏁 ' + s((proj(pid) || {}).name) + ' is at 100 % — mark it complete?', canEdit(proj(pid)) && typeof W._gcMarkJobCompleted === 'function' ? 'Mark complete?' : '', function(){ markComplete(pid); }); } after(); return; }
  later(function(){
    var p = proj(pid); if (!p || DONE.test(s(p.status)) || ACTIVE.test(s(p.status))) return;
    if (pctOf(p) < 1) return;   /* a start gate (Lead 01 / Asbestos 01) put the % back: the job is not started */
    var haz = []; try { haz = arr(W._gcHazGate && W._gcHazGate.missing(p)); } catch (e) {}
    if (haz.length) { toast('Not marked Active yet — the lead / asbestos / mold papers must be in the customer\'s hands first (📄 Documents).'); return; }
    setStatus(pid, 'active', 'progress ' + pct + '%', { pct: pct, _pctUpdatedAt: nowIso() }).then(function(ok){
      if (!ok) return; STATS.activated++;
      if (pct >= 100 && typeof W._gcMarkJobCompleted === 'function' && canEdit(proj(pid))) toast('✅ Job marked Active (progress ' + pct + '%) — at 100 %, mark it complete?', 'Mark complete?', function(){ markComplete(pid); });
      else toast('✅ Job marked Active (progress ' + pct + '%)');
      try { if (D.getElementById('_gcJobDash') && W._gcCurrentJob && s(W._gcCurrentJob.id) === s(pid)) paintCard(pid); } catch (e) {}
      after();
    });
  }, 1600);
}
function wrapPct(){
  var f = W._gcSetProjectPct; if (typeof f !== 'function' || f.__gcJI) return;
  var w = function(pid, val){
    var p = proj(pid), st0 = p ? s(p.status) : '', person = byPerson();
    var self = this, args = arguments, r = quiet(function(){ return f.apply(self, args); });   /* the draw / contract-missing alerts inside the save: notes */
    try { STATS.pct++; afterPct(pid, val, st0, person); } catch (e) { oops(e); }
    return r;
  };
  try { Object.keys(f).forEach(function(k){ if (!(k in w)) w[k] = f[k]; }); } catch (e) {}
  w.__gcJI = true; W._gcSetProjectPct = w;
}

/* ══ the customer the job links to ══ */
function custList(){ return arr(C().customers); }
function custOf(p){
  if (!p) return null; var L = custList(), id = s(p.customerId || p.clientId || p.custId);
  return (id && L.filter(function(c){ return s(c.id) === id; })[0]) || (s(p.client) && L.filter(function(c){ return low(c.name) === low(p.client); })[0]) || null;
}
function custView(p){
  var c = custOf(p) || {};
  return { c: custOf(p), name: s(p.client || p.customerName || p.customer || c.name), phone: s(p.clientPhone || p.customerPhone || p.phone || c.phone || c.mobile), email: s(p.clientEmail || p.customerEmail || p.email || c.email), address: s(c.address) };
}
function tel(v){ return s(v).replace(/[^0-9+]/g, ''); }
function nicePh(v){ var d = s(v).replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1); return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : s(v); }
function mailHref(v){ return 'mailto:' + encodeURIComponent(s(v)).replace(/%40/g, '@'); }

/* ══ 2. the job page ══ */
function cardHtml(p){
  /* one compact row (the tiles stay high): 👤 name · 📞 · ✉️ — the full customer info is in ✏️ Job info */
  var v = custView(p);
  if (!v.name && !v.phone && !v.email) return '<span class="gcji-cc-n">👤 <b>No customer yet</b> <span class="gcji-mut">— add one in ✏️ Job info</span></span>';
  return '<span class="gcji-cc-n">👤 <b>' + esc(v.name || 'Customer') + '</b></span>' +
    (v.phone ? '<a class="gcji-cc-call" href="tel:' + esc(tel(v.phone)) + '" aria-label="Call ' + esc(nicePh(v.phone)) + '">📞 Call</a>' : '') +
    (v.email ? '<a class="gcji-cc-mail" href="' + esc(mailHref(v.email)) + '" aria-label="E-mail ' + esc(v.email) + '">✉️</a>' : '');
}
function paintCard(pid){
  var ov = D.getElementById('_gcJobDash'), p = proj(pid); if (!ov || !p) return;
  var body = ov.querySelector('.gcfp-body') || ov.children[1]; if (!body) return;
  var el = ov.querySelector('.gcji-cc');
  if (!el) { el = D.createElement('div'); el.className = 'gcji-cc'; el.setAttribute('role', 'group'); el.setAttribute('aria-label', 'Customer'); }
  el.setAttribute('data-pid', s(p.id)); el.innerHTML = cardHtml(p);
  /* right above the tiles (the job page orders its parts with CSS order: the card takes the tiles' order) */
  var top = body.querySelector(':scope>.gcfp-top');
  if (top) { if (el.nextElementSibling !== top || el.parentNode !== body) body.insertBefore(el, top); try { el.style.order = getComputedStyle(top).order; } catch (e) {} }
  else if (body.firstChild !== el) body.insertBefore(el, body.firstChild);
}
/* every tile in one grid, all the time (owner 11/19); 📄 Documents right after the main tiles */
function allTiles(grid){
  if (!grid) return;
  Array.prototype.slice.call(grid.querySelectorAll('[data-fm-more]')).forEach(function(b){ b.remove(); });
  grid.classList.add('gcfm-open'); grid.setAttribute('data-ji-all', '1');
  Array.prototype.slice.call(grid.querySelectorAll('.gcfm-ov')).forEach(function(x){ x.classList.remove('gcfm-ov'); if (x.tagName === 'BUTTON') x.setAttribute('data-ji-rest', '1'); });   /* data-ji-rest: was under "More for this job" */
  /* owner 11/19: ✏️ Job info is button 1 (top-left); 📄 Documents right after the main tiles; one continuous grid (no group headings, no gaps) */
  var docs = grid.querySelector(':scope>[data-fn="docs"]'), head = grid.querySelector(':scope>.gcfm-k');
  if (docs && head && (head.compareDocumentPosition(docs) & 4)) grid.insertBefore(docs, head);
  Array.prototype.slice.call(grid.querySelectorAll(':scope>.gcfm-k')).forEach(function(h){ h.remove(); });
  var info = grid.querySelector(':scope>[data-fn="info"]');
  if (info) {
    if (info.children.length >= 2 && !info.getAttribute('data-ji')) { info.setAttribute('data-ji', '1'); info.children[0].textContent = '✏️'; info.children[1].textContent = 'Job info'; }
    if (grid.firstElementChild !== info) grid.insertBefore(info, grid.firstElementChild);
  }
}
function wrapGrid(){
  var M = W._gcFieldMore; if (!M || typeof M.jobGrid !== 'function' || M.jobGrid.__gcJI) return;
  var f = M.jobGrid, w = function(grid){ var r = f.apply(this, arguments); try { allTiles(grid); } catch (e) { oops(e); } return r; };
  w.__gcJI = true; M.jobGrid = w;
}
function decorateDash(pid){
  var ov = D.getElementById('_gcJobDash'); if (!ov) return;
  var p = proj(pid) || proj(ov.getAttribute('data-gcfp')); if (!p) return;
  css(); ov.classList.add('gcji-dash');
  try { allTiles(ov.querySelector('.gcfp-grid')); } catch (e) { oops(e); }
  try { paintCard(p.id); } catch (e) { oops(e); }
  try { paintNotes(p.id); } catch (e) { oops(e); }
}
function wrapDash(){
  var f = W._gcJobDashboard; if (typeof f !== 'function' || f.__gcJI) return;
  var w = function(jobId){ var r = f.apply(this, arguments); try { decorateDash(jobId); } catch (e) { oops(e); } return r; };
  try { Object.keys(f).forEach(function(k){ if (!(k in w)) w[k] = f[k]; }); } catch (e) {}
  w.__gcJI = true; W._gcJobDashboard = w;
}
/* a bottom-bar tab goes where it says: these pages close (PHONEUI keeps the bar tappable under them) */
D.addEventListener('click', function(e){ try { if (e.target && e.target.closest && e.target.closest('#gc-fh-tabs')) Array.prototype.forEach.call(D.querySelectorAll('.gcji-page'), function(o){ o.remove(); }); } catch (x) {} }, true);
/* the job page's 📅 Schedule & Inspections tile → the job's own schedule page */
D.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('#_gcJobDash [data-fp="sched"]') : null; if (!b) return;
  var pid = b.getAttribute('data-pid') || (W._gcCurrentJob && W._gcCurrentJob.id); if (!pid || !proj(pid)) return;
  e.preventDefault(); e.stopPropagation(); if (e.stopImmediatePropagation) e.stopImmediatePropagation();
