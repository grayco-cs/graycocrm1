<script id="gc-patch-gqlinks">
/* __GC_PATCH_GQLINKS__ ═══════════════════════════════════════════════════════
   GrayCo — 🔗 GOOGLE QUICK LINKS (patch GQLINKS, owner 11/19: "I want easy links to my LSA, AdWords, all the Google Ads things I
   need, so Malcolm can have quick easy access to them").
   · A strip at the top of 📣 Marketing (its home, and the 🔗 Marketing logins section): one tap opens, in a new tab,
       Local Services (LSA) dashboard · LSA leads · Google Ads · Keyword Planner · Business Profile · Analytics · Search Console ·
       Tag Manager · the Google review link (the one Marketing → Google already uses),
     each from the CRM's own stored link when there is one (🔗 Marketing logins: Search Console's grayco-cs.com property, the
     LSA leads page …; an admin's edit below wins), and the LSA customer ID (555-434-6278 — the number in Google's e-mails)
     as a label with 📋 Copy. Links and a label only: no password, key or sign-in is kept in the CRM.
   · Who: the Marketing Manager, admins and the office (by role; a PM's Marketing page does not show it).
     Admins: ✏ Edit links — change any link, add your own (Label | https://…), set the customer ID label; saved in the marketing
     settings (gc_mkt_v1 → cfg.main.quickLinks), so every computer shows the same list.
   · GrayCo Field: ☰ More → Office → 🔗 Google quick links (admins; the Marketing Manager has no Field app — his phone opens
     Marketing, where the strip is on top).
   Console: _gcGQL.links(), .cid(), .sheet(), .can()
   ═════════════════════════════════════════════════════════════════════════════ */
(function(W, D){
'use strict';
if (W.__GC_PATCH_GQLINKS__) return; W.__GC_PATCH_GQLINKS__ = true;
var ST = W.__GC_NATIVE_SETTIMEOUT__ || W.setTimeout;
function later(f, ms){ return ST.call(W, f, ms || 0); }
function s(v){ return v == null ? '' : String(v).trim(); }
function arr(v){ return Array.isArray(v) ? v : []; }
function esc(v){ return s(v).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function warn(e){ try { console.warn('[GC GQLINKS]', e && e.message || e); } catch (x) {} }
function X(){ return W._gcMktExt || null; }
function okUrl(u){ u = s(u); return /^https:\/\/[^\s\[\]<>"']+$/i.test(u) ? u : ''; }
var CID = '555-434-6278';
/* k → the stored 🔗 Marketing logins entry it prefers (patch MMTABS' window._gcMktLogins) */
var DEF = [
  { k: 'lsa', ic: '📍', l: 'LSA dashboard', url: 'https://ads.google.com/localservices/', d: 'Google Local Services Ads: budget, hours, service area, Google Guaranteed' },
  { k: 'lsaleads', ic: '📞', l: 'LSA leads', url: 'https://ads.google.com/localservices/leads', d: 'Every LSA call / message: listen, rate, dispute a junk lead', login: 'lsa' },
  { k: 'gads', ic: '🎯', l: 'Google Ads', url: 'https://ads.google.com/', d: 'Search ads: campaigns, budgets, keywords, conversions', login: 'gads' },
  { k: 'kwp', ic: '🔑', l: 'Keyword Planner', url: 'https://ads.google.com/aw/keywordplanner/home', d: 'Search volume and bids for new keywords' },
  { k: 'gbp', ic: '🏢', l: 'Business Profile', url: 'https://business.google.com/', d: 'The Google Maps listing: posts, photos, hours, review replies', login: 'gbp' },
  { k: 'ga', ic: '📊', l: 'Analytics', url: 'https://analytics.google.com/', d: 'Website visitors and where they came from', login: 'ga' },
  { k: 'gsc', ic: '🔎', l: 'Search Console', url: 'https://search.google.com/search-console', d: 'How grayco-cs.com shows in Google search', login: 'gsc' },
  { k: 'gtm', ic: '🏷', l: 'Tag Manager', url: 'https://tagmanager.google.com/', d: 'The website tags (Analytics, Ads conversions)' },
  { k: 'review', ic: '⭐', l: 'Review link', url: '', d: 'The short link to send customers for a Google review', login: 'review' }
];
function cfgQ(){ try { var c = X() && X().cfg ? X().cfg() : null; var q = c && c.quickLinks; return q && typeof q === 'object' ? q : {}; } catch (e) { return {}; } }
function stored(k){ var x = arr(W._gcMktLogins).filter(function(y){ return y && y.k === k; })[0]; return x ? okUrl(x.url) : ''; }
function reviewLink(){
  var x = X(), c = {}; try { c = x && x.cfg ? x.cfg() || {} : {}; } catch (e) {}
  var ls = ''; try { ls = localStorage.getItem('gc_google_review_url') || ''; } catch (e) {}
  return okUrl(c.reviewLink) || okUrl(W._GOOGLE_REVIEW_LINK) || okUrl(ls) || okUrl(x && x.B && x.B.reviewLink) || stored('review') || 'https://grayco-cs.com/review';
}
/* the list: an admin's link → the stored login → the default; then the admins' own extra links */
function links(){
  var q = cfgQ(), u = q.urls && typeof q.urls === 'object' ? q.urls : {};
  var out = DEF.map(function(d){
    var url = okUrl(u[d.k]) || (d.k === 'review' ? reviewLink() : (d.login && stored(d.login)) || d.url);
    return { k: d.k, ic: d.ic, l: d.l, url: url, d: d.d };
  });
  arr(q.extra).forEach(function(x, i){ var url = okUrl(x && x.url), l = s(x && x.l).slice(0, 40); if (url && l) out.push({ k: 'x' + i, ic: '🔗', l: l, url: url, d: '', extra: true }); });
  return out;
}
function cid(){ var v = s(cfgQ().cid); return /^\d{3}-\d{3}-\d{4}$/.test(v) ? v : CID; }   /* a redacted copy (the Marketing Manager's) falls back to the label */
function role(){ try { return X() && X().role ? X().role() : ''; } catch (e) { return ''; } }
function isMM(){ try { return typeof W._gcIsMM === 'function' && !!W._gcIsMM(); } catch (e) { return false; } }
function realAdmin(){ try { return !!(W.__GC_AUTH__ && W.__GC_AUTH__.isAdmin && W.__GC_AUTH__.isAdmin()); } catch (e) { return false; } }
/* the Marketing Manager, admins and the office (Marketing's own role: admin / office / marketing; a PM is 'pm') */
function can(){ if (isMM()) return true; var r = role(); return r === 'admin' || r === 'office' || r === 'marketing'; }
function canEdit(){ return !isMM() && realAdmin() && role() === 'admin'; }
function canField(){ return isMM() || (realAdmin() && role() === 'admin'); }   /* ☰ More in GrayCo Field: admins (+ marketing) */
var UI = { edit: false };

var css = D.createElement('style'); css.id = 'gc-gql-css';
css.textContent = '.gql{background:#fff;border:2px solid #1a73e8;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:#0f172a}' +
  '.gql-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;margin:0 0 10px}.gql-h b{font-size:16px;color:#174ea6}' +
  '.gql-cid{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#334155;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:999px;padding:4px 6px 4px 12px}.gql-cid code{font:700 14px ui-monospace,Menlo,Consolas,monospace;color:#0f172a;user-select:all}' +
  '.gql-cid button,.gql-ed{border:1px solid #cbd5e1;background:#fff;color:#174ea6;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer}' +
  '.gql-l{display:flex;flex-wrap:wrap;gap:8px}.gql-a{display:inline-flex;align-items:center;gap:6px;background:#1a73e8;color:#fff !important;text-decoration:none !important;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px;min-height:44px;box-sizing:border-box}' +
  '.gql-a:hover{background:#174ea6}.gql-a.x{background:#fff;color:#174ea6 !important;border:1px solid #1a73e8}.gql-n{color:#64748b;font-size:12px;margin:8px 0 0}' +
  '.gql-f{margin-top:10px;border-top:1px dashed #cbd5e1;padding-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.gql-f label{font-size:12px;font-weight:700;color:#475569;display:flex;flex-direction:column;gap:3px}' +
  '.gql-f input,.gql-f textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}.gql-fb{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}' +
  '.gql-fb button{border:none;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;background:#1a73e8;color:#fff}.gql-fb button.o{background:#fff;color:#174ea6;border:1px solid #cbd5e1}' +
  '#gc-gql-ov{position:fixed;inset:0;z-index:100250;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}#gc-gql-ov .gql{width:100%;max-width:620px;margin:0;border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}' +
  '@media(min-width:700px){#gc-gql-ov{align-items:center}#gc-gql-ov .gql{border-radius:16px}}';
(D.head || D.documentElement).appendChild(css);

function html(where){
  if (!can()) return '';
  var L = links(), ed = where === 'mkt' && canEdit();
  var h = '<!--gql--><div class="gql" data-gql="' + esc(where) + '"><div class="gql-h"><b>🔗 Google quick links</b>' +
    '<span class="gql-cid">LSA customer ID <code data-gql-cid>' + esc(cid()) + '</code><button type="button" data-gql-copy="' + esc(cid()) + '" title="Copy the customer ID">📋 Copy</button></span>' +
    (ed ? '<button type="button" class="gql-ed" data-gql-edit>' + (UI.edit ? 'Close editor' : '✏ Edit links') + '</button>' : '') +
    (where === 'sheet' ? '<button type="button" class="gql-ed" data-gql-x aria-label="Close">✕</button>' : '') + '</div>' +
    '<div class="gql-l">' + L.map(function(x){ return '<a class="gql-a' + (x.extra ? ' x' : '') + '" data-gql-k="' + esc(x.k) + '" href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(x.d || x.l) + '">' + esc(x.ic) + ' ' + esc(x.l) + ' ↗</a>'; }).join('') + '</div>' +
    '<div class="gql-n">Opens Google in a new tab — sign in with your own GrayCo Google account. Links only: no password is kept in the CRM.</div>';
  if (ed && UI.edit) {
    var q = cfgQ(), u = q.urls || {};
    h += '<div class="gql-f" data-gql-form>' + DEF.map(function(d){ var cur = L.filter(function(x){ return x.k === d.k; })[0] || {}; return '<label>' + esc(d.ic + ' ' + d.l) + '<input data-gql-u="' + esc(d.k) + '" value="' + esc(okUrl(u[d.k])) + '" placeholder="' + esc(cur.url) + '"></label>'; }).join('') +
      '<label>Customer ID label<input data-gql-cidin value="' + esc(cid()) + '" placeholder="555-434-6278"></label>' +
      '<label style="grid-column:1/-1">More links — one per line: Label | https://…<textarea data-gql-extra rows="3">' + esc(arr(q.extra).map(function(x){ return s(x.l) + ' | ' + s(x.url); }).join('\n')) + '</textarea></label>' +
      '<div class="gql-fb"><button type="button" data-gql-save>Save links</button><button type="button" class="o" data-gql-edit>Cancel</button><span class="gql-n" style="margin:0;align-self:center">Empty = the standard link. https:// only.</span></div></div>';
  }
  return h + '</div><!--/gql-->';
}
function strip(h){ return String(h || '').replace(/<!--gql-->[\s\S]*?<!--\/gql-->/g, ''); }
function copy(t){
  var x = X(); var p;
  try { p = x && x.copyText ? Promise.resolve(x.copyText(t)) : (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(new Error('no clipboard'))); } catch (e) { p = Promise.reject(e); }
  return p.then(function(){ toast('Copied ' + t); }, function(){ toast('Customer ID: ' + t); });
}
function toast(m){ try { var x = X(); if (x && x.toast && D.querySelector('.gmt')) { x.toast(m); return; } } catch (e) {} try { var t = D.createElement('div'); t.setAttribute('data-gc-keep', '1'); t.textContent = m; t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font:600 14px Inter,Arial,sans-serif;z-index:100400'; D.body.appendChild(t); later(function(){ t.remove(); }, 2600); } catch (e) {} }
function redraw(){ try { var x = X(); if (x && x.draw && x.UI && x.UI.root && x.UI.root.isConnected) { x.UI.editing = UI.edit; x.draw(); } } catch (e) { warn(e); } var ov = D.getElementById('gc-gql-ov'); if (ov) ov.innerHTML = html('sheet'); }
function save(box){
  if (!canEdit()) return;
  var urls = {}, bad = [];
  box.querySelectorAll('[data-gql-u]').forEach(function(i){ var v = s(i.value); if (!v) return; if (okUrl(v)) urls[i.getAttribute('data-gql-u')] = v; else bad.push(v); });
  var extra = [];
  s((box.querySelector('[data-gql-extra]') || {}).value).split(/\n+/).forEach(function(line){ if (!s(line)) return; var m = /^(.*?)\s*\|\s*(\S+)\s*$/.exec(line); if (m && s(m[1]) && okUrl(m[2])) extra.push({ l: s(m[1]).slice(0, 40), url: m[2] }); else bad.push(line); });
  var c = s((box.querySelector('[data-gql-cidin]') || {}).value);
  if (c && !/^\d{3}-\d{3}-\d{4}$/.test(c)) bad.push(c);
  if (bad.length) { toast('Not saved — check: ' + bad[0].slice(0, 60) + ' (https:// links; customer ID like 555-434-6278)'); return; }
  try { X().setCfg({ quickLinks: { urls: urls, extra: extra.slice(0, 20), cid: c || CID } }); } catch (e) { warn(e); toast('Not saved: ' + (e && e.message)); return; }
  UI.edit = false; redraw(); toast('Saved — every computer shows these links.');
}
/* clicks inside a strip (Marketing's own data-a handler never sees these: no data-a) */
D.addEventListener('click', function(ev){
  var t = ev.target && ev.target.closest && ev.target.closest('[data-gql-copy],[data-gql-edit],[data-gql-save],[data-gql-x]'); if (!t || !t.closest('.gql')) return;
  ev.preventDefault(); ev.stopPropagation();
  if (t.hasAttribute('data-gql-copy')) { copy(t.getAttribute('data-gql-copy')); return; }
  if (t.hasAttribute('data-gql-x')) { var ov = D.getElementById('gc-gql-ov'); if (ov) ov.remove(); return; }
  if (t.hasAttribute('data-gql-edit')) { if (!canEdit()) return; UI.edit = !UI.edit; redraw(); return; }
  if (t.hasAttribute('data-gql-save')) save(t.closest('.gql'));
}, true);
/* a stand-alone sheet (GrayCo Field ☰ More) */
function sheet(){
  if (!can()) { toast('Google quick links are for marketing and admins.'); return null; }
  var ov = D.getElementById('gc-gql-ov'); if (ov) ov.remove();
  ov = D.createElement('div'); ov.id = 'gc-gql-ov'; ov.setAttribute('data-gc-keep', '1'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Google quick links');
  ov.innerHTML = html('sheet');
  ov.addEventListener('click', function(ev){ if (ev.target === ov) ov.remove(); });
  D.body.appendChild(ov); return ov;
}
/* ── in 📣 Marketing: the top of its home and of 🔗 Marketing logins (re-wrapped if a later patch wraps them, so it stays on top) ── */
function wrapView(V, name){
  var f = V[name]; if (typeof f !== 'function' || f.__gql) return;
  var w = function(){ var h = f.apply(this, arguments); return html('mkt') + strip(h); };
  w.__gql = true; V[name] = w;
}
var tries = 0, done = false;
(function boot(){
  var x = X();
  if (x && x.VIEWS) {
    try { wrapView(x.VIEWS, 'home'); if (x.VIEWS.logins) wrapView(x.VIEWS, 'logins'); } catch (e) { warn(e); }
    if (!done && x.UI && x.UI.root && x.UI.root.isConnected && (x.UI.sec === 'home' || x.UI.sec === 'logins') && !x.UI.root.querySelector('.gql') && can()) { done = true; try { x.redrawSoon(); } catch (e) {} }
  }
  if (tries++ < 150) later(boot, 800);
})();
W._gcGQL = { links: links, cid: cid, sheet: sheet, can: can, canEdit: canEdit, canField: canField, html: html, defaults: function(){ return DEF.map(function(d){ return { k: d.k, l: d.l, url: d.url }; }); } };
try { console.log('[GC] patch GQLINKS: 🔗 Google quick links on Marketing (+ Field ☰ More) — _gcGQL.links()'); } catch (e) {}
})(window, document);
</script>
