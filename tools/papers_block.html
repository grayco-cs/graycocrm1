/* __GC_PATCH_PAPERS__ — 📑 PAPERS TO SEND: OLDER JOBS KEEP ONLY THE BASICS, PAPERS ARE SUGGESTED, PM FIRST (tools/patch_PAPERS.py).
   Owner 11/19 (his phone said "Needs you · 📑 285 papers to send", every one "OVERDUE"): "All these papers to send and approve but
   they're old, I don't want to have to enter all of that. Just the basics for the older jobs, let's take those off, and we don't HAVE
   to do all those documents anyway. If they are papers to send they go to PM first too, then office, then admin if no one sends the paper."
   Why 285: 📑 JOBDOCS gives every job its papers by job type (a job with no saved list gets them on the fly), and 🏛 EPAHUD showed an
   admin / the office every paper 2+ days past its date on every job — 480 jobs, most made before the papers existed.
   1. Older job = made (project.created, else createdAt) or started (startDate) before OLDER_BEFORE, or entered as history
      (importedHistory / dataEntry / an invoice-entry job). Such a job keeps only THE BASICS: the signed agreement (construction

      a paper named contract / agreement someone added) and, when the job has an invoice, an invoice / pay-app paper. Papers the code
      treats as REQUIRED (🔒 "Start job waits for it": Lead 01, Asbestos 01, the Environmental mold disclosure; a 🔒 hold an admin or
      the office put on a paper) and papers someone added to that one job (JOBREQ) stay too.
      Every other paper stays on the job's 📑 Paperwork, marked "Not needed (older job)" (nothing deleted, nothing written to the job),
      and is out of Needs you, the counts, the To-Dos and the escalation for everyone. An admin can turn them back on per job
      (↩ Turn them back on — project.jobDocs.olderOn, every switch kept in jobDocs.olderLog).

      their gate, with the admin's "Start anyway").

      Not sent ESC_OFFICE_BD business days after its date → also the office (office role); ESC_ADMIN_BD business days → also the admins.
      An older job's basics never go up to the admins. ⏸ Data-entry mode: nothing goes up to the admins at all.
   4. The To-Do (TD2), owner 11/19 ("crowding up my todo notifications, old jobs there are no todos marked"): every auto To-Do about an
      older job is off — papers, "Upload the signed contract", "No scope written", "Update progress", closeout, verify costs, invoice
      this job, PO, portal, no PM … — except a missing customer phone / e-mail on an OPEN older job, money owed (an overdue invoice),
      a decision waiting in Approvals, and anything a person wrote by hand. A finished / closed older job: none of them. Roll-ups
      ("51 finished jobs have no signed contract on file") count newer jobs only and are gone at 0.
      ✓ Not needed (row ⋯ menu, and for admins on the desk ☑ Select → per group "Select all" → ✓ Not needed) archives: a saved To-Do
      keeps its record (done, archived, notNeeded {by, at}); a generated one is marked in gc_todo_meta and never comes back.
      🗄 Show archived lists them, each with ↩ Restore. On the desk every To-Do group opens collapsed (counts on each header);
      open / closed is remembered for this page session only.
   Roles decide (admin / office / the job's PM), never names. Test date: window.__GC_PAPERS_TODAY__ = 'YYYY-MM-DD'.
   Console: _gcPapers.state()   API: window._gcPapers = { older(p), basic(p, x), dropped(p, x), itemState(p, x), fieldModel(), wanted(),
        tier(p, z), rowDue(z), head(M), closeWhy(t), turnOn(pid, on), OLDER_BEFORE, ESC_OFFICE_BD, ESC_ADMIN_BD } */
(function(W){
'use strict';
if (W.__GC_PATCH_PAPERS__) return; W.__GC_PATCH_PAPERS__ = true;
var D = W.document, ST = W.__GC_NATIVE_SETTIMEOUT__ || W.setTimeout;
/* ── the rule's numbers (one place) ── */
var OLDER_BEFORE = '2026-11-19';    /* go-live of this rule: a job made or started before this day is an older job */
var ESC_OFFICE_BD = 2;              /* business days after a paper's date, not sent → the office sees it too */
var ESC_ADMIN_BD = 5;               /* business days after a paper's date, not sent → the admins see it too (never in data-entry mode) */
/* the basics an older job keeps: the signed agreement (by the job type table's paper ids) … */
var BASIC_DOCS = { gcb_contract: 1, gcb_env_abatement_agreement: 1, gcb_mold_contract: 1, gcb_water_emergency_auth: 1, gcb_fire_work_auth: 1 };
var BASIC_RX = /\bcontract\b|\b(construction|services|remediation|work|customer|signed) agreement\b/i;
/* … and an invoice paper when the job has an invoice */
var INVOICE_DOCS = { gcb_pay_app: 1 }, INVOICE_RX = /\binvoice\b|application for payment|\bpay app/i;
var GONE = /lost|cancel|dead|archiv/i, FINISHED = /complete|closed|warrant|close.?out|paid in full/i;

function s(v){ return v == null ? '' : String(v).trim(); }
function low(v){ return s(v).toLowerCase(); }
function arr(v){ return Array.isArray(v) ? v.filter(function(x){ return x != null; }) : []; }

function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymdOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today(){ var t = s(W.__GC_PAPERS_TODAY__); return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : ymdOf(new Date()); }
/* a job's date: "2026-03-17", an ISO time, or epoch milliseconds (createdAt is sometimes a number) */
function day(v){

  if (typeof v === 'number' || /^\d{12,14}$/.test(s(v))) { var d = new Date(+v); return isNaN(d) ? '' : ymdOf(d); }
  var t = s(v); return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : '';
}
function addDays(d, n){ var t = Date.parse(d + 'T12:00:00Z'); return isNaN(t) ? '' : new Date(t + n * 864e5).toISOString().slice(0, 10); }

/* ── who is looking (roles, never names) ── */

function officeRole(){ if (admin()) return false; try { if (W._gcIsOfficeFull && W._gcIsOfficeFull()) return true; } catch (e) {} var u = user(); return /^office/i.test(s(u.role)) || /office/i.test(s(u.profile)); }
function myName(){ var u = user(); if (s(u.name)) return s(u.name); try { var e = low(W.__GC_AUTH__ && W.__GC_AUTH__.email && W.__GC_AUTH__.email()); var r = arr(W._crm && W._crm.users).find(function(z){ return z && low(z.email) === e; }); if (r) return s(r.name); } catch (e) {} return ''; }

  try { if (W._gcJobReq && W._gcJobReq.isPM) return !!W._gcJobReq.isPM(p); } catch (e) {}
  var n = low(myName()), e = ''; try { e = low(W.__GC_AUTH__.email()); } catch (x) {}

}
function paused(){ try { var st = W._gcPause && W._gcPause.state(); return !!(st && st.paused); } catch (e) { return false; } }
function projects(){ return arr(W._crm && W._crm.projects); }
function proj(pid){ return projects().find(function(p){ return p && s(p.id) === s(pid); }) || null; }
function invoices(){ var L = arr(W._crm && W._crm.invoices); return L.length ? L : arr(W._crm && W._crm.invs); }
function EH(){ return W._gcEpaHud || null; }
function JD(){ return W._gcJobDocs || null; }
function EP(){ return W._gcEpaHudCore || null; }

/* ── 1 · older job, the basics, the dropped papers ── */
function madeOn(p){ return day(p && p.created) || day(p && p.createdAt); }
function older(p){
  if (!p) return false;
  if (p.importedHistory || p.dataEntry || s(p.createdVia) === 'invoice-entry') return true;
  var m = madeOn(p), st = day(p.startDate);
  return !!((m && m < OLDER_BEFORE) || (st && st < OLDER_BEFORE));
}
function turnedOn(p){ return !!obj(obj(p && p.jobDocs).olderOn).on; }
function hasInvoice(p){ var id = s(p && p.id); return !!id && invoices().some(function(iv){ return iv && !iv.deleted && !iv.void && s(iv.pid || iv.projectId || iv.jobId) === id; }); }
function required(x){ return !!(x && (x.gate || x.hold)); }
function basic(p, x){
  if (!x) return false;
  var lab = s(x.label);
  if (BASIC_DOCS[s(x.doc)] || BASIC_RX.test(lab)) return true;
  if ((INVOICE_DOCS[s(x.doc)] || INVOICE_RX.test(lab)) && hasInvoice(p)) return true;
  return false;
}
/* the paper is on an older job and is not one it keeps */
function dropped(p, x){ return !!(x && older(p) && !turnedOn(p) && !basic(p, x) && !required(x) && !x.xr); }
function itemState(p, x){ return dropped(p, x) ? { done: true, na: true, older: true, txt: 'Not needed (older job)' } : null; }

/* ── 2 · routing: the PM first, then the office, then the admins ── */
function live(p){ return !!p && !p.deleted && !p.archived && !GONE.test(s(p.status)) && !(older(p) && FINISHED.test(s(p.status))); }
function legacy(p){ return older(p) && !turnedOn(p); }
/* 0 = the PM only · 1 = + the office · 2 = + the admins */
function tier(p, z){
  var d = day(z && z.d && z.d.date); if (!d) return 0;
  var n = bdAfter(d, today());

}
function toSend(p){ try { return EH() && EH().toSend ? arr(EH().toSend(p)) : []; } catch (e) { return []; } }

  var out = [], adm = admin(), off = officeRole();

    if (!live(p)) return;
    var mine = isPM(p);
    if (!mine && !adm && !off) return;
    toSend(p).forEach(function(z){
      var t = tier(p, z);
      if (mine) out.push({ p: p, x: z.x, d: z.d, t: t });
      else if (adm && t >= 2) out.push({ p: p, x: z.x, d: z.d, t: t, esc: 'admin' });
      else if (off && t >= 1) out.push({ p: p, x: z.x, d: z.d, t: t, esc: 'office' });
    });
  });
  var held = function(z){ return required(z.x) ? 0 : 1; };
  return out.map(function(z, i){ z.__i = i; return z; }).sort(function(a, b){ var da = a.d.date || '9999', db = b.d.date || '9999'; return da < db ? -1 : da > db ? 1 : (held(a) - held(b)) || (a.__i - b.__i); });
}
/* the To-Dos (EPAHUD's sweep): the job's PM when the date is near or past; the office when it is ESC_OFFICE_BD business days past */

    if (!off && !isPM(p)) return;

      var d = day(z.d && z.d.date); if (!d) return;
      var n = Math.round((Date.parse(d + 'T12:00:00Z') - Date.parse(t0 + 'T12:00:00Z')) / 864e5);
      if (n > 3) return;

      var when = (req ? 'required by ' : 'suggested by ') + nice(d) + (past ? ' — not sent yet' : '');
      want['EPAHUD_' + p.id + '_' + z.x.k] = { p: p, assignee: s(p.pm) || 'Office', prio: past && req ? 'high' : 'med', label: '📑 ' + job + ': ' + lab + ' — ' + when, note: s(z.x.label) + '\n' + s(z.d.txt) + (z.d.cite ? ' (' + z.d.cite + ')' : '') + '\n' + (req ? 'Required — the job waits for it.' : 'Suggested — send it if it fits this job, or mark it N/A.') + '\nJob → 📑 Paperwork → 📤 Send… (or GrayCo Field → Needs you).' };
      var tr = tier(p, z);
      if (tr >= 1) want['EPAHUD_ESC_' + p.id + '_' + z.x.k] = { p: p, assignee: 'Office', prio: req ? 'high' : 'med', label: '📑 ' + job + ': ' + lab + ' — not sent ' + bdAfter(d, t0) + ' business days after ' + nice(d) + ' — PM ' + (s(p.pm) || 'not set') + (tr >= 2 ? ' (office + admins)' : ' (office)'), note: s(z.x.label) + '\nSuggested by ' + nice(d) + ' — ' + s(z.d.txt) + (z.d.cite ? ' (' + z.d.cite + ')' : '') + '. The PM has it first; not sent ' + ESC_OFFICE_BD + '+ business days → the office' + (legacy(p) ? ' (an older job: it does not go up to the admins).' : paused() ? ' (⏸ data-entry mode: it does not go up to the admins).' : '; ' + ESC_ADMIN_BD + '+ → the admins.') };
    });

}
/* why EPAHUD's sweep closes a To-Do it no longer wants (the To-Do is kept, ticked, with this reason) */
function closeWhy(t){
  var m = /^EPAHUD_(?:ESC_)?(.+)$/.exec(s(t && t.id)); var p = proj(t && t.pid); if (!m || !p) return '';
  var k = m[1].slice(s(p.id).length + 1), x = null;
  try { x = (arr(obj(p.jobDocs).items).length ? arr(p.jobDocs.items) : arr(JD().want(p).items)).find(function(y){ return y && y.k === k; }) || null; } catch (e) {}
  if (x && dropped(p, x)) return 'not needed (older job) — only the basics are suggested on jobs from before ' + nice(OLDER_BEFORE) + '/' + OLDER_BEFORE.slice(0, 4);
  if (!live(p)) return 'the job is finished / closed';
  if (x && toSend(p).some(function(z){ return z.x && z.x.k === k; })) return 'not escalated — the PM has it first (papers rule ' + nice(OLDER_BEFORE) + ')';

}

/* ── 3 · the words: suggested, never a red OVERDUE ── */
function rowDue(z){
  var d = day(z.d && z.d.date), req = required(z.x), past = d && d < today();
  var txt = d ? (req ? 'Required by ' : 'Suggested by ') + nice(d) + (past ? ' — not sent yet' : '') : (req ? 'Required ' : 'Suggested ') + s(z.d && z.d.txt);
  var tag = z.esc === 'admin' ? ' · not sent ' + ESC_ADMIN_BD + '+ business days — admins' : z.esc === 'office' ? ' · not sent ' + ESC_OFFICE_BD + '+ business days — office' : '';
  return '<span style="display:block;font-size:12.5px;color:' + (past ? '#92400e' : '#475569') + '" data-pp-due="' + esc(d) + '">' + esc(txt) + esc(tag) + '</span>';
}
function head(M){ return 'Needs you · 📑 ' + M.length + ' paper' + (M.length === 1 ? '' : 's') + ' to send (suggested)'; }
function dueHtml0(p, x){
  var H = EH(); if (!H || !H.dueOf) return '';
  var d = H.dueOf(p, x), cite = d.cite ? ' <span class="tag">(' + esc(d.cite) + ')</span>' : '', req = required(x), dd = day(d.date), past = dd && dd < today();
  if (dd) return '<span class="' + (past && req ? 'bad' : 'due') + '" data-ep-due="' + esc(dd) + '"' + (past ? ' data-pp-past="1"' : '') + '>' + (req ? 'Required by ' : 'Suggested by ') + esc(nice(dd)) + (past ? ' — not sent yet' : '') + ' · ' + esc(d.txt) + (d.basis ? ' (' + esc(d.basis) + ')' : '') + '</span>' + cite;
  return '<span class="due">' + (req ? 'Required ' : 'Suggested ') + esc(d.txt) + (d.wait ? ' — set ' + esc(d.wait) + ' in 🏛 facts' : '') + '</span>' + cite;
}
function olderBar(p){
  if (!p || !older(p)) return '';

  var on = turnedOn(p), n = items.filter(function(x){ return x && !x.stale && !basic(p, x) && !required(x) && !x.xr; }).length, O = obj(obj(p.jobDocs).olderOn);
  var why = 'made ' + (nice(madeOn(p)) ? nice(madeOn(p)) + '/' + madeOn(p).slice(0, 4) : '—') + (day(p.startDate) ? ' · started ' + nice(p.startDate) + '/' + day(p.startDate).slice(0, 4) : '');
  var h = '<div class="m" data-pp-older="' + (on ? 'on' : 'off') + '" style="margin:6px 0;padding:6px 8px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;color:#334155">🗂 <b>Older job</b> (' + esc(why) + ') — ';
  if (!on) h += 'only the basics are suggested (the signed agreement' + (hasInvoice(p) ? ', the invoice' : '') + '). ' + n + ' other paper' + (n === 1 ? ' is' : 's are') + ' marked "Not needed (older job)" — kept here, nothing deleted.' + (admin() && n ? ' <button type="button" data-pp="on" style="min-height:28px;padding:2px 8px">↩ Turn them back on for this job</button>' : '');
  else h += 'all its papers were turned back on' + (s(O.by) ? ' by ' + esc(O.by) : '') + (s(O.at) ? ' ' + esc(nice(day(O.at))) : '') + '.' + (admin() ? ' <button type="button" data-pp="off" style="min-height:28px;padding:2px 8px">Only the basics again</button>' : '');
  return h + '</div>';
}
function cardTop0(p, html){
  var h = s(html).replace(/<b class="bad">📑/, '<b>📑').replace(/(📑 \d+ papers? to send)<\/b>/, '$1 (suggested)</b>').replace(/ · <b class="bad">(\d+) overdue<\/b>/, ' · <b style="color:#92400e">$1 past the suggested date</b>');
  return olderBar(p) + h;
}
/* an admin turns the dropped papers of one older job back on (or off again) — logged on the job, never removed */
function turnOn(pid, on){
  if (!admin()) return false;
  var J = JD(); if (!J || !J.patchJD || !proj(pid)) return false;
  var rec = { on: !!on, by: myName() || 'admin', at: new Date().toISOString() };
  J.patchJD(pid, function(X){ X.olderOn = rec; X.olderLog = arr(X.olderLog).concat([{ act: on ? 'turned back on' : 'only the basics', by: rec.by, at: rec.at }]); return X; });
  ST.call(W, function(){ try { J.paint(); } catch (e) {} try { if (W._gcJobReq && W._gcJobReq.fieldPaint) W._gcJobReq.fieldPaint(true); } catch (e) {} try { if (EH() && EH().fieldPaint) EH().fieldPaint(); } catch (e) {} }, 120);
  return true;
}
D.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('[data-pp]') : null; if (!b) return;

/* ── 4 · the To-Do (TD2): an older job's auto To-Dos are off ── */
var AUTO_KINDS = /^(epahud|jobdocs_env|job_done|job_contact|sub_confirm|scope_review|paid_before|lsa_check|qb_home|no_pm|datacheck|closeout|progress)$/;

  if (t.kind === 'quick' || t.kind === 'mention' || t.self || t.kind === 'admin_seed') return false;   /* a person wrote it */
  if (AUTO_KINDS.test(s(t.kind)) || t._noContract || t.auto) return true;
  if (/^(portal_|EPAHUD_|JOBDOCS_|SUPPLIERBILLS_|AUTOCHECKS_|JOBCONTACT|JOBDONE)/i.test(s(t.id))) return true;
  return /^(crm|system|grayco crm|setup|admin \(setup\)|auto\b.*)$/i.test(s(t.addedBy));
}
var THING_PID = /^(contract|bill|scope|po|info|prop|final|portal-link|portal-docs|nopm|draft|progress|closeout|verify)\|([^|]+)/;
function pidOf(r){ if (s(r.pid)) return s(r.pid); var m = THING_PID.exec(s(r.thing)); if (m) return m[2]; return s(r.rec && r.rec.pid); }
function contactItem(r){ var t = s(r.title) + ' ' + s(r.sub); return /^info\|/.test(s(r.thing)) && /phone|e-?mail|contact/i.test(t) || /no customer (phone|e-?mail)|missing (customer )?(phone|e-?mail)/i.test(t); }
