<script id="gc-patch-schedhist">
/* __GC_PATCH_SCHEDHIST__ ═════════════════════════════════════════════════════

    var x = B[id], o = A[id];
    if (!o) { if (keep(x) && x.deleted !== true) put('added', x, null, []); return; }
    if (!keep(x) && !keep(o)) return;
    if (x.deleted === true && o.deleted !== true) { put('removed', o, o, []); return; }
    if (sig(x) === sig(o)) return;
    var ch = F.filter(function(f){ return f !== 'deleted' && s(x[f]) !== s(o[f]); }).map(function(f){ return { f: f }; });
    if (ch.length) put('changed', x, o, ch);
  });
  Object.keys(A).forEach(function(id){ if (!B[id] && keep(A[id]) && A[id].deleted !== true) put('removed', A[id], A[id], []); });
  Object.keys(groups).forEach(function(g){
    var G = groups[g], x = G.rows[0], o = G.olds[0], title = s(x.title) || s(o.title) || 'Task', who = s(x.vendor) || s(x.assignee), changes = [];
    var t, n = G.rows.length;
    if (G.kind === 'added') { t = 'Added “' + title + '”' + (who ? ' (' + who + ')' : '') + ' · ' + range(G.rows, 'date') + (n > 1 ? ' (' + n + ' days)' : '') + (x.time ? ' · ' + s(x.time) + (x.endTime ? '–' + s(x.endTime) : '') : ''); changes = [{ f: 'date', from: '', to: range(G.rows, 'date') }]; }
    else if (G.kind === 'removed') { t = 'Removed “' + title + '”' + (who ? ' (' + who + ')' : '') + ' · was ' + range(G.rows, 'date'); changes = [{ f: 'date', from: range(G.rows, 'date'), to: '' }]; }

      t = (G.fields.length === 1 && G.fields[0] === 'date' ? 'Moved “' : 'Changed “') + s(o.title || title) + '”: ' + changes.map(function(c){ return FN[c.f] + ' ' + c.from + ' → ' + c.to; }).join('; ');
    }
    var how = 'manual';
    if (G.kind === 'added' && G.rows.every(function(r){ return r.source === 'voice'; })) how = 'voice';
    else if (G.kind === 'changed' && /^🎤/.test(s(x.moveNote)) && s(x.moveNote) !== s(o.moveNote || '')) how = 'voice';
    else if (G.kind === 'changed' && /^follows/.test(s(x.movedBy))) how = 'auto';
    var local = G.rows.concat(G.olds).some(function(r){ return LOCAL[r.id] && Date.now() - LOCAL[r.id] < 15000; }) || Date.now() - lastInput < 15000;   /* written here, or the person is using this computer right now */

      by: local ? myName() : (s(x.movedBy && !/^follows/.test(x.movedBy) ? x.movedBy : '') || s(x.updatedBy) || (G.kind === 'added' ? s(x.by) : '') || 'another computer'), byEmail: local ? myEmail() : '',
      title: title, rowIds: ids.slice(0, 60), changes: changes, text: t, tplRows: G.rows.filter(function(r){ return r.tpl && r.tplTask; }).map(function(r){ return { id: r.id, tplTask: r.tplTask, date: s(r.date), end: s(r.endDate), title: s(r.title) }; }) });

/* the customer portal's plan steps (p.schedPlan) follow a templated row's new dates */

  if (!need.length) return;

    var pl = Object.assign({}, q.schedPlan, { at: nowIso(), steps: arr(q.schedPlan.steps).map(function(st){ var r = need.filter(function(x){ return x.tplTask === st.id; })[0]; return r ? Object.assign({}, st, { date: r.date, end: r.end || st.end }) : st; }) });
    return Object.assign({}, q, { schedPlan: pl, updatedAt: nowIso() }); }); });
}

  if (!items.length) return Promise.resolve();

  busy = true;
  return kvGet(KEY).then(function(v){ return arr(v); }, function(){ return null; }).then(function(remote){
    var by = {}, order = [];
    (remote || []).concat(arr(lsGet(KEY))).forEach(function(m){ if (!m || !m.id || by[m.id]) return; by[m.id] = m; order.push(m.id); });
    var added = 0; items.forEach(function(m){ if (by[m.id]) return; by[m.id] = clean(m); order.push(m.id); added++; });
    var merged = order.map(function(k){ return by[k]; }).sort(function(a, b){ return s(a.at) < s(b.at) ? -1 : 1; }).slice(-MAXN);

    var c = creds();
    return W.fetch(c.u + '/rest/v1/gc_kv?on_conflict=key', { method: 'POST', headers: sbHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify({ key: KEY, value: JSON.stringify(merged), updated_at: nowIso() }) })
      .then(function(r){ if (r.ok) H.wrote++; }, function(){});
  }).then(function(){ busy = false; paint(true); }, function(){ busy = false; });
}
/* the live list, looked at through the setter (returns it unchanged — React keeps the same state, nothing redraws);
   _crm.schedule follows the CRM's state only a while later */
var LIVE = null, LASTLIST = null, SAME = 0;

function peek(){ try { if (typeof W._setSchedule === 'function') W._setSchedule(function(prev){ if (Array.isArray(prev)) LIVE = prev; return prev; }); } catch (e) {} }
function tick(){
  try {
    wrap();
    peek(); var list = LIVE || crm().schedule; if (!Array.isArray(list)) return;
    if (!SNAP) { if (!seenAt) seenAt = Date.now(); if (Date.now() - seenAt < 12000 || !arr(crm().projects).length) return; SNAP = snap(list); LASTLIST = list; return; }
    if (list === LASTLIST && ++SAME % 8) { flushLater(); paint(false); return; }   /* the same list as last time: nothing changed */
    LASTLIST = list;
    var cur = snap(list), out = diff(SNAP, cur); SNAP = cur;
    if (out.length && out.length <= 150) {

/* ── the job's Schedule tab: 🕘 Schedule change history ── */

  if (pid) { try { head = D.evaluate("//main//div[normalize-space(text())='+ Add Schedule Phase / Task']", D, null, 9, null).singleNodeValue; } catch (e) {} }

  el.style.cssText = 'margin-top:14px;border:1px solid rgba(148,163,184,.35);border-radius:10px;padding:10px 12px;font-size:12.5px';
