<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrayCo RoofScout</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Sign in: the same GrayCo sign-in as the CRM -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-head"><div class="logo logo-white" role="img" aria-label="GrayCo Construction Services"></div></div>
      <h1>RoofScout</h1>
      <p class="muted">Sign in with your GrayCo CRM email and password.</p>
      <label>Email <input type="email" id="login-email" autocomplete="username" required></label>
      <label>Password <input type="password" id="login-pass" autocomplete="current-password" required></label>
      <div id="login-err" class="err" role="alert" hidden></div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="fine">Forgot your password? Ask Wesley or Nick (CRM: 💎 → Team access → Reset password).</p>
      <p class="fine">For GrayCo staff only.</p>
      <div class="login-alt demo-only"><button type="button" id="demo-btn" class="btn ghost">Practice in demo mode</button>
        <p class="fine">Demo mode needs no sign-in. It saves only in this browser and is not shared.</p></div>
    </form>
  </div>

  <!-- Loading / can't load -->
  <div id="loading" class="login" hidden>
    <div class="login-card loading-card">
      <div class="login-head"><div class="logo logo-white" role="img" aria-label="GrayCo Construction Services"></div></div>
      <p id="loading-msg" role="status">Loading…</p>
      <div id="loading-actions" class="btn-row" hidden>
        <button type="button" id="retry-btn" class="btn primary">Try again</button>
        <button type="button" id="loading-demo-btn" class="btn ghost demo-only">Demo mode</button>
        <button type="button" id="loading-signout-btn" class="btn ghost">Sign out</button>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="logo logo-white brand" role="img" aria-label="GrayCo Construction Services"></div>
      <span class="app-name">RoofScout</span>
      <nav id="tabs" class="tabs" aria-label="Sections">
        <button data-tab="map">Map</button>
        <button data-tab="leads">Leads</button>
        <button data-tab="calls">Calls</button>
        <button data-tab="pipeline">Pipeline</button>
        <button data-tab="activity">Activity</button>
        <button data-tab="settings">Settings</button>
        <button data-tab="build">Build</button>
      </nav>
      <div class="me"><span id="pending" class="pending" hidden></span><span id="me-name"></span><button id="logout" class="btn ghost sm">Sign out</button></div>
    </header>
    <div id="mode-bar" class="demo-bar"></div>
    <main id="view"></main>
  </div>

  <!-- Lead detail -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="print-root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/util.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/scan.js"></script>
  <script src="js/imagery.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/data.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
