<!doctype html>
<html lang="en"><head>
<script src="/gc-address.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GrayCo Monthly Giveaway</title>
<link rel="stylesheet" href="mkt-pages.css">
</head><body>
<header class="gp-head"><img src="img/grayco-logo-white.png" alt="GrayCo Construction Services"><div><b>GrayCo Construction Services</b><span>Licensed general contractor · TN · MS · AR · Bartlett, TN</span></div></header>
<div class="gp-gold"></div>
<main class="gp-main" id="app"><p class="gp-muted">Loading…</p></main>
<footer class="gp-foot">GrayCo Construction Services · <span data-gc-addr>5796 Ferguson Rd, Bartlett, TN 38134</span> · <a href="tel:+19015850944">(901) 585-0944</a></footer>
<script>
/* GrayCo monthly giveaway (patch MKT2): one entry per person per month; joining GrayCo News is an optional, unchecked box (patch LEGAL3).
   The official rules are below the form; the CRM's Marketing → 🎁 Giveaway sets the prize and the rules each month. */
(function(){
  var API = '/.netlify/functions/mkt-public', app = document.getElementById('app'), gc = '';
  try { var u = new URLSearchParams(location.search); gc = u.get('gc') || u.get('utm_source') || ''; } catch (e) {}
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var ADDR = window._gcCompanyAddress ? window._gcCompanyAddress() : '5796 Ferguson Rd, Bartlett, TN 38134';
  /* patch LEGAL3: the full Official Rules (default text). [START DATE] [END DATE] [DRAW DATE] [PRIZE] [PRIZE VALUE] are filled from the CRM's Marketing → Giveaway fields. */
  var RULES = 'NO PURCHASE OR PAYMENT OF ANY KIND IS NECESSARY TO ENTER OR WIN. A PURCHASE WILL NOT IMPROVE YOUR CHANCES OF WINNING. Void where prohibited.\n\n1. Sponsor. The GrayCo Monthly Giveaway (the "Giveaway") is sponsored by GrayCo Construction Services, LLC, ' + ADDR + ', (901) 585-0944 ("Sponsor"). It is not sponsored, endorsed or administered by, or associated with, Facebook, Instagram, Google or any other social network.\n\n2. Eligibility. Open only to individuals who are (a) legal residents of Tennessee, Mississippi or Arkansas, and (b) 18 years of age or older at the time of entry. Employees, owners, officers, subcontractors and sales representatives of Sponsor, and members of their immediate families or households, are not eligible. Void where prohibited by law. By entering you confirm that you meet these requirements.\n\n3. Entry Period. The entry period begins at 12:00 a.m. Central Time on [START DATE] and ends at 11:59 p.m. Central Time on [END DATE] (the "Entry Period").\n\n4. How to Enter. (a) Online (free). Go to the GrayCo giveaway entry page (the link on grayco-cs.com or in GrayCo\'s posts), complete the entry form (name, e-mail, ZIP code; phone is optional), tick the box confirming you are 18 or older, live in TN, MS or AR and agree to these rules, and submit. (b) By mail, without using the website (free). Print your name, address (with ZIP code), phone and e-mail on a plain 3.5 x 5 inch card, and mail it in a stamped envelope to: GrayCo Giveaway, ' + ADDR + '. It must be postmarked within the Entry Period and received within 7 days after it ends. (c) Limit: one entry per person per month, by any method. Duplicate entries, and entries made by scripts, bots or entry services, are void. Entries must be made by the entrant personally. (d) Optional boxes on the entry form (joining GrayCo News by e-mail, following GrayCo on Facebook) are unchecked, separate from entry, and do not change your chances of winning. Entry never requires liking, sharing, tagging or following any account.\n\n5. Prize and Value. One (1) prize: [PRIZE]. Approximate retail value: [PRIZE VALUE]. The prize has no cash value, may not be exchanged, transferred or redeemed for cash, and must be used within 90 days of notification at an address in Sponsor\'s service area. If it cannot be awarded as described, Sponsor may substitute a prize of equal or greater value. The winner is responsible for all taxes and any other costs not stated here.\n\n6. Odds. Odds of winning depend on the number of eligible entries received in the Entry Period.\n\n7. Winner Selection and Notification. The winner will be selected by a random drawing from all eligible entries received, within seven (7) days after the Entry Period ends (about [DRAW DATE]). The drawing is done in Sponsor\'s system and logged (who, when and a random seed) so it can be re-checked. The winner will be notified by e-mail at the address on the entry. The winner must reply within fourteen (14) days and sign and return an Affidavit of Eligibility and Liability / Publicity Release. If a winner does not reply in time, cannot be reached, is not eligible, or does not return the signed affidavit, the prize is forfeited and an alternate winner may be drawn.\n\n8. Publicity. Except where prohibited, by accepting the prize the winner permits Sponsor to use the winner\'s name, city and state, voice, photograph and statements about the prize for advertising and promotion in any media, without notice, approval or compensation.\n\n9. Privacy. Sponsor will use the information you provide to run the Giveaway, to tell the winner, and, if you tick the optional box, to send GrayCo News (you can unsubscribe at any time). Entering does not sign you up for marketing text messages. See the GrayCo Privacy Policy at grayco-cs.com.\n\n10. General Conditions. Sponsor may disqualify anyone who tampers with the entry process or breaks these rules, and may cancel, change or suspend the Giveaway if fraud, technical failure or any other cause beyond its control affects fairness or security. Sponsor is not responsible for late, lost, misdirected or incomplete entries, or for any technical failure. To the fullest extent the law allows, entrants release Sponsor and its owners, employees and agents from claims arising from the Giveaway or the prize. Nothing in these rules limits liability that cannot be limited by law.\n\n11. Governing Law and Disputes. These rules and the Giveaway are governed by Tennessee law, without regard to conflict-of-law rules. Disputes will be resolved in the state or federal courts for Shelby County, Tennessee, except where the law of your state of residence requires otherwise.\n\n12. Winner List and Rules. For the winner\'s first name and city, or a copy of these rules, send a stamped, self-addressed envelope to the Sponsor address above within 60 days after the draw.';
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function dlong(ymd, plus){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || ''); if (!m) return ''; var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + (plus || 0))); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); }
  function fillRules(t, g){
    var val = String(g.prizeValue || '').trim(); if (/^\d/.test(val)) val = '$' + val;
    t = String(t);
    if (!val) t = t.replace(/ Approximate retail value: \[PRIZE VALUE\]\./g, '');
    return t.replace(/\[START DATE\]/g, dlong(g.startDate) || 'the first day of the month').replace(/\[END DATE\]/g, dlong(g.endDate) || 'the last day of the month')
      .replace(/\[DRAW DATE\]/g, dlong(g.endDate, 7) || 'seven days after the Entry Period ends').replace(/\[PRIZE VALUE\]/g, val).replace(/\[PRIZE\]/g, g.prize || 'the prize shown above');
  }
  fetch(API + '?giveaway=1').then(function(r){ return r.json(); }).then(function(g){
    var saved = (g && g.rules) || ''; if (/\[ELIGIBILITY\]|\[DATES\]/.test(saved)) saved = '';   /* rules saved with the old placeholders use the new default text */
    var rules = fillRules(saved || RULES, g || {});
    if (!g || !g.open) { app.innerHTML = '<div class="gp-card"><h2>The giveaway is closed this month</h2><p>Check back next month — or call us at <a href="tel:+19015850944">(901) 585-0944</a>.</p></div>'; return; }
    app.innerHTML = '<div class="gp-card gp-hero"><h1>Win ' + esc(g.prize) + '</h1><p>The GrayCo ' + esc(g.monthName) + ' giveaway. One entry per person — we draw a winner at the end of the month.</p></div>' +
      '<div class="gp-card"><h2>Enter now</h2><label>Your name</label><input id="f-name" autocomplete="name"><label>E-mail</label><input id="f-email" type="email" autocomplete="email"><label>Phone (optional)</label><input id="f-phone" type="tel" autocomplete="tel"><label>ZIP code</label><input id="f-zip" inputmode="numeric" maxlength="5">' +
      '<label class="gp-check"><input type="checkbox" id="f-agree"> <span>I am 18 or older, I live in Tennessee, Mississippi or Arkansas, and I agree to the official rules below.</span></label>' +
      '<label class="gp-check"><input type="checkbox" id="f-news"> <span>Optional: join GrayCo News by e-mail (tips + next month\'s giveaway) — unsubscribe any time. Not needed to enter.</span></label>' +
      '<label class="gp-check"><input type="checkbox" id="f-fb"> <span>Optional: follow GrayCo on Facebook (opens Facebook — not needed to enter).</span></label>' +
      '<input id="hp" class="gp-hp" tabindex="-1" autocomplete="off"><button id="go" class="gp-btn">Enter the giveaway</button><p id="out"></p></div>' +
      '<div class="gp-card gp-rules" id="rules"><b>Official rules</b>' + String(rules).split(/\n\s*\n/).map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
    document.getElementById('f-fb').onchange = function(){ if (this.checked) window.open('https://www.facebook.com/search/top?q=GrayCo%20Construction%20Services', '_blank', 'noopener'); };
    document.getElementById('go').onclick = function(){
      var b = this, v = function(k){ return document.getElementById(k).value; }, out = document.getElementById('out'); b.disabled = true;
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'giveaway_enter', name: v('f-name'), email: v('f-email'), phone: v('f-phone'), zip: v('f-zip'), agree: document.getElementById('f-agree').checked, newsletter: document.getElementById('f-news').checked, gc: gc, website: v('hp') }) })
        .then(function(r){ return r.json(); }).then(function(j){ b.disabled = false; out.innerHTML = j.ok ? '<div class="gp-ok">' + esc(j.message) + '</div>' : '<span class="gp-err">' + esc(j.error || 'Not entered.') + '</span>'; if (j.ok) b.style.display = 'none'; },
          function(){ b.disabled = false; out.innerHTML = '<span class="gp-err">No connection — please try again.</span>'; });
    };
  });
})();
</script>
</body></html>
